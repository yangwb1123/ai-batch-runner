# 后端工程审查流水线：架构/设计模式/领域建模对抗审查 + 工程门禁。
#
# 场景：对已有后端项目（TS/Go/Python/Java...）做架构级审计——
# 模块边界、依赖方向、状态散落、上帝服务、过度设计（单实现接口、
# Base 类、Factory 泛滥）、事务边界。规范 = backend-specs/ 决策表；
# 可机器检查的由 backendquality 门禁拦截，需要推理的由审查角色对抗发现。
#
# 运行（backendquality 已按项目 manifest 自动定位后端源码根，无需手改 --dir）：
#   pi-batch examples/backend-engineering-review.yaml \
#     --retries 3 --log-file logs/be-review.log
# 只跑机器门禁（manifest 感知：go.mod/Cargo.toml/pom.xml/package.json；
# 无 manifest 时显式跳过，--manifest 可强制指定语言）：
#   python scripts/check-backend-quality.py --dir . --strict --json
# 需求评估（先评估再决定用哪套规则）：
#   pi-batch assess "写一个订单创建接口，含支付审批，生产环境"

git_commit: true
decision_log: docs/DECISIONS.md
archive_dir: docs/archive

stages:
  # ── 1. 盘点：后端源码结构、模块边界、关键文件 ──
  - name: inventory
    from_prompt: |
      Inventory the project's backend code (e.g. src/ or modules/): list
      the module tree, dependency direction between modules, the largest
      files, services with the most constructor dependencies, and where
      state transitions and transactions live. Output a markdown map.
      Do not modify code.
    output: docs/backend/inventory.md
    mode: serial

  # ── 2. 工程对抗审查：编排者现场挑选审查角色并发执行 ──
  # backend_engineer 按 backend-specs 决策链复核实现；design_pattern_reviewer
  # 攻击过度设计（默认假设每个模式都有罪，直到证明解决了真实问题）；
  # architect 复核模块边界与依赖方向。
  - name: engineering_review
    from_outputs: inventory
    meta: true
    role_dir: prompts
    output_dir: docs/backend/reviews
    max_iterations: 2
    mode: serial

  # ── 3. 工程门禁：过度设计/上帝服务/状态散落/依赖方向（stderr 喂回修复）──
  - name: gate
    from_outputs: engineering_review
    aggregate: true
    validate: backendquality
    mode: serial
    tasks:
      - prompt: |
          Summarize the backend review findings and the backendquality gate
          results into an actionable defect list: each item with severity,
          evidence (file/symbol), root cause, fix, and the test that would
          catch it. Mark which findings are machine-verified and which are
          review-verified.
        output: docs/backend/findings.md

  # ── 4. 裁决门：VERDICT: PASS 确认审计闭环 ──
  - name: verdict
    from_outputs: gate
    aggregate: true
    gate: true
    mode: serial
    tasks:
      - prompt: |
          You are the backend gatekeeper. Read {input_content} (the review
          deliverables and the backendquality gate report). Confirm the
          defect list is complete and actionable. Output on the last line:
          VERDICT: PASS - <why the audit is complete>
          or
          VERDICT: FAIL - <what is missing>
        output: docs/backend/verdict.md
