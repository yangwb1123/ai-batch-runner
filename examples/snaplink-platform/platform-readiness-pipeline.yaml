# Phase 4: close the architecture-gate blockers with bounded implementation
# readiness artifacts. This pipeline writes only docs; it does not change a
# product repository or claim that the product implementation is complete.

git_commit: false
decision_log: docs/snaplink-platform/phase4/DECISIONS.md

stages:
  - name: persistence_design
    from_prompt: |
      You are the persistence architect closing the blockers in
      docs/snaplink-platform/phase3/gate-v2.md.
      Read docs/snaplink-platform/PLATFORM_ARCHITECTURE.md,
      docs/snaplink-platform/contracts/WORKFLOW_CONTRACT_V1.md,
      docs/snaplink-platform/contracts/EXECUTION_CONTEXT_V1.md,
      backend-specs/persistence-modeling.md,
      examples/snaplink-platform/platform-map.yaml, and the existing
      sverpweb purchase implementation under
      /home/dwp/workspace/job/sverpweb-stable/apps/api/src/routes/purchase-requests.ts
      if the absolute path is readable.

      Do not call write, edit, or bash tools. Return only the complete
      Markdown artifact in your final response; the runner will save it.
      Produce a concrete but bounded design for the first slice in
      sverpweb-stable (Bun SQLite, current single-tenant deployment). Do not
      claim shared-instance multi-tenancy and do not create a workflow
      repository. The workflow module must not write purchase tables directly;
      it invokes a purchase aggregate command port.

      Use exactly these headings:
      ## Scope and Current Evidence
      ## Persistence Models
      ## Aggregate and Transaction Boundaries
      ## Keys, Tenant Scope and Ownership
      ## State History and Optimistic Concurrency
      ## Idempotency and Retry Records
      ## Indexes, Query Shapes and Limits
      ## Audit Outbox Transaction
      ## Expand Migrate Contract Plan
      ## Deletion, Retention and Recovery
      ## Rejected Designs
      ## Migration Acceptance Checks

      Include table-level columns/types, primary and unique keys, expected
      constraints, transaction pseudocode, version checks, redaction/retention
      decisions, and rollback boundaries. Clearly label Verified,
      Transitional, Proposed and Missing evidence. Do not invent existing
      schemas; mark unknowns as Missing.
    output: docs/snaplink-platform/phase4/01-persistence-design.md
    mode: serial

  - name: workflow_transition_design
    from_outputs: persistence_design
    mode: serial
    tasks:
      - prompt: |
          You are the workflow state-machine architect. Read {input_content},
          docs/snaplink-platform/phase3/gate-v2.md,
          docs/snaplink-platform/PLATFORM_ARCHITECTURE.md,
          docs/snaplink-platform/contracts/WORKFLOW_CONTRACT_V1.md,
          docs/snaplink-platform/contracts/EXECUTION_CONTEXT_V1.md and
          examples/snaplink-platform/platform-map.yaml.

          Do not call write, edit, or bash tools. Return only the complete
          Markdown artifact in your final response; the runner will save it.
          Define the executable first vertical slice: purchase request →
          department approval → finance approval where applicable → explicit
          business command confirmation → execution → audit → cancellation or
          compensation. Keep Workflow independent from purchase aggregate,
          identity, ACL and audit ledger. The current sverpweb deployment is
          single-tenant; tenant context still must be server-derived and
          persisted for future isolation.

          Use exactly these headings:
          ## Definition Versioning
          ## State Machines
          ## Command Contracts
          ## Purchase Approval Transition Table
          ## Work Item and Approval Rules
          ## Execution and Side-effect Boundary
          ## Cancellation Timeout and Retry
          ## Compensation and Recovery
          ## Authorization and Provenance
          ## Idempotency and Concurrency
          ## Error Codes and Client Semantics
          ## Acceptance Test Matrix

          For every transition state preconditions, actor/capability,
          persisted changes, emitted events, idempotency behavior and failure
          result. Explicitly distinguish approved, executable, executing,
          executed, failed, cancelled, compensation_pending and compensated.
          Include segregation of duties and key-field-change reapproval.
          Use event names matching <domain>.<resource>.<action>@vN and
          lowercase dotted permissions with at least three segments.
        output: docs/snaplink-platform/phase4/02-workflow-transitions.md

  - name: audit_integration_design
    from_prompt: |
      You are the audit integration architect. Read
      docs/snaplink-platform/phase4/01-persistence-design.md and
      docs/snaplink-platform/phase4/02-workflow-transitions.md,
      docs/snaplink-platform/phase3/gate-v2.md,
      docs/snaplink-platform/contracts/AUDIT_PROVENANCE_V1.md,
      docs/snaplink-platform/contracts/EXECUTION_CONTEXT_V1.md,
      /home/dwp/snaplink-audit-governance/api/proto/audit.proto,
      /home/dwp/snaplink-audit-governance/api/openapi/openapi.yaml,
      /home/dwp/snaplink-audit-governance/README.md,
      /home/dwp/workspace/job/sverpweb-stable/apps/api/src/audit/contracts.ts,
      /home/dwp/workspace/job/sverpweb-stable/apps/api/src/audit/request-middleware.ts,
      /home/dwp/workspace/job/sverpweb-stable/apps/api/src/integrations/clients/audit-governance-client.ts
      and examples/snaplink-platform/platform-map.yaml.

      Do not call write, edit, or bash tools. Return only the complete
      Markdown artifact in your final response; the runner will save it.
      Close the gate-v2 audit blocker with an evidence-based three-part
      comparison: ingest path, required fields/schema, and active schema
      or compatibility gap. Do not pretend a current best-effort HTTP
      emitter is a durable outbox. Specify the smallest implementation
      change in sverpweb-stable and the receiving compatibility change, if
      any, without directly editing either repository now.

      Use exactly these headings:
      ## Verified Current Interfaces
      ## Contract Comparison
      ## Event and Provenance Mapping
      ## Atomic Outbox Design
      ## Delivery State Machine
      ## Retry DLQ and Idempotency
      ## Receipt and Integrity Evidence
      ## Redaction and Retention
      ## High-risk Fail-closed Policy
      ## Compatibility and Rollout
      ## Missing Evidence and Owners
      ## Audit Acceptance Matrix

      Include concrete HTTP/RPC paths, field mappings, schema versions,
      event examples, local transaction boundaries, delivery receipts,
      permanent versus retryable errors, and tests. Keep audit governance
      as immutable evidence authority, never business-state authority;
      keep OTel as telemetry only.
    output: docs/snaplink-platform/phase4/03-audit-integration.md

  - name: operations_acceptance_design
    from_prompt: |
      You are the production readiness and test architect. Read
      docs/snaplink-platform/phase4/02-workflow-transitions.md and
      docs/snaplink-platform/phase4/03-audit-integration.md,
      docs/snaplink-platform/phase3/gate-v2.md,
      docs/snaplink-platform/PLATFORM_ARCHITECTURE.md,
      docs/snaplink-platform/contracts/AGENT_CAPABILITY_V1.md,
      docs/snaplink-platform/contracts/PLUGIN_MANIFEST_V1.md,
      backend-specs/production-readiness.md,
      backend-specs/testing.md,
      examples/snaplink-platform/platform-map.yaml.

      Do not call write, edit, or bash tools. Return only the complete
      Markdown artifact in your final response; the runner will save it.
      Produce the bounded operational handoff for the sverpweb-stable
      first slice. Cover deployment, migration, rollback, recovery,
      failure, revocation and test acceptance. Do not expand scope to
      shared multi-tenancy, a new repository or a runtime plugin host.

      Use exactly these headings:
      ## First-slice Profile and Deployment Topology
      ## Required Configuration and Secrets
      ## Failure and Degradation Matrix
      ## Outbox and Audit Incident Runbook
      ## Agent Revocation and Fencing Runbook
      ## Migration and Compatibility Runbook
      ## Rollback Versus Compensation
      ## Recovery and Reconciliation
      ## Test Layers and Fixtures
      ## Contract and Security Tests
      ## Observability and SLO Evidence
      ## Definition of Ready for Code
      ## Definition of Done for the Vertical Slice

      Each operational claim must name an owner project, a source of
      truth, an observable signal and a fail-closed/degrade behavior.
      Include exact test scenarios for tenant isolation, approval versus
      execution, cancellation versus compensation, outbox atomicity,
      audit receipts, grant expiry/revocation, self-approval rejection,
      duplicate delivery, migration rollback and startup rejection of
      unsigned/unlocked plugins.
    output: docs/snaplink-platform/phase4/04-operations-acceptance.md

  - name: readiness_summary
    from_prompt: |
      You are the readiness evidence synthesizer. Read
      docs/snaplink-platform/phase4/01-persistence-design.md,
      docs/snaplink-platform/phase4/02-workflow-transitions.md,
      docs/snaplink-platform/phase4/03-audit-integration.md and
      docs/snaplink-platform/phase4/04-operations-acceptance.md,
      docs/snaplink-platform/phase3/gate-v2.md and
      examples/snaplink-platform/platform-map.yaml.

      Do not call write, edit, or bash tools. Return only raw JSON in the
      final response; the runner will save it. Output must start with { and
      end with }, with no Markdown fence or commentary.

      Use exactly this schema:
      {
        "change_id":"COMPOSE-2026-018",
        "primary_project":"sverpweb-stable",
        "status":"READY_FOR_INDEPENDENT_GATE|BLOCKED",
        "blockers":[{"id":"","owner":"","evidence":"","resolution":""}],
        "persistence":{"tables":[],"transaction_boundaries":[],"migration_steps":[],"open_questions":[]},
        "workflow":{"states":[],"commands":[],"events":[],"approval_rules":[],"compensation_rules":[]},
        "audit":{"ingest_path":"","schema_version":"","outbox_contract":"","receipt_contract":"","missing_evidence":[]},
        "operations":{"failure_cases":[],"runbooks":[],"tests":[],"definition_of_ready":[],"definition_of_done":[]},
        "ownership":{"collaborating_projects":[],"unaffected_projects":[],"sources_of_truth":{}},
        "risks":[]
      }

      Keep names exact, concise and evidence-based. Do not claim that
      code, migrations, tests or audit receipts already exist when the
      artifact only specifies them. Set status to READY_FOR_INDEPENDENT_GATE
      only if every gate-v2 blocker has a concrete artifact, owner and
      acceptance evidence; otherwise set BLOCKED.
    output: docs/snaplink-platform/phase4/readiness-summary.json
