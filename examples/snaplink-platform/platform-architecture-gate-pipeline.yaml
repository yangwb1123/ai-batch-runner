# 平台总体架构独立 Gate（压缩证据版）
#
# 原始推进流水线的 adversarial review 工件可能超过单次 prompt 上限。
# 此 Gate 只读取 phase3 顶层的压缩证据和 review triage，不读取角色原文，
# 保持输入有界并 fail closed。

git_commit: false
decision_log: docs/snaplink-platform/phase3/DECISIONS.md

stages:
  - name: architecture_gate
    from_prompt: |
      You are the independent architecture gatekeeper. Read the bounded
      evidence bundle at @docs/snaplink-platform/phase3/07-gate-evidence.md
      and the exact project map at
      @examples/snaplink-platform/platform-map.yaml.
      Do not call write, edit, or bash tools. Return only the complete gate
      artifact in your final response; the runner will save it.

      Verify all of the following:
      1. Exactly one primary project is selected for the first slice and it
         is a real project in platform-map.yaml.
      2. Workflow state is separate from identity, asset ACL, audit ledger
         and business aggregate state.
      3. The first slice does not claim sverpweb is multi-tenant.
      4. Tenant and department identifiers are server-validated and are not
         derived from names or client-selected tenant switches.
      5. Approval is distinct from execution; cancellation is distinct from
         compensation; irreversible actions are explicit.
      6. Human, service, automation and Agent provenance is preserved and
         Agent capability is down-scoped, short-lived, revocable and cannot
         self-approve or self-elevate.
      7. Business state and local durable audit outbox are transactionally
         linked; audit-governance is evidence source, not business state
         source; telemetry is not audit evidence.
      8. No direct cross-project database access, ACL dual-write, arbitrary
         runtime code plugin or long-lived human Token for Agent.
      9. Profile/plugin, failure, deployment, rollback, recovery and test
         plans are bounded and do not silently expand to a new repository.
      10. All blocking issues in the review triage are either rejected with
          evidence or addressed in the change plan.

      End with exactly one non-bare line:
      VERDICT: PASS - <why the bounded contract is ready for human approval>
      or
      VERDICT: FAIL - <blocking issues that must be fixed>
    output: docs/snaplink-platform/phase3/gate-v2.md
