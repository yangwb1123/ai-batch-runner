# Project-level discovery -> analysis -> selection -> full SDLC implementation.
name: repository-improvements

discovery:
  roots:
    - domains
    - interfaces
    - infrastructure
    - platform
    - protocols
    - shared
  exclude:
    - testdata
    - gen
    - generated
    - mock
    - defaultimpl
    - tests
    - docs
    - examples
    - prompts
    - pipelines
    - logs
    - vendor
    - node_modules
    - target
    - .venv
    - .git
    - .github
    - .pi-batch
    - __pycache__
  max_depth: 1
  # Standalone repositories without the Snaplink layer names are scanned by
  # their top-level source directories instead.
  fallback_top_level: true

analysis:
  jobs: 4
  retries: 2
  candidate_limit: 3
  # Adaptive controls. budget_tokens=0 means no hard-coded token quota:
  # remaining provider invocation/daily caps and observed telemetry govern the
  # next batch. batch_size is only the cold-start/config-template fallback.
  # --focus can rank modules from the current task/request.
  batch_size: 4
  budget_tokens: 0
  token_estimate: 8000
  prompt: |
    Analyze module '{module}' at {module_path} and its related interfaces in the repository.
    Return ONLY a JSON array with at most {candidate_limit} high-value improvement directions, sorted by value.
    Each object must contain: title, problem, value (1-10), risk_reduction (1-10), effort (1-10), confidence (1-10), evidence (array of existing file/symbol paths), and acceptance (array of testable checks).
    evidence and acceptance MUST be JSON arrays of strings, e.g.:
    {"title": "...", "problem": "...", "value": 7, "risk_reduction": 6, "effort": 2, "confidence": 8,
     "evidence": ["internal/storage/local_read.go:42"], "acceptance": ["go test ./internal/storage -run TestX passes"]}
    Do not modify code. Claims without repository evidence must be identified as proposed, not verified.

selection:
  max_directions: 1
  max_total_directions: 1  # one bounded implementation at a time
  minimum_score: 0

# Failed changes are preserved in place; dirty worktrees block automatic retries.
recovery:
  enabled: true
  max_attempts: 1
  restore_on_failure: false  # legacy setting; campaign recovery never resets Git
  narrow_scope: true
  max_roles_per_iteration: 2
  allow_failed_roles: 1
  stop_after_stalled_rounds: 2

preflight:
  require_repo_validator: true

implementation:
  pipeline: examples/repository-campaign-pipeline.yaml
  requirement_stage: requirements
  concurrency: 1
  # Hard wall-clock limit for each isolated direction pipeline.
  timeout: 14400
  # Evidence-based stall watchdog (0 = disabled; hard timeout remains active).
  # Set this below timeout only when the pipeline log/artifacts are expected to
  # advance at that cadence; model thinking can legitimately be quiet.
  no_progress_timeout: 0
  # Empty by default: worktrees and campaign reports/state are kept under
  # ~/.codex/pbatch/projects/<workspace>/ and never pollute the repository.

state:
  line_max_bytes: 262144

estimates:
  analysis_minutes: 3
  pipeline_minutes: 20
