# Declarative defaults for pi-batch.py. Optional — pi-batch.py runs fine
# without this file, falling back to the values below. Copy pi-batch.py +
# this file into another project and edit `agent.bin` to point at whatever
# CLI agent you use (pi, claude, codex, gemini, opencode, ...); no code
# changes needed.

agent:
  # The CLI binary invoked for every task. Must accept:
  #   <bin> -p PROMPT [--model M] [--provider P] [--thinking T] [--tools T] [--exclude-tools T]
  bin: pi
  default_model: ""     # empty = the agent's own default
  default_timeout: 900  # seconds, per task (aligned with pi httpIdleTimeoutMs)
  default_workers: 4    # parallel mode default worker count
  # Session reuse flags used by --session-mode shared/per-stage.
  # {session} is the session id, {name} the display name. Other agent CLIs
  # can point these at their own continue-session flags; omit the key to
  # fall back to these pi-style flags.
  session_flags:
    start: ["--session-id", "{session}", "--name", "{name}"]
    continue: ["--session-id", "{session}"]

# Preserve pi's original JSONL messages, but inject only a small metadata
# manifest. The current LLM decides whether to call `pi-batch.py memory`
# for more history; other agent CLIs remain unchanged in auto mode.
memory:
  mode: auto
  agent_names: [pi]
  index_file: .pi-batch/memory/sessions.index.jsonl
  manifest_recent: 3
  # Execute-mode static precheck searches only this many newest metadata rows
  # for matching domains; it never scans all history on every prompt.
  manifest_scan: 30
  manifest_max_bytes: 4096
  read_max_bytes: 65536
  # Reject pathological metadata records; raw Pi messages remain untouched.
  index_line_max_bytes: 262144

# Raw session files remain owned by Pi and are never rewritten. These bounds
# govern only coordinator scans/rotation decisions.
session:
  max_bytes: 2097152
  line_max_bytes: 4194304

# Operational logs contain lifecycle/gate metadata, not complete model
# messages. "auto" streams model bodies only on an interactive terminal;
# use --stream-output full|none for an explicit per-run override.
logging:
  stream_output: auto
  max_bytes: 5242880
  backups: 3

# Maximum combined artifact content and source candidates injected into
# aggregate/meta prompts. Full artifacts remain on disk; truncation/omission
# markers make prompt reduction explicit.
input:
  # Bound repository prompt/task/template reads before they reach the argv
  # prompt gate. Full artifacts remain on disk; oversized sources fail closed.
  max_bytes: 2097152

evidence:
  max_bytes: 65536
  max_sources: 64

# Prompts are passed as one `-p` process argument; keep below the common
# Linux 128KiB per-argument limit. Set 0 only on a compatible agent adapter.
prompt:
  max_bytes: 122880

# Bound stdout and stderr captured from external engineering gates.
validation:
  output_max_bytes: 262144

# Repository-wide post-stage hooks (`commands`) use the same process-group
# cleanup as validators, with their own deadline and diagnostic budget.
commands:
  timeout: 600
  output_max_bytes: 262144

# Named engineering gates, referenced via --validate NAME[,NAME...] or a
# task/stage validate field. Commands run against each generated artifact
# before it is committed; {output} and {cwd} placeholders are substituted at
# run time. Add project gates here instead of repeating shell strings.
validators:
  quick: "python cli.py check"
  gofmt: 'test -z "$(gofmt -l {output})"'
  build: "go build ./... && go vet ./..."
  config: "python cli.py config-validate"
  root: "python cli.py check-root"
  # Reference path had an  prefix (snaplink repo layout); this repo
  # keeps quality.py at the root, so the path is adapted accordingly.
  pyquality: "python {cwd}/quality.py {cwd}"
  # T12f: reject artifacts containing likely secrets (registry hook, not a
  # built-in scanner). Adapt the patterns to the project's secret formats.
  secretscan: 'grep -nE "(api[_-]?key|secret|password|token|private[_-]?key)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+-]{8,}" {output} && exit 1 || exit 0' 

  # UI generation gates: AI-generated TSX/Dart spacing/color/style problems
  # are specification problems, so these deterministic checks reject
  # artifacts mechanically (fail closed -> retry feedback loop). Attach via
  # stage `validate: uispacing,uicolor,uistyle` on UI generation stages.
  uispacing: "python {cwd}/scripts/check-ui-spec.py --mode spacing {output}"
  uicolor: "python {cwd}/scripts/check-ui-spec.py --mode color {output}"
  uistyle: "python {cwd}/scripts/check-ui-spec.py --mode style {output}"
  # Project-wide frontend UI spec gate (gofmt -l style): scans the whole
  # frontend source tree for spec violations, not just one artifact. Adapt
  # --dir to the project's frontend root; no frontend files found -> pass.
  # Violations (stderr) feed the retry prompt, driving the refactor loop.
  uicheck: "python {cwd}/scripts/check-ui-spec.py --dir {cwd}/src --all --json -o {cwd}/docs/ui/refactor/report.json"
  # Project-wide frontend ENGINEERING gate (gofmt -l style): machine-checkable
  # half of the engineering spec — console.log/any/unsafe html are always
  # errors; god-file/complexity budgets fail with --strict. Judgment calls
  # (races, debounce policy, state placement) go to the engineering review
  # roles and ui-specs/engineering/defect-patterns.md.
  uiquality: "python {cwd}/scripts/check-frontend-quality.py --dir {cwd}/src --strict --json -o {cwd}/docs/ui/refactor/quality.json"
  # Project-wide BACKEND engineering gate (gofmt -l style): over-engineering
  # signals (single-implementation interfaces, Base classes, fuzzy names),
  # god-service signals, scattered status assignment, domain->infra imports
  # are mechanically enforced; pattern necessity goes to the review roles.
  backendquality: "python {cwd}/scripts/check-backend-quality.py --dir {cwd}/src --strict --json -o {cwd}/docs/ui/refactor/backend-quality.json"
  # Definition-of-Done gate: the artifact must carry an honest completion
  # report (commands executed vs not_executed, no fabricated passes).
  completion: "python {cwd}/scripts/check-completion-report.py {output}"

# Task type classifier: runs BEFORE execution (--classify / `classify`
# subcommand). Frontend UI tasks route to the UI generation pipeline, which
# applies the ui-specs + UI validators + meta UI review + verdict gate.
classifier:
  # Optional keyword map override (default: pbatch/task_keywords.yaml).
  keywords: ""
  # Pipeline for frontend-dominated batches; resolved against cwd, the
  # entry script dir, then the package dir. Missing file fails loudly.
  frontend_pipeline: examples/ui-generation-pipeline.yaml
  # Pipeline for backend-dominated batches (symmetrical to frontend).
  backend_pipeline: examples/backend-implementation-pipeline.yaml
  # Minimum top score for a confident classification (2 = one strong hit).
  min_score: 2
  # Route when this share of a batch's tasks classify as frontend UI.
  frontend_ratio: 0.5

commit:
  prefix: "[pi-batch]"
