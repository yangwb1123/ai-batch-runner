# Declarative defaults for pi-batch.py. Optional — pi-batch.py runs fine
# without this file, falling back to the values below. Copy pi-batch.py +
# this file into another project and edit `agent.bin` to point at whatever
# CLI agent you use (pi, claude, codex, gemini, opencode, ...); no code
# changes needed.
config_version: 1

agent:
  # The CLI binary invoked for every task. Must accept:
  #   <bin> -p PROMPT [--model M] [--provider P] [--thinking T] [--tools T] [--exclude-tools T]
  bin: pi
  default_model: "gpt-5.6-luna:max"
  default_timeout: 1500  # seconds, per task (aligned with pi httpIdleTimeoutMs)
  default_workers: 4    # parallel mode default worker count
  # Agent argv adapter. A string is one argv token; []/"" disables an
  # optional capability. prompt: "" makes the prompt positional.
  argument_flags:
    prompt: "-p"
    model: "--model"
    provider: "--provider"
    thinking: "--thinking"
    tools: "--tools"
    exclude_tools: "--exclude-tools"
  # Session reuse flags used by --session-mode shared/per-stage.
  # {session} is the session id, {name} the display name. Other agent CLIs
  # can point these at their own continue-session flags; omit the key to
  # fall back to these pi-style flags.
  session_flags:
    start: ["--session-id", "{session}", "--name", "{name}"]
    continue: ["--session-id", "{session}"]
  # G line: failure signatures that reject agent output (quota/rate-limit/
  # auth/network/CLI banners). Defaults cover pi/OpenAI-compatible providers;
  # override globally (below) or per binary (agents.<bin>.*). Empty list
  # disables signature rejection for that agent.
  # error_patterns:
  #   - "rate.?limit"
  #   - "^(?i)error:"
  # provider_error_patterns is the narrower health subset used by the shared
  # circuit breaker. It wins over error_patterns; when omitted, a legacy
  # custom error_patterns list remains compatible except for built-in
  # request/banner-only signatures.
  # Per-agent overrides (win over the global agent.* keys): claude/codex/
  # gemini have different session-flag syntax and failure signatures.
  agents:
    pi:
      # Delegation-only meta planners must be mechanically unable to run tools.
      no_tools_args: ["--no-tools"]
    codex:
      # Codex non-interactive mode is a subcommand: `codex exec <prompt>`.
      # The prompt flag is positional (empty = positional); "exec" is the
      # leading subcommand token that precedes the positional prompt.
      argument_flags:
        prompt: ["exec"]
        model: "-m"
      # In session-led Codex argv, {session} means the provider thread_id.
      # The runner captures it from the first thread.started JSONL event.
      # --approve-for-me sits INSIDE each template: codex exec resume|fork
      # rejects trailing --approve-for-me (clap strict layout), so it must
      # precede the subcommand; the {prompt} placeholder makes these
      # session-led layouts (prompt emitted where it sits, not after bin).
      capture_thread_id: true
      # Explicit stdout trust contract. The runner parses every record
      # fail-closed and projects only the final completed agent message.
      output_protocol: codex-jsonl
      session_flags:
        start: ["exec", "--approve-for-me", "{prompt}"]
        continue: ["exec", "--approve-for-me", "resume", "{session}", "{prompt}"]
        fork: ["exec", "--approve-for-me", "fork", "{session}", "{prompt}"]
      # Invocation-level flags appended after every constructed argv.
      # --json is the official non-interactive transcript mode: stdout is
      # structured thread/turn/item JSONL and stderr stays operational
      # (design §9.3); without it codex echoes the full transcript on
      # stderr, which false-matches failure signatures when the model
      # quotes project docs (AGENTS.md §2.2). Phase 1 Structured Exec
      # Adapter consumes the same JSONL.
      extra_args: ["--approve-for-me", "--json"]
      # Prefer precise signatures: codex's stderr transcript ECHOES the
      # user prompt, so broad words like bare `rate limit` would self-match
      # (P0 lesson: keep the anti-misfire discipline from AGENTS.md §2.2).
      error_patterns:
        - "insufficient_quota|quota exceeded"
        - "rate.?limit_?error|rate.?limit exceeded"
        - "codex: "
      # Do not let the broad `codex: ` artifact-rejection banner poison
      # provider health for every Codex-local CLI diagnostic.
      provider_error_patterns:
        - "insufficient_quota|quota exceeded"
        - "rate.?limit_?error|rate.?limit exceeded"
    claude:
      # Claude print mode (-p) suits interactive handoff and scripted runs.
      argument_flags:
        prompt: "-p"
        model: "--model"
      # {session} is pi-batch's session id; when it differs from Claude's
      # native id, the user/handoff must explicitly supply the native id.
      session_flags:
        start: []
        continue: ["--resume", "{session}"]
        fork: ["--resume", "{session}", "--fork-session"]
      extra_args: []
    gemini:
      # Gemini uses unattended YOLO approval and skips workspace trust prompts.
      argument_flags:
        prompt: "-p"
        model: "-m"
      extra_args: ["--approval-mode", "yolo", "--skip-trust"]
      # Gemini has no explicit session-id argument; every round starts fresh.
    opencode:
      # OpenCode's `run` subcommand is the non-interactive positional-prompt path.
      argument_flags:
        prompt: ["run"]
        model: "-m"
      session_flags:
        start: []
        continue: ["-s", "{session}"]
        fork: ["-s", "{session}", "--fork"]
      extra_args: []

# Target-project layout. Relative paths resolve against each task cwd and
# are exposed to validators as {frontend_root}/{backend_root}/{report_root}.
project:
  frontend_root: src
  backend_root: src
  report_root: docs

# F line: provider rate limiting. A process-wide token bucket serializes
# agent invocations across parallel workers and meta role fan-out;
# --min-interval only throttles successful SERIAL tasks. 0 = unlimited.
# CLI flags --rate-limit / --rate-burst override these per run.
limits:
  per_second: 0        # max agent invocations per second (0 = unlimited)
  # Provider 级熔断（T17a）：连续 N 次 provider 失败签名（quota/rate/
  # auth/network，跨任务累计）→ 指数退避冷却，冷却中任务先等待；
  # 同一 provider 任一成功重置其窗口；不同 provider/agent 互不串扰。
  # 7×24 无人值守防 provider 系统性故障空转。
  provider_breaker:
    threshold: 5          # 连续失败数（0 = 关闭）
    base_cooldown: 60     # 首次冷却秒（×2 退避）
    max_cooldown: 900     # 单段冷却上限；超出后任务明确失败
    # 等待预算：默认 = max_cooldown（并以它封顶），保证单段冷却能被等出来；
    # 预算小于冷却时任务一次都不等就失败，quota 级冷却（默认 24h）仍然快速失败。
    # wait_budget: 900

  burst: 1             # token bucket capacity
  providers: {}        # provider -> rate, e.g. {openai: 2, local: 0}; 0 = unlimited
  # Campaign isolated worktrees share this state through PBATCH_RATE_LIMIT_FILE.
  # The campaign command sets it automatically; direct runners may set the env.


# Preserve pi's original JSONL messages, but inject only a small metadata
# manifest. The current LLM decides whether to call `pi-batch.py memory`
# for more history; other agent CLIs remain unchanged in auto mode.
memory:
  mode: auto
  agent_names: [pi]
  # Memory queries are scoped by tenant + project digest + sensitivity.
  # PBATCH_MEMORY_TENANT / PBATCH_MEMORY_SENSITIVITY override these per worker.
  tenant: default
  sensitivity: internal
  index_file: .pi-batch/memory/sessions.index.jsonl
  manifest_recent: 3
  # Execute-mode static precheck searches only this many newest metadata rows
  # for matching domains; it never scans all history on every prompt.
  manifest_scan: 30
  manifest_max_bytes: 4096
  read_max_bytes: 65536
  # Reject pathological metadata records; raw Pi messages remain untouched.
  index_line_max_bytes: 262144
  # Compact metadata at the append boundary; raw Pi sessions are retained.
  index_max_bytes: 16777216

# Trusted RuntimeEvent audit stream used to rebuild disposable TUI
# projections.  Each logical session is isolated by the same
# tenant/project/sensitivity boundary as progressive memory.
tui:
  journal_enabled: true
  journal_max_bytes: 16777216
  # Command cards keep a small event/timeline preview. Larger typed command
  # output is retained privately under data_dir and exposed as ArtifactRef.
  command_artifact_max_bytes: 2097152
  command_artifact_store_max_bytes: 67108864
  command_artifact_max_files: 256

# Raw session files remain owned by Pi and are never rewritten. These bounds
# govern only coordinator scans/rotation decisions.
session:
  max_bytes: 2097152
  line_max_bytes: 4194304

# Operational logs contain lifecycle/gate metadata, not complete model
# messages. "auto" streams model bodies only on an interactive terminal;
# use --stream-output full|none for an explicit per-run override.
logging:
  stream_output: auto
  max_bytes: 5242880
  backups: 3

# Maximum combined artifact content and source candidates injected into
# aggregate/meta prompts. Full artifacts remain on disk; truncation/omission
# markers make prompt reduction explicit.
input:
  # Bound repository prompt/task/template reads before they reach the argv
  # prompt gate. Full artifacts remain on disk; oversized sources fail closed.
  max_bytes: 2097152

evidence:
  max_bytes: 65536
  max_sources: 64

# Prompts are passed as one `-p` process argument; keep below the common
# Linux 128KiB per-argument limit. Set 0 only on a compatible agent adapter.
prompt:
  max_bytes: 122880

# Bound stdout and stderr captured from external engineering gates.
validation:
  output_max_bytes: 262144

# Repository-wide post-stage hooks (`commands`) use the same process-group
# cleanup as validators, with their own deadline and diagnostic budget.
commands:
  timeout: 600
  output_max_bytes: 262144

# Named engineering gates, referenced via --validate NAME[,NAME...] or a
# task/stage validate field. Commands run against each generated artifact
# before it is committed; {output} and {cwd} placeholders are substituted at
# run time. Add project gates here instead of repeating shell strings.
#
# Entries may be a command string (as below) or a mapping:
#   cmd:   shell command with {output}/{cwd} placeholders
#   judge: true = LLM-as-judge protocol — the gate must reply with
#          'VERDICT: PASS|FAIL - <reason>' (bare PASS or no verdict fails
#          closed). Use scripts/judge.py to wrap an agent call, or any
#          command that emits VERDICT lines.
#   scope: 'file' (default) = run per artifact before commit;
#          'repo' = full-tree gate (go build ./..., quality.py, uicheck)
#          deferred to the END of the stage/batch so it never races
#          concurrent role agents writing the tree (N2). Repo gates see
#          the finished stage; use {cwd}, not {output}, in their commands.
validators:
  quick: "python cli.py check"
  gofmt: 'test -z "$(gofmt -l {output})"'
  build: "go build ./... && go vet ./..."
  config: "python cli.py config-validate"
  root: "python cli.py check-root"
  # Reference path had an  prefix (snaplink repo layout); this repo
  # keeps quality.py at the root, so the path is adapted accordingly.
  pyquality: "python {cwd}/quality.py {cwd}"
  designintelligence: "python {tool_root}/scripts/check-design-intelligence.py --dir {frontend_root} --json --skip .dart_tool,test,build,ephemeral"
  backendexperience: "python {tool_root}/scripts/check-backend-experience.py --dir {backend_root} --json --skip .dart_tool,test,build,ephemeral,vendor"
  knowledge: "python {tool_root}/scripts/check-knowledge-freshness.py --dir {cwd} --json --skip .git,.dart_tool,test,build,vendor --skip-modules pbatch,checks,scripts,tools"
  # T12f: reject artifacts containing likely secrets (registry hook, not a
  # built-in scanner). Adapt the patterns to the project's secret formats.
  secretscan: 'grep -nE "(api[_-]?key|secret|password|token|private[_-]?key)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+-]{8,}" {output} && exit 1 || exit 0' 
  # Go 项目（aero-id 等）：任务 cwd 为仓库根时直接可用
  gobuild: "go build ./... && go vet ./..."
  gotest: "go test ./... -count=1"
  # aero-vault 等 Go 仓库的 repo-scope 门禁：阶段末尾对整树执行一次（N2），
  # 避免与并发角色写入竞争。make check = gofmt+build+vet+test+filesize。
  gorepo:
    cmd: "make check"
    scope: repo
  clirepo:
    cmd: "python3 cli.py check"
    scope: repo
  # Rust 仓库（aero-im 等）：repo-scope cargo check，阶段末尾跑一次（N2），
  # 避免与并发角色写入竞争；cargo check 退出码即门禁。
  cargocheck:
    cmd: "cargo check --quiet"
    scope: repo
    # This gate is for Rust repositories; non-Rust campaign targets record a
    # visible not-applicable skip instead of failing on a missing manifest.
    requires_any: [Cargo.toml]
  # 目标仓库无 scripts/check-completion-report.py 时，通过可移植的
  # {tool_root} 占位符引用本工具集，避免绑定安装机器的绝对路径。
  completion_go:
    cmd: "python {tool_root}/scripts/check-completion-report.py {output}"

  # UI generation gates: AI-generated TSX/Dart spacing/color/style problems
  # are specification problems, so these deterministic checks reject
  # artifacts mechanically (fail closed -> retry feedback loop). Attach via
  # stage `validate: uispacing,uicolor,uistyle` on UI generation stages.
  uispacing: "python {tool_root}/scripts/check-ui-spec.py --mode spacing {output}"
  uicolor: "python {tool_root}/scripts/check-ui-spec.py --mode color {output}"
  uistyle: "python {tool_root}/scripts/check-ui-spec.py --mode style {output}"
  uifont: "python {tool_root}/scripts/check-ui-spec.py --mode font {output}"
  # Project-wide frontend UI spec gate (gofmt -l style): scans the whole
  # frontend source tree for spec violations, not just one artifact. The
  # scan root comes from the top-level ui_scan_dir key (below); default
  # {cwd}/src. Checker scripts come from this portable tool distribution and
  # reports use project.report_root. No frontend files found -> pass with an
  # explicit stderr warning (never a silent vacuous green). Violations feed
  # the retry prompt, driving the refactor loop.
  uicheck: "python {tool_root}/scripts/check-ui-spec.py --dir {ui_scan_dir} --all --json -o {report_root}/ui/refactor/report.json"
  # UI 几何门禁：裸数字小偏移/随机圆角/随机线条宽度（ui-specs/geometry.md）
  uigeometry: "python {tool_root}/scripts/check-ui-geometry.py --dir {ui_scan_dir} --all --json -o {report_root}/ui/refactor/geometry.json"
  # Project-wide frontend ENGINEERING gate (gofmt -l style): machine-checkable
  # half of the engineering spec — console.log/any/unsafe html are always
  # errors; god-file/complexity budgets fail with --strict. Judgment calls
  # (races, debounce policy, state placement) go to the engineering review
  # roles and ui-specs/engineering/defect-patterns.md.
  uiquality: "python {tool_root}/scripts/check-frontend-quality.py --dir {ui_scan_dir} --strict --json -o {report_root}/ui/refactor/quality.json"
  # SVERP project engineering gate: changed-file hard errors plus the
  # repository's API/Web typecheck, test, and build gate. It is guarded by
  # requires_any so unrelated projects do not accidentally run SVERP checks.
  engineering:
    cmd: "bash {tool_root}/scripts/sverp/check-engineering-gate.sh {cwd}"
    scope: repo
    requires_any: [apps/api/package.json, apps/web/package.json]
  # Project-wide BACKEND engineering gate (gofmt -l style): over-engineering
  # signals (single-implementation interfaces, Base classes, fuzzy names),
  # god-service signals, scattered status assignment, domain->infra imports
  # are mechanically enforced; pattern necessity goes to the review roles.
  # --dir {cwd} is manifest-aware and fail-closed: missing dir -> exit 1;
  # backend manifest (go.mod/Cargo.toml/pom.xml/package.json, walk-up <=6
  # levels) with 0 files scanned -> exit 1; no manifest -> exit 0 with an
  # explicit 'no backend manifest detected; gate skipped' signal. Report is
  # written to docs/backend/ (not the ui/refactor dir).
  backendquality: "python {tool_root}/scripts/check-backend-quality.py --dir {cwd} --strict --json -o {report_root}/backend/backend-quality.json"
  # Definition-of-Done gate: the artifact must carry an honest completion
  # report (commands executed vs not_executed, no fabricated passes).
  completion: "python {tool_root}/scripts/check-completion-report.py {output}"
  # Fail-closed refusal gate: LLM "cannot proceed" artifacts are failures.
  refusalcheck: "python {tool_root}/scripts/check-no-refusal.py {output}"
  # H line (LLM-as-judge): a judge gate must answer VERDICT: PASS|FAIL - reason;
  # fail closed on bare/missing verdicts. scripts/judge.py wraps the agent.
  # quality_judge:
  #   cmd: 'python {tool_root}/scripts/judge.py -p "Does the design meet the rubric? VERDICT: PASS|FAIL - reason." {output}'
  #   judge: true
  # Evolution Patterns 第四域门禁（归纳自 snaplink-console / iris-ui 实战，
  # 见 evolution-specs/rules.yaml）：
  #   L1 baseline-first 产品基线先行（缺基线 → 方向只能标 [PROPOSED]）
  baseline: "python {tool_root}/scripts/check-baseline.py {cwd}"
  #   L2 authority-layering 权威源分层（产物能力声明必须带契约出处）
  authority: "python {tool_root}/scripts/check-authority.py {output} --dir {cwd}"
  #   L7 evidence-discipline 证据纪律（[PROPOSED] 不得冒充 VERIFIED）
  evidence: "python {tool_root}/scripts/check-evidence.py {output}"
  #   L6 non-goal-restraint 明确不做（方向撞线 fail closed）
  nongoal: "python {tool_root}/scripts/check-nongoal.py {output} --dir {cwd}"
  #   L9 change-budget 变更预算（≤5 文件/≤300 行，allowlist/denylist）
  changebudget: "python {tool_root}/scripts/check-changebudget.py --dir {cwd}"
  # N2 (repo scope): full-tree gates run once at stage/batch end, never per
  # artifact mid-stage (they would race concurrent writers). Repo gates use
  # {cwd}; {output} is substituted with the stage's output directory.
  # gofullbuild: {cmd: "go build ./... && go vet ./...", scope: repo}

# Optional: project frontend scan root for uicheck/uigeometry/uiquality
# (the {ui_scan_dir} placeholder in the validator commands above).
# Unset -> {cwd}/src (backward compatible); relative paths resolve against
# the task working directory; absolute paths are used as-is; empty string
# is treated as unset. Projects with frontend code outside src/ (lib/,
# app/, frontend/) must set this, or the gates scan 0 files and pass
# vacuously: uicheck emits an explicit stderr warning; uigeometry/uiquality
# stay silent (their JSON reports expose files_scanned: 0).
# ui_scan_dir: lib

# Task type classifier: runs BEFORE execution (--classify / `classify`
# subcommand). Frontend UI tasks route to the UI generation pipeline, which
# applies the ui-specs + UI validators + meta UI review + verdict gate.
classifier:
  # Optional keyword map override (default: pbatch/task_keywords.yaml).
  keywords: ""
  # Pipeline for frontend-dominated batches; resolved against cwd, the
  # entry script dir, then the package dir. Missing file fails loudly.
  # Real implementation into the project (ui-generation-pipeline.yaml stays
  # as the artifact-style template).
  frontend_pipeline: examples/frontend-implementation-pipeline.yaml
  # Pipeline for backend-dominated batches (symmetrical to frontend).
  backend_pipeline: examples/backend-implementation-pipeline.yaml
  # Minimum top score for a confident classification (2 = one strong hit).
  min_score: 2
  # Route when this share of a batch's tasks classify as frontend UI.
  frontend_ratio: 0.5
  # Backend uses an independent threshold. Frontend is the compatibility
  # default for equal confident majorities; plain/backend are explicit options.
  backend_ratio: 0.5
  tie_policy: frontend

commit:
  prefix: "[pi-batch]"

# Device-Aware Execution Fabric (AADM-D, docs/AADM_DEVICE.md) — Phase 0.
# OFF by default: `enabled` only loads the fabric module. It never implies
# network scanning, remote execution, migration, or sensitive-data
# distribution — those are separate, individually-authorized capabilities.
# `pi-batch devices list|probe` works read-only in any mode (INVENTORY).
# AADM-R §21 运行时策略（渐进式执行内核）：默认从最低充分模式开始，
# 升级只由证据驱动（profile 的 L0-L3 路由 + 硬触发器）。
runtime_policy:
  start_mode: 0          # 模式下界：0=L0 起步；策略说 L1 起步就不降到 L0
  auto_escalate: true
  auto_deescalate: true
  agents:
    default_count: 1     # 默认 1 个 Agent；有明确收益才增加
    max_parallelism: 4
  strategies:
    default_paths: 1     # 默认 1 个方案；不确定性高才开多路径（racing）
    max_paths: 3
  resources:
    observe: true        # 始终记录时间/Token/成本
    affect_solution: false  # 默认不因便宜选质量差的方案
  quality:
    never_skip_required_proofs: true
    never_claim_unexecuted_tests_passed: true

device_fabric:
  enabled: false
  # off < inventory < observe < execute < migrate < federate
  # 启用时按 inventory → observe → execute 逐步升级（AADM-D §4）
  mode: "off"
  discovery:
    # 主动扫描默认关闭（安全/隐私）；设备主动注册优于网络扫描。
    lan_active_scan: false

  probe:
    # 性能探测占用设备资源，单独启用；探测与修复必须分离。
    benchmark: false
    auto_install: false

  security:
    approval_required_for_new_device: true
    mtls_required: true
    short_lived_credentials: true

  # 静态登记设备（只登记不探测；远程能力后续阶段实现）。
  inventory:
    static:
      # - name: rtx-node
      #   kind: physical_device
      #   host: rtx-node
      #   labels: { ai.backend.cuda: "true" }
      #   trust:
      #     level: 3
      #     zone: trusted-datacenter
      #     max_effect_class: sandboxed
      #     allowed_data_classes: [public, internal]

# 共享 agent run 账本（多 Agent 互见）：默认关（与 device_fabric 同款克制）；
# 开启后每次任务执行尝试及实际 validator 结果写结构化记录到
# data_dir/agents/ledger.jsonl —— 不同 agent 的任务/会话/产物互相可见；
# 路由评估使用模型、耗时、usage 和不含 prompt 正文的任务指纹。
agent_ledger:
  enabled: true

# 难度感知模型路由（T14）：默认关；开启后按任务画像选 model 档位，
# 每日 invocation 配额（--daily-budget）剩余比例低于阈值时自动降档。
# 显式指定的 model（--model / 任务 / 阶段）永不覆盖。
# 性价比策略：默认档（low）用最具性价比的模型（如 deepseek-v4-flash /
# gpt-5.6-luna），并配合 default_thinking=max —— 便宜模型 + 满血思维
# 换取接近旗舰模型的质量；tiers 按你的 provider 能力填写。
model_routing:
  enabled: false
  default_thinking: "max"        # 档位未写 thinking 时继承（思维模式开满）
  tiers:
    low:      {model: "deepseek-v4-flash"}   # 性价比默认（也可 gpt-5.6-luna）
    medium:   {model: "gpt-5.6-luna"}
    high:     {model: "gpt-5.6"}
    critical: {model: "gpt-5.6-sol"}         # 支付/生产事故/高风险
  downgrade:
    enabled: true                # 配额见底时降级（保护性成本控制）
    remaining_ratio_threshold: 0.25    # 剩余 < 25% 时降至 min_tier
    min_tier: low
