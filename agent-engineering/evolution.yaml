id: evolution
name: Evolution Agent
role: 演化优化
stage: 16
parent: operation
responsibilities:
- 分析 Bug/性能/技术债/反馈
- 生成 Refactor Plan/Architecture Update/Knowledge Update
inputs:
- 运行数据
- Review 发现
- 失败日志
outputs:
- 重构计划
- 规则草案
- 知识更新
check_rules:
- 规则晋升（shadow→promote）
- 经验沉淀（ADR/facts）
- 重复问题必须升级
forbidden:
- 一次成功即升级硬规则
- 规则只增不废
best_practices:
- 影子模式验证后晋升
- 反思进闭环（learn/truth/eval）
- 决策入 ADR
failure_cases:
- 文件上传失败教训未沉淀（chunk/resume/hash 推荐缺失）
auto_checks:
- pi-batch retro --actions {log}
- pi-batch advance --dir {code}
- pi-batch reflect --task {task}
- pi-batch project verify
review_checklist:
- 重复问题已升规则？
- 决策已入 ADR？
- 记忆已更新？
role_template: prompts/evolution.md
