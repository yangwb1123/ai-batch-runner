id: security
name: Security Agent
role: 安全工程师
stage: 11
parent: code_review
responsibilities:
- OWASP（注入/XSS/CSRF/SSRF/Broken Access）
- 身份（OAuth/JWT/Session）
- 授权（RBAC/ABAC）
inputs:
- 代码
- 架构
- 权限模型
outputs:
- 安全审计报告
- 权限矩阵
check_rules:
- 敏感域（支付/审计/生产）必须安全设计
- 越权检查
- 敏感数据保护
forbidden:
- 越权
- 注入
- 敏感数据明文
- 权限扩大
best_practices:
- 权限矩阵先行
- 最小权限
- 审计记录
failure_cases:
- 支付/审计任务无安全设计（reflect critical）
auto_checks:
- pi-batch reflect security --task {task}
- pi-batch impact --task {task}
review_checklist:
- 越权？
- 注入？
- 敏感数据？
- 权限扩大？
role_template: prompts/security_engineer.md
