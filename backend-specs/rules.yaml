# Rule registry: which backend-spec files apply to which task.
#
# Same contract as ui-specs/rules.yaml but for the backend domain
# (pbatch/rule_matcher.py selects the registry by the classified task
# type: frontend_ui -> ui-specs/rules.yaml, backend -> this file).
#
# Axes: scale (demo < standard < production), use-case type, risk.
# The prescription tier is capped by the requirement scale signal
# (pbatch/assessor.py reads `signals`/`signal_weights` from the registry).

scale:
  demo: [demo, 示例, 原型, prototype, playground, 练习, 小demo, crud, 简单接口]
  production: [生产, 上线, 正式, 企业, 微服务, 分布式, production, enterprise,
               高并发, 大规模]

# Requirement complexity signals (assessor scale_signal): backend counts
# use cases, entities, integrations and distribution needs.
signals:
  use_case: [用例, 流程, 下单, 结算, 审批, 取消, 退款, use case, workflow]
  entity: [实体, 聚合, 领域模型, entity, aggregate, domain]
  integration: [集成, 支付网关, 消息队列, 第三方, kafka, mq, webhook, 对接]
  distribution: [微服务, 分布式, saga, 事件驱动, 多服务, event driven]

signal_weights:
  use_case: 1
  entity: 1
  integration: 2
  distribution: 3

# Use-case types (page_types analogue for backend tasks).
use_case_types:
  crud: [crud, 增删改查, 列表, 查询, 基础接口, 简单接口]
  workflow: [审批, 状态机, 流程, 工单, 订单流转, 状态流转]
  integration: [支付, 消息, 对接, 集成, webhook, 回调]
  query: [报表, 统计, 查询, 只读, 分析]
  # Algorithm-triggering scenarios (drive the algorithms rule).
  search: [搜索, 查找, 检索, 模糊查询, search, lookup]
  sort: [排序, 排行, top k, topk, rank, sort]
  graph: [图, 树, 层级, 依赖, 路径, 递归展开, graph, tree, dependency]
  schedule: [排程, 调度, 优先级, 任务队列, schedule, priority]
  cache: [缓存, 限流, 去重, 布隆, 倒排, cache, dedupe, bloom, inverted index]
  range: [区间, 范围查询, 时间段, range, interval]

risk:
  high: [支付, 资金, 订单, 审批, 幂等, 对账, 退款, 转账, 库存, 登录, 认证,
         payment, money, idempotency, refund, approve, login, auth]

rules:
  architecture:
    description: 模块组织（业务能力优先）、依赖方向、数据所有权、组合优于继承
    files: [backend-specs/architecture.md]
    min_tier: demo
    required: true
  design-patterns:
    description: 模式选择决策表、过度设计红线、三次原则
    files: [backend-specs/design-patterns.md]
    min_tier: standard
  domain-modeling:
    description: 领域对象保护状态、状态机集中定义、聚合与事务边界
    files: [backend-specs/domain-modeling.md]
    min_tier: standard
    risk: [high]
    required_when_risk: true
  evolution:
    description: 重构触发条件、渐进迁移、ADR、技术债、架构审查清单
    files: [backend-specs/evolution.md]
    min_tier: production
  oop-di:
    description: 对象vs函数、封装/抽象/继承/多态、IoC/DI 生命周期、AOP 边界
    files: [backend-specs/oop-and-di.md]
    min_tier: standard
  ddd:
    description: 战略（统一语言/限界上下文/防腐层）+ 战术（实体/值对象/聚合）+ 分级使用
    files: [backend-specs/ddd.md]
    min_tier: production
  algorithms:
    description: 数据结构决策表、BFS/DFS、排序、Bloom Filter、复杂度五类成本
    files: [backend-specs/algorithms-data-structures.md]
    min_tier: standard
    page_types: [search, sort, graph, schedule, cache, range]
  complexity-scale:
    description: 数据规模×10/×100 推理、内存/DB/网络成本、优化顺序、基准测试
    files: [backend-specs/complexity-and-scale.md]
    min_tier: production
  persistence-modeling:
    description: 四种模型分离、主键/金额/时间/状态/NULL 决策、索引与唯一约束、
                 审计/历史/软删除、Expand–Migrate–Contract、持久化设计报告
    files: [backend-specs/persistence-modeling.md]
    min_tier: standard
    risk: [high]
    required_when_risk: true
  production-readiness:
    description: 生产就绪门禁：需求正确性/契约/错误模型/可靠性/容量/多租户/安全/
                 可观测性/测试验证/发布恢复
    files: [backend-specs/production-readiness.md]
    min_tier: production
  agent-guardrails:
    description: AI 护栏：防幻觉红线、变更范围控制、DRY 边界、完成定义
    files: [backend-specs/agent-guardrails.md]
    min_tier: standard
  architecture-constitution:
    description: 最高层架构宪法：变化管理/可逆决策/组织匹配/模块化优先/数据所有权/
                 耦合八型/爆炸半径/重试预算/一致性显式/契约演进/架构假设/15 问
    files: [backend-specs/architecture-constitution.md]
    min_tier: production
  design-intelligence-api:
    description: >-
      体验驱动 API：页面交互决定接口形态（场景卡→聚合上下文端点），
      交互模式→API 模式映射，聚合/领域/原子三层
    files: [backend-specs/design-intelligence/01-experience-driven-api.md]
    min_tier: standard
    required: true
  design-intelligence-lifecycle:
    description: 业务生命周期与状态机（生命周期管道/状态机集中定义/事件驱动/规则位置）
    files: [backend-specs/design-intelligence/02-domain-lifecycle.md]
    min_tier: standard
    risk: [high]
    required_when_risk: true
  design-intelligence-datamodel:
    description: UI 驱动数据模型（页面数据需求→模型；派生三策略；审计历史；租户边界）
    files: [backend-specs/design-intelligence/03-ui-driven-data-model.md]
    min_tier: standard
    required: true
  design-intelligence-arch:
    description: 体验架构（体验预算反推 CQRS/缓存/异步/事件流；长任务异步化）
    files: [backend-specs/design-intelligence/04-experience-architecture.md]
    min_tier: production
  design-intelligence-ops:
    description: 运营智能（埋点先行/行为分析/A-B/假设回测）
    files: [backend-specs/design-intelligence/05-operation-intelligence.md]
    min_tier: production
  design-intelligence-pipeline:
    description: 产品工程流水线（先考察再立项/循环验证/预判3年/Agent Phase 0-9）
    files: [backend-specs/design-intelligence/06-product-pipeline.md]
    min_tier: production
  design-intelligence-maintenance:
    description: >-
      维护智能：模型-现实偏差、软件熵、真实性（Trust）、审计即信任、
      六层维护（数据/业务模型/UX/架构/安全/知识）、演化设计、Maintenance Agent
    files:
      - backend-specs/design-intelligence/07-maintenance-intelligence.md
      - docs/ENGINEERING_PHILOSOPHY.md
    min_tier: production
  design-intelligence-distribution:
    description: >-
      分发智能：传播路径设计（网络效应/生态）、AI 时代能力分发、
      分发质量工程保障（可复现/自验证/可接手/可追溯）
    files:
      - backend-specs/design-intelligence/08-distribution-intelligence.md
      - docs/ENGINEERING_PHILOSOPHY.md
    min_tier: production
  testing:
    description: 五层测试策略、Bug 复现优先、属性/模糊测试、测试数据治理、防伪造
    files: [backend-specs/testing.md]
    min_tier: standard
  system-engineering:
    description: 消息语义/缓存一致性/后台任务状态机/限流算法/分布式锁/优雅关闭
    files: [backend-specs/system-engineering.md]
    min_tier: production
  network-engineering:
    description: 超时分层/客户端复用/重试矩阵/流式与背压
    files: [backend-specs/network-engineering.md]
    min_tier: production
