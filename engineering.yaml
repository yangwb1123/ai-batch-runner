# Declarative config for the checks/ engineering harness (cli.py + checks/).
#
# Modeled on snaplink's engineering.yaml: this file is the ONLY thing that
# should differ between projects that reuse this harness. Copy cli.py +
# checks/ + this file into another Python project, edit the values below,
# and the filesize/complexity/root-policy/style gates apply unchanged.
#
# The gates intentionally exempt the upstream-synced engine files
# (pi-batch.py, ai/run-review.py) — they are kept byte-identical with
# snaplink/ai-dev (see README provenance), so quality rules apply to the
# code we author here: cli.py, checks/, and anything new.
#
# Gate scan discovery excludes generated dirs: build/ dist/ *.egg-info/
# .git/ __pycache__/ logs/ .pi-batch/ (see checks/config.py:scan_files).

project:
  name: ai-batch-runner
  language: python

filesize:
  max_lines: 500
  ignore_patterns:
    - "pbatch/pipeline.py"  # upstream-synced; quality.py enforces the 1000-line budget
    - "pbatch/runner.py"    # upstream-synced; quality.py enforces the 1000-line budget
    - "pbatch/cli.py"       # upstream-synced; quality.py enforces the 1000-line budget
    - "pbatch/config.py"    # upstream-synced; quality.py enforces the 1000-line budget
    - "pbatch/evolution.py" # 第四域规律引擎（658 lines, within quality.py 1000 budget；内聚单域，不硬拆）
    - "pbatch/org.py"       # org 域：规范校验+门禁+CLI（549 lines, within quality.py 1000 budget；workflow 已拆出 org_workflow）
    - "pbatch/cli_batch.py" # 批执行层（523 lines, within quality.py 1000 budget；轮循环/票据/隔离分发内聚）
    - "pbatch/memory.py"    # 渐进式 message memory（514 lines, within quality.py 1000 budget；索引/有界读取内聚）
    - "pbatch/fabric_server.py"  # 控制平面 D3（992 lines, within quality.py 1000 budget；设备织网内聚域）
    - "pbatch/fabric_devices.py" # 设备生命周期/调度（523 lines, within quality.py 1000 budget）
    - "pbatch/fabric_cmds.py"    # 设备 CLI 命令层（541 lines, within quality.py 1000 budget）
    - "pbatch/world.py"          # 世界状态 WAL+快照/对账（589 lines, within quality.py 1000 budget）
    - "pbatch/tui.py"            # 交互工作台 TUI（683 lines, within quality.py 1000 budget；Textual 界面层）
    - "pbatch/profile.py"        # 12 维任务画像（504 lines, within quality.py 1000 budget）
    - "pbatch/rule_matcher.py"   # 规则三轴匹配器（503 lines, within quality.py 1000 budget；双向校验裁决）
    - "pbatch/agent_session.py"  # agent 会话状态机（596 lines, within quality.py 1000 budget；状态/续跑内聚）
    - "pbatch/assessor.py"       # 需求评估器（528 lines, within quality.py 1000 budget；8 维评审/处方档内聚）
    - "pbatch/provider_breaker.py" # provider 熔断器（589 lines, within quality.py 1000 budget；令牌/熔断状态内聚）
    - "pbatch/tui_adapter_appserver.py"  # TUI appserver adapter（756 lines, within quality.py 1000 budget）
    - "pbatch/tui_adapter_codex.py"      # TUI codex adapter（550 lines, within quality.py 1000 budget）
    - "pbatch/tui_adapter_legacy.py"     # TUI legacy adapter（625 lines, within quality.py 1000 budget）
    - "pbatch/tui_adapter_pi_rpc.py"     # TUI pi-rpc adapter（620 lines, within quality.py 1000 budget）
    - "pbatch/tui_appserver_support.py"  # TUI appserver 支撑（737 lines, within quality.py 1000 budget）
    - "pbatch/tui_artifacts.py" # TUI 产物视图（633 lines, within quality.py 1000 budget）
    - "pbatch/tui_backend_structured.py" # TUI 结构化后端（538 lines, within quality.py 1000 budget）
    - "pbatch/tui_completion.py" # TUI 补全（603 lines, within quality.py 1000 budget）
    - "pbatch/tui_controller.py" # TUI 控制器（761 lines, within quality.py 1000 budget）
    - "pbatch/tui_events.py"     # TUI 事件流（679 lines, within quality.py 1000 budget）
    - "pbatch/tui_followups.py"  # TUI followups（519 lines, within quality.py 1000 budget）
    - "pbatch/tui_journal.py"    # TUI 日志页（1000 lines, quality.py 预算上限内；内聚单域，不硬拆）
    - "pbatch/tui_sessions.py"   # TUI 会话视图（751 lines, within quality.py 1000 budget）
    - "pbatch/meta.py"            # meta 编排器（522 lines, within quality.py 1000-line budget）
    - "pbatch/review.py"          # review 编排层（501 lines, within quality.py 1000-line budget）
    - "pbatch/tui_approvals.py"   # TUI 审批视图（504 lines, within quality.py 1000-line budget）
    - "pbatch/tui_changes.py"     # TUI 变更视图（535 lines, within quality.py 1000-line budget）
    - "pbatch/tui_model_controls.py" # TUI 模型控制（687 lines, within quality.py 1000-line budget）
    - "pbatch/tui_model_picker.py" # TUI 模型选择（505 lines, within quality.py 1000-line budget）
    - "pbatch/tui_native.py"      # TUI 原生事件层（877 lines, within quality.py 1000-line budget）
    - "pbatch/tui_projection_ui.py" # TUI 投影 UI（679 lines, within quality.py 1000-line budget）
    - "pbatch/tui_timeline.py"    # TUI 时间线（661 lines, within quality.py 1000-line budget）
    - "pi-batch.py"       # upstream-synced entry shim
    - "ai/run-review.py"  # upstream-synced runner
    - "tests/"            # regression suite files
    - "checks/test_"      # harness self-tests
    - ".git/"
  # Temporary debt list. Shrinks over time, must never be expanded.
  exemptions: []

complexity:
  max_cyclomatic: 15
  max_cognitive: 20
  ignore_patterns:
    - "pbatch/"           # upstream-synced; reference quality.py (its own budgets) is green
    - "pi-batch.py"
    - "ai/run-review.py"
    - "tests/"
    - "checks/test_"
    - ".git/"

root_policy:
  # Root directory must stay a thin launcher layer: config + entry points
  # only. Business code lives in subdirectories (checks/, ai/, tests/, ...).
  # Budget includes runtime-only artifacts such as .coverage and
  # .pi-batch.lock, which are gitignored but still counted on disk.
  # Adding a new root file requires a deliberate review; prefer subdirs.
  max_files: 16
  allowed_files:
    - README.md
    - LICENSE
    - AGENTS.md
    - CLAUDE.md
    - Makefile
    - cli.py
    - pyproject.toml
    - MANIFEST.in         # setuptools source-distribution asset manifest
    - engineering.yaml
    - .gitignore
    - .editorconfig
    - pi-batch.py
    - pi-batch.yaml
    - git-auto-commit.sh
    - quality.py           # upstream-synced org-quality scanner (validators.pyquality)
    - pytest.ini          # 测试分类 markers（unit/contract/property/scenario/chaos）
    - CHANGELOG.md        # 产品变更日志（Keep a Changelog 格式）
    - .coverage            # pytest-cov data file (gitignored, recreated by make coverage)
    - .pi-batch.lock       # T4 single-instance lock (gitignored, runtime-only)
  banned_patterns:
    - "*_test.py"   # tests belong in tests/ or checks/

style:
  max_line_length: 100
  ignore_patterns:
    - "pbatch/"           # upstream-synced (incl. reference's own trailing whitespace)
    - "pi-batch.py"
    - "ai/run-review.py"
    - "tests/"
    - "checks/test_"
    - ".git/"
