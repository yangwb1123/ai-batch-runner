# Rule-matcher regression suite — run: pi-batch eval
name: rules
cases:
  - id: demo-login-loads-visual-core-only
    input: "做一个登录页面 demo"
    assert:
      tier: demo
      has_rule: [visual-core, component-spec]
      lacks_rule: [async-data, architecture-budgets]
  - id: production-payment-full-set
    input: "企业订单管理：新建订单表单，含支付审批，生产环境"
    assert:
      tier: production
      risk: high
      has_rule: [visual-core, async-data, error-recovery,
                 defect-patterns, form-table-state, architecture-budgets]
  - id: crud-backend-minimal
    input: "做一个客户管理的 CRUD 接口"
    assert:
      task_type: backend
      tier: demo
      lacks_rule: [ddd, architecture-constitution, algorithms,
                   persistence-modeling]
  - id: backend-order-persistence-mandated
    input: "写一个订单创建接口，含支付"
    assert:
      task_type: backend
      risk: high
      has_rule: [architecture, persistence-modeling, domain-modeling, testing]
  - id: search-triggers-algorithms
    input: "写一个商品搜索接口，Top K 排行，用 go 实现"
    assert:
      task_type: backend
      has_rule: [algorithms]
  - id: plain-crud-no-algorithms
    input: "做一个客户管理的 CRUD 接口"
    assert:
      task_type: backend
      lacks_rule: [algorithms]
  - id: production-complex-has-constitution
    input: "企业订单域：多实体复杂流程，微服务生产环境，含支付审批"
    assert:
      tier: production
      has_rule: [ddd, complexity-scale, evolution, system-engineering,
                 network-engineering, architecture-constitution]
  - id: form-table-triggers-interaction
    input: "企业订单管理：新建订单表单，含支付审批流程"
    assert:
      has_rule: [interaction-patterns]
  - id: demo-auth-skips-interaction
    input: "做一个登录页 demo"
    assert:
      lacks_rule: [interaction-patterns]
  - id: geometry-mandatory-for-all-ui
    input: "做一个登录页面 demo"
    assert:
      tier: demo
      has_rule: [geometry]
  - id: business-ui-contract-on-enterprise-form
    input: "企业订单管理：新建订单表单，含支付审批，生产"
    assert:
      tier: production
      has_rule: [geometry, business-ui-contract]
  - id: business-ui-contract-skipped-on-demo
    input: "做一个登录页 demo"
    assert:
      lacks_rule: [business-ui-contract]
  - name: design-intelligence-production-workbench
    input: "企业工作台：生产达成率 KPI + 异常列表 + 趋势图，生产"
    expect:
      tier: production
      includes:
        - design-intelligence-product
        - design-intelligence-color
        - design-intelligence-priority
        - design-intelligence-cognitive
        - design-intelligence-emotional
        - design-intelligence-data
  - name: design-intelligence-demo-login
    input: "生成一个登录页 demo"
    expect:
      includes:
        - design-intelligence-product
        - design-intelligence-priority
      excludes:
        - design-intelligence-emotional
  - name: design-intelligence-backend-production
    input: "写一个订单创建接口，含支付审批流程，生产环境，go"
    expect:
      includes:
        - design-intelligence-api
        - design-intelligence-lifecycle
        - design-intelligence-datamodel
        - design-intelligence-arch
        - design-intelligence-ops
        - design-intelligence-pipeline
  - name: system-type-methodology-routing
    input: "订单审批流，状态流转，审核流程，生产"
    expect:
      includes:
        - system-type-state-machine
