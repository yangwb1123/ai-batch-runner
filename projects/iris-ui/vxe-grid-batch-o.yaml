  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch O (clipboard copy + find &
          replace) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-o-baseline.md. Read it first,
          then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; React only; additive only (default off).
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: function-type props on ONE line; export
            new types from index.ts.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: (1) clip copy (light); (2) fnr (heavy). If low on
            time, finish clip + the fnr bar render + matching, then tests.

          IMPLEMENT:
          1. clipConfig (props.ts + Table.tsx):
             - clipConfig?: { copy?: boolean; paste?: boolean } (single
               line) — requires cellRange to have a selected range
             - keydown listener on the root (or window capture when
               cellRange is active): Ctrl/Cmd+C → build TSV from the range
               (rows × cols of the selected cells in bodyData order) and
               navigator.clipboard.writeText (guard: jsdom lacks clipboard —
               write via a helper that falls back to a textarea+execCommand
               and is safely no-op in tests without a stub)
             - Ctrl/Cmd+V (paste): read clipboard text (guard), split
               lines/cells, write into the range anchor onward via the
               existing write-back channel (setLiveData + externalDataRef +
               onDataChange — reuse commitRowList); overflow (beyond the
               last row/col) ignored; document the limitation
          2. fnr (props.ts + Table.tsx + i18n):
             - fnr?: boolean (single line)
             - Ctrl+F (when fnr && !editing) opens the bar; bar rendered
               above the table (below toolbar) with data-iris-fnr-bar;
               fields: find input, replace input, buttons next/prev/
               replace/replace-all (data-iris-fnr-*); Enter = next,
               Shift+Enter = prev; Esc closes
             - matching: over bodyData (flat mode), case-insensitive
               substring of String(getCellValue(row, col)); matches render
               data-iris-fnr-match on the cell; the ACTIVE match renders
               data-iris-fnr-active and scrollIntoView({ block: 'nearest' })
             - replace: writes the new value through commitRowList (one
               commit per replaced cell, or batch — batch preferred);
               replace-all replaces every match; the match list recomputes
               after replace
             - highlights clear when the bar closes or the query empties
             - i18n keys (en + zh in core i18n + plugin-locale-zh):
               fnr.find / fnr.replace / fnr.replaceAll / fnr.next / fnr.prev
          3. Tests (new clip-fnr.test.tsx):
             - copy: selected range + Ctrl+C → clipboard.writeText called
               with the TSV (stub navigator.clipboard)
             - paste: stub readText → writes values into range cells
               (onDataChange fired)
             - fnr: Ctrl+F opens the bar; typing matches highlight cells;
               Enter advances the active match; replace writes through
               (row updated); replace-all replaces all; Esc closes and
               clears highlights; no fnr → Ctrl+F does nothing

