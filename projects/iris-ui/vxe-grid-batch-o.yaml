      Write a markdown baseline to the output path:
      - proposed iris design (react only, additive):
        a) clipConfig?: { copy?: boolean; paste?: boolean } — when enabled
           AND cellRange is on: Ctrl/Cmd+C on the table copies the selected
           range as TSV (tab-separated rows, \n line ends) via
           navigator.clipboard.writeText (fallback: execCommand textarea);
           Ctrl/Cmd+V (when paste) reads the clipboard and writes values
           into the range cells starting at the anchor (each cell commit
           through the existing cellEdit commit path — or direct
           setCellValue into liveData; pick the simpler: write through the
           same write-back channel as row ops: setLiveData + onDataChange;
           document); pasted values are strings; range extends as needed
           (paste into the same-size range; extra rows/cols create rows via
           insertRowInList? — keep SIMPLE: paste only into existing cells,
           overflow ignored, document)
        b) fnrConfig?: { enabled?: boolean } (or just fnr?: boolean) —
           when enabled: Ctrl+F opens a compact find bar (data-iris-fnr-bar)
           docked above the table (below the toolbar): input (find), next/
           prev buttons (Enter/Shift+Enter), optional replace input +
           replace-one/replace-all buttons; matching cells are highlighted
           (data-iris-fnr-match + --iris-primary outline/bg via --iris-*);
           the current match is scrolled into view (scrollIntoView) and
           gets data-iris-fnr-active; Esc closes the bar and clears
           highlights; matching is case-insensitive substring over
           String(getCellValue); replace writes through the same write-back
           channel; i18n keys (fnr.find/fnr.replace/fnr.replaceAll/fnr.next/
           fnr.prev) en + zh
      - file map + tests (jsdom: clipboard needs a stub — navigator.clipboard
        writeText mock; fnr is fully testable)
      Do NOT modify source files.
