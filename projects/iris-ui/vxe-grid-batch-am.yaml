# iris-ui grid 批 AM：编辑自动补全 + 列值分布（数据洞察）
#
# 目标：
# 1. 编辑自动补全：单元格编辑时基于列内已有值提示（suggest?: boolean |
#    string[]——true 自动收集列内去重值；编辑 input 用原生 datalist）
# 2. 列值分布：contextMenu 增加"值分布"项（选中列的值计数统计面板——
#    core 纯函数 valueDistribution）
# 范围：react only；additive；core 纯函数。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-am.yaml \
#   --log-file logs/iris-ui-batch-am.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui grid batch AM (edit
      suggestions + value distribution). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the editing render (text/number/select/textarea inputs — where a
         datalist would attach), the contextMenu machinery (batch H: items
         callback + onSelect — where a built-in 值分布 item could hook in;
         prefer additive: contextMenu items are user-provided — a SEPARATE
         prop `valueDistribution?: boolean` that appends a built-in item
         after the user items, or a toolbar button? pick the cleaner one
         and document), and how to enumerate a column's values from
         bodyData.
      2. /home/u1/iris-ui/packages/core/src/ — pattern for pure functions.

      Write a markdown baseline to the output path:
      - proposed design:
        a) IrisTableColumn.suggest?: boolean | Array<string | number> —
           true: the edit input gets a datalist (data-iris-edit-suggest)
           populated with the column's DISTINCT values from the current
           bodyData (String values, max 50, sorted); an array: used
           directly; the datalist renders only while editing; number/select/
           textarea editors unaffected (text editor only — document)
        b) valueDistribution?: boolean — when true, the context menu gains
           a trailing built-in item 值分布 (key '__iris-distribution',
           i18n table.distribution) after the user items; selecting it
           opens a small panel (data-iris-distribution-panel) listing the
           clicked column's values with counts (top 20 + "其余 N 个"),
           computed by a core pure function
        c) core valueDistribution(rows: readonly Record<string, unknown>[],
           key: string): Array<{ value: string; count: number }> — String
           values; count desc; empty values excluded; tests
      - file map + tests
      Do NOT modify files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-am-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui grid batch AM (edit suggestions + value
          distribution) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-am-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; react only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: all light — finish both.

          IMPLEMENT:
          1. suggest (types.ts + Table.tsx):
             - IrisTableColumn.suggest?: boolean | Array<string | number>
               (single line)
             - text editor render: when suggest, render <datalist
               data-iris-edit-suggest id={...}> with the options (distinct
               bodyData values for the column — String(value), sorted,
               capped 50; or the array form) and the input gets
               list={datalistId}
          2. valueDistribution (core value-distribution.ts NEW + tests +
             Table.tsx + i18n):
             - core pure function per the baseline; export from index.ts;
               tests (counts, desc order, empty excluded, empty rows)
             - Table: valueDistribution?: boolean prop (single line);
               contextMenu items: when true, append the built-in item
               (key '__iris-distribution', i18n label); onSelect with that
               key → open the panel (data-iris-distribution-panel) in the
               ContextMenu floating pattern at the same anchor: the clicked
               column's distribution (top 20 + 其余 N 个), muted rows,
               --iris-* tokens; Esc/outside closes
             - i18n table.distribution (en + zh)
          3. Tests (suggest-distribution.test.tsx):
             - suggest: editing a text cell with suggest=true shows a
               datalist with the distinct values; array form uses the array
             - distribution: contextMenu contains the built-in item when
               enabled; selecting it shows counts; core function tests
          4. Docs: iris 独有 section

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/core test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-am-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch AM. Read
          batch-am-baseline.md and batch-am-adapt.md, inspect.

          Check:
          1. suggest: datalist render only while editing text; distinct
             bodyData values (cap + sort); array form; id uniqueness
          2. distribution: core counts/order/empty; built-in context item
             appended after user items; panel content (top 20 + rest);
             dismiss
          3. additive only; manifest hygiene; core framework-free; CSS
             tokens; i18n both languages
          Run verification commands (core test, react test/typecheck/lint,
          audit, check:manifest). Write verdict markdown: PASS or FAIL with
          numbered findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-am-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch AM. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-am-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): grid 批 AM——编辑自动补全 + 列值分布（数据洞察）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-am-gate.md
