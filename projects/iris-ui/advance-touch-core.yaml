      Monorepo facts (verify before designing):
      - packages/core/src/long-press.ts: createLongPress (press intent
        detector, framework-agnostic, injected schedule).
      - packages/core/src/hover-intent.ts: createHoverIntent (hover
        intent/debounce for desktop pointer).
      - React components scatter touchAction today (RangeSlider/
        ColorPicker/Splitter/ToastViewport/Resizer/Table) with ad-hoc
        pointer handling; NO unified gesture layer exists in core.
      - Adapters bridge core controllers via use* hooks (established
        pattern); CSS uses --iris-* tokens only; logical properties for
        direction.
      Read long-press.ts, hover-intent.ts, floating.ts (pointer/scroll
      interplay), and 2-3 react consumers (RangeSlider/Splitter/Resizer)
      to see the ad-hoc patterns. Write the baseline to the output path:
      exact additive design for a framework-agnostic gesture-recognition
      controller, with file map + test plan. Constraints:
      (a) PURE CORE + tests only — no adapter/component/CSS/i18n/manifest
      changes (core index.ts export allowed; then gen:manifest +
      check:manifest to verify byte-identical).
      (b) Controller scope: unified pointer-stream → intent recognizer
      with configurable thresholds — tap (movement + duration), drag
      (start-threshold + axis lock), long-press (duration + cancel on
      move), swipe (velocity + distance), scroll-pass (pointer capture
      release). Provide per-gesture callbacks + a resolved-intent event
      + cancel semantics (pointercancel, capture loss, multi-touch
      abort). Deterministic, injected clock/scheduler.
      (c) touch-action guidance: controller exposes recommended CSS
      touch-action per intent mode (pure data, adapters apply), and
      documents the interplay with native scroll (pan-y vs pan-x vs
      none) — never blocks scroll without intent.
      (d) Edge cases REQUIRED in design + tests: tap vs drag boundary at
      threshold, long-press cancel on move, multi-touch abort, pointer
      capture loss, rapid tap sequence (double-tap passthrough), intent
      change mid-gesture (drag→scroll), dispose mid-gesture, injected
      clock determinism. Multi-touch pinch/rotate OUT of scope
      (document as follow-up).
      (e) Additive vs existing long-press: keep createLongPress intact;
      if the new recognizer subsumes it, note migration path, do NOT
      remove or change behavior.
      Do NOT modify files; report exact file paths to create/change.
