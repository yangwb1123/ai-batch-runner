# iris-ui grid 批 AO：公式计算列 + 单元格引用表头（电子表格感）
#
# 目标：
# 1. 公式计算列：列 formula?: string——`=a + b * 2`、`=SUM(a, b)`、
#    `=a / b`——core 安全表达式求值器（白名单字段名 + 算术/聚合函数 +
#    括号；无任意代码执行）；渲染只读值，参与排序/过滤
# 2. 单元格引用表头：showCellRefs?: boolean——表头显示 A/B/C 列标
#    （title 旁小标签），行首显示行号（与 seq 独立）
# 范围：react only；additive；core 求值器（安全子集）。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-ao.yaml \
#   --log-file logs/iris-ui-batch-ao.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui grid batch AO (formula
      columns + cell refs). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the cell render chain (where a formula column's value is
         computed), the header cell render (title + prefix/suffix — where
         the column-letter badge goes), the seq column (row numbers), the
         filter/sort paths (formula values participate — the raw computed
         value feeds getCellValue? design: the formula column has no raw
         value — sorting/filtering use the COMPUTED value).
      2. /home/u1/iris-ui/packages/core/src/ — pure function conventions.

      Write a markdown baseline to the output path:
      - proposed design:
        a) core evaluateFormula(expr: string, row: Record<string, unknown>):
           unknown — SAFE evaluator: tokens = field names ([A-Za-z_]\w*),
           numbers, operators + - * / % ( ) , and functions SUM/AVG/MIN/MAX/
           COUNT (over comma-separated args which may be fields or
           expressions); NO function calls other than the whitelist (parse
           by regex-driven recursive descent, no eval/Function); unknown
           fields → null; division by zero → null; type coercion: numbers
           via Number, strings concatenate with + when either side is a
           string (document); errors → null (never throw); tests (arithmetic
           precedence, parentheses, functions, unknown field, div0, string
           concat, whitespace, `=` prefix stripped by the caller or the
           function? — accept both, strip a leading '=')
        b) IrisTableColumn.formula?: string — when set: the cell value =
           evaluateFormula(formula, row) (memoized per row in the render
           path); the column is display-only (editable ignored — document);
           sorting/filtering use the computed value (the data pipeline
           reads through a computed value getter — check how getCellValue
           works and route formula columns through the evaluator)
        c) showCellRefs?: boolean — header cells render a small muted
           column-letter badge (A, B, C… based on the leaf column index —
           data-iris-cell-ref; skip the selection/seq columns); row numbers:
           when showCellRefs && !seq, render a row-number column (same
           style as seq); when seq is on, seq IS the row number (document);
           i18n not needed (letters/numbers)
      - file map + tests
      Do NOT modify files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-ao-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui grid batch AO (formula columns + cell refs) in
          /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-ao-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; react only; additive only; the evaluator
            must NOT use eval/Function/new Function.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props.
          - TIME BUDGET: (1) evaluator + tests (medium); (2) formula wiring
            (light); (3) cell refs (light). Finish all.

          IMPLEMENT:
          1. core (packages/core/src/formula.ts NEW + tests):
             - evaluateFormula per the baseline (recursive descent parser;
               whitelist functions; null on errors; strip leading '=')
             - export from index.ts; comprehensive tests
          2. formula columns (types.ts + Table.tsx):
             - IrisTableColumn.formula?: string (single line)
             - the value pipeline: getCellValue for a formula column
               returns evaluateFormula(formula, row) (memoize per
               (formula, row) — a small cache map or compute inline;
               document); sorting/filtering/export use the computed value;
               the cell render shows it (String); editable columns with
               formula ignore editing (document)
             - tests: formula column renders computed values; sort orders by
               the computed value; unknown field renders empty; SUM works
          3. cell refs (Table.tsx + styles.ts):
             - showCellRefs?: boolean (single line)
             - header: a muted letter badge (data-iris-cell-ref) after the
               title (leaf columns only, skipping seq/selection columns —
               A = first leaf); letters A..Z, AA.. (a small
               indexToLetters helper inline or core — core pure helper
               columnLetter(index): string with tests)
             - row numbers: showCellRefs && !seq renders the number column
               (reuse the seq column render + data attr
               data-iris-row-ref)
             - tests: letters render (A/B/C + AA); row numbers render when
               no seq; skipped when seq on
          4. Docs: iris 独有 section

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/core test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ao-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch AO. Read
          batch-ao-baseline.md and batch-ao-adapt.md, inspect.

          Check:
          1. evaluator: precedence/parens/functions; NO eval/Function; null
             on errors (unknown field, div0); string concat; leading =
             strip; whitespace
          2. formula columns: computed value in render/sort/filter; edit
             ignored; memo correctness
          3. cell refs: letter mapping (AA+); skip seq/selection columns;
             row numbers only without seq
          4. additive only; manifest hygiene; core framework-free; CSS
             tokens
          Run verification commands (core test, react test/typecheck/lint,
          audit, check:manifest). Write verdict markdown: PASS or FAIL with
          numbered findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ao-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch AO. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-ao-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): grid 批 AO——公式计算列 + 单元格引用表头（电子表格感）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ao-gate.md
