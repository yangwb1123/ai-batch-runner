         column option (batch M).

      Write a markdown baseline to the output path:
      - proposed iris design (react only, additive):
        a) zoomConfig?: { enabled?: boolean } — when enabled, the toolbar
           renders a zoom button (data-iris-table-toolbar-zoom) after the
           built-ins; clicking toggles a zoomed state: the root container
           gets data-iris-zoomed + fixed positioning (position: fixed; inset:
           0; z-index: var(--iris-z-modal, 2000); background:
           var(--iris-background)) so the table fills the viewport;
           Esc or the button toggles back; i18n table.zoom / table.unzoom
           (en + zh)
        b) group collapse (batch M group rows): the group header row
           (data-iris-group-row) becomes clickable when the table has a
           group column: clicking toggles the group's collapsed state; a
           caret (▸/▾) at the row start; collapsed groups hide their rows
           (and their group summary row) until expanded; state is internal
           (a Set of collapsed group keys); groups collapse independently
           (initial: all expanded)
        c) IrisTableColumn.title: string | import('react').ReactNode — the
           header title render accepts a ReactNode (flat + grouped +
           headerTooltip content uses String(title) when it is a string
           else ''); sorting/filtering unaffected; titlePrefix/Suffix still
           render around it
        d) visibleMethod?: (column: IrisTableColumn<Row>) => boolean —
           when provided, displayColumns additionally filters columns where
           visibleMethod(column) === false (AND-ed with columnVisibility);
           evaluated on every render (reactive)
      - file map + tests
      Do NOT modify source files.
