# iris-ui vxe-grid 批 D：formConfig 搜索表单 + toolbar 自定义按钮
#
# 目标：IrisTable 补齐 vxe-grid formConfig 同等能力——表格上方搜索表单，
# 提交/重置联动查询（proxyConfig 远程模式合并 filters + 页码重置；本地模式
# 走本地过滤）；toolbar 支持自定义按钮。范围：react only（沿用批约定）；
# 逻辑下沉 core，适配器薄桥；additive（新 prop 默认关闭）。
#
# 执行（在 ai-batch-runner 根目录）：
#   python pi-batch.py projects/iris-ui/vxe-grid-batch-d.yaml \
#     --log-file logs/iris-ui-batch-d.log --retries 2
# 阶段：baseline → adapt → review（对抗审查）→ gate（全仓门禁 + 提交）

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  # ── 1. 基线：formConfig 官方语义 + 集成点盘点 ──
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch D (formConfig
      search form + toolbar custom buttons). Monorepo: /home/u1/iris-ui.
      vxe-grid reference types: /tmp/vxe-grid/package/types/components/grid.d.ts
      (FormConfig around line 434) and
      /tmp/vxe-grid/package/types/components/form-item.d.ts
      (items: field/title/itemRender).

      Read:
      1. The two type files above — formConfig semantics (enabled/items,
         field/title/itemRender, submit/reset behaviors).
      2. /home/u1/iris-ui/packages/react/src/primitives/table/props.ts —
         IrisTableProps current surface (toolbar, proxyConfig, filters).
      3. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the toolbar render block (around data-iris-table-toolbar) and the
         proxyConfig bridge (controller wiring, filters merge point).
      4. /home/u1/iris-ui/docs/vxe-grid/batch-c-baseline.md and
         batch-c-adapt.md — how proxyConfig params flow.
      5. /home/u1/iris-ui/packages/react/src/primitives/form-field/ and
         primitives/input/ and primitives/select/ — available form primitives
         to compose (IrisFormField / IrisInput / IrisSelect).

      Write a markdown baseline to the output path:
      - vxe-grid formConfig semantics (form above grid, submit → query with
        form values, reset clears + requeries, proxyConfig.form flag)
      - proposed IrisTable `formConfig` prop shape: fields:
        { key, label, type?: 'text' | 'select', options?: { value, label }[],
        placeholder?, defaultValue? }, submitText/resetText (defaults localized
        via useI18n), onSearch? callback
      - behavior spec: form values merge into the query as filters
        (proxyConfig remote mode → controller.setParams({ filters, page: 1 });
        local mode → internal filters state driving the existing client-side
        filter path); reset clears values and re-queries/re-filters; submit
        resets page to 1 (vxe behavior)
      - toolbar.buttons spec: { key, label, onClick, icon? } rendered after
        the built-in buttons
      - file map: props.ts (types), Table.tsx (form render + state + wiring),
        new test file, i18n keys if needed
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-d-baseline.md
    mode: serial

  # ── 2. 实现 ──
  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch D (formConfig search form +
          toolbar custom buttons) in the monorepo at /home/u1/iris-ui, per
          the design in /home/u1/iris-ui/docs/vxe-grid/batch-d-baseline.md.
          Read it first, then read AGENTS.md (project rules).

          HARD CONSTRAINTS:
          - Logic in packages/core stays framework-free (grep for
            `from '(react|vue|solid|svelte)'` in packages/core/src must stay
            empty). If any pure logic is needed (e.g. form-value merging or
            a small controller), put it in core and test it there.
          - React adapter is a thin bridge. React only — do NOT touch
            vue/solid/svelte packages.
          - Additive API only (new props default off). No breaking changes.
          - Do NOT edit dist/, *.tgz, node_modules, packages/manifest/*.json
            (regenerate later via `pnpm gen:manifest`).
          - Test files ≤500 lines. ≤5 changed files for the core change, plus
            tests; if you exceed the budget, keep the essentials and note it.
          - Do NOT reformat existing prop signatures to multi-line function
            params: the manifest contract scanner parses props line-by-line
            and multi-line function parameters get mis-collected as props
            (e.g. cellClassName). Keep function-type props on a single line;
            use named exported interfaces (IrisXxxParams, exported from
            index.ts) for inline object params (the scanner also collects
            inline object literals inside function params).
          - New CSS must use --iris-* tokens (audit gate).

          IMPLEMENT:
          1. packages/react/src/primitives/table/types.ts + props.ts:
             - `IrisTableFormField<Row>`: { key: string; label: string; type?:
               'text' | 'select'; options?: Array<{ value: string; label:
               string }>; placeholder?: string; defaultValue?: string }
             - IrisTableProps additions (all optional, additive):
               formConfig?: { fields: IrisTableFormField<Row>[]; submitText?:
               string; resetText?: string; onSearch?: (values: Record<string,
               string>) => void }
               toolbar.buttons?: Array<{ key: string; label: string; onClick:
               () => void; icon?: string }>  (add to the existing toolbar
               type; keep toolbar fields intact)
             - Export the new types from index.ts.
          2. packages/react/src/primitives/table/Table.tsx:
             - Form state: local useState<Record<string, string>> seeded from
               field defaultValue; values update on input/select change.
             - Render the form ABOVE the toolbar (or directly above the table
               root when no toolbar) with data-iris-table-form; compose
               IrisFormField + IrisInput / IrisSelect from the existing
               primitives (match the form-field API used elsewhere in the
               repo — read primitives/form-field and primitives/select usage
               first); submit + reset buttons (IrisButton), labels from
               formConfig or i18n defaults.
             - Submit: build values (all fields, empty strings stripped);
               call onSearch?.(values); if proxyConfig is set →
               controller.setParams({ filters: values, page: 1 }) (remote
               mode — verify how the controller setParams API works and how
               filters flow to query; the batch C bridge already routes
               filters to setParams — reuse that); if no proxyConfig →
               internal formFilters state merged into the EXISTING client-side
               filter path (the filteredData memo that reads the `filters`
               prop — see how it works; combine prop filters with form values
               without mutating the prop).
             - Reset: clear form state (back to defaults or empty), then
               re-query/re-filter the same way submit does with empty values.
             - Toolbar buttons: render toolbar.buttons after the built-in
               refresh/import/columns buttons (same styling family), each with
               onClick; keep the existing toolbar look (data-iris-table-toolbar-
               button-{key}).
             - IMPORTANT: proxyConfig + formConfig + edit write-back must all
               coexist. Do not break batch C behavior (remote sort/filter,
               pager wiring, liveData write-back).
          3. Tests:
             - core: only if you added core logic (e.g. a mergeFormFilters
               pure function) — test it.
             - react: new test file
               packages/react/src/primitives/table/test/form-config.test.tsx:
               - renders the form fields (label + input/select)
               - submit calls onSearch with stripped values
               - remote mode: submit calls proxyConfig.query with merged
                 filters and page reset to 1 (mock query fn, assert last call
                 params)
               - local mode: submit filters rows client-side (no proxyConfig)
               - reset clears values and re-queries
               - toolbar.buttons render and fire onClick

          VERIFY (all must pass):
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/core test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors; the pre-existing IrisTable
            complexity warning is acceptable)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          Report in your final message: files changed, tests added, test
          counts, deviations from the baseline design.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-d-adapt.md

  # ── 3. 对抗审查 ──
  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch D (formConfig +
          toolbar buttons). Read /home/u1/iris-ui/docs/vxe-grid/batch-d-baseline.md
          and batch-d-adapt.md, then inspect the implementation:
          - packages/react/src/primitives/table/props.ts (formConfig,
            toolbar.buttons)
          - packages/react/src/primitives/table/types.ts
          - packages/react/src/primitives/table/Table.tsx (form render,
            submit/reset wiring, toolbar buttons)
          - new tests

          Check:
          1. formConfig renders above the table with correct labels/inputs;
             select fields render options
          2. submit strips empty strings; onSearch receives stripped values
          3. remote mode: submit → query called with merged filters AND
             page reset to 1; previous page state cannot leak (e.g. submitting
             on page 3 must query page 1)
          4. local mode: client-side filtering works AND the `filters` prop is
             not mutated (no setState on props)
          5. reset clears the form and re-queries/re-filters (empty values)
          6. formConfig + proxyConfig + edit write-back coexist (no crash,
             no lost edits)
          7. toolbar.buttons render after built-ins and fire onClick; built-in
             buttons unaffected
          8. additive only — no existing prop semantics changed
          9. core stays framework-free; react bridge only
          10. manifest scanner hygiene: no multi-line function params, no
              inline object literals in function params (check props.ts!)
          11. new CSS uses --iris-* tokens only

          Run the verification commands (core test, react test/typecheck/lint,
          audit script — same as adapt). Write a verdict markdown: PASS or
          FAIL with numbered findings (severity, file:line, fix). If any real
          defect exists, write FAIL with concrete fixes. Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-d-review.md

  # ── 4. 门禁 ──
  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch D (formConfig + toolbar buttons). Read
          the review verdict /home/u1/iris-ui/docs/vxe-grid/batch-d-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
            (all tasks must pass; manifest tests included)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate; commit it)
          - Update /home/u1/iris-ui/docs/vxe-grid-comparison.md: mark the
            formConfig row as done (react, batch D).
          - If the example page apps/cms-react/src/pages/VxeGridExamplePage.tsx
            exists and is under 500 lines, add a 4th section "搜索表单（Search
            form）" using formConfig with 2 fields (name text + role select)
            over the existing server-side dataset (proxyConfig section) —
            remote submit re-queries; keep it minimal. Then run
            `cd apps/cms-react && env COREPACK_ENABLE_PROJECT_SPEC=0 corepack
            pnpm exec tsc --noEmit` and `pnpm build`.
          - Commit: `cd /home/u1/iris-ui && git add -A -- . ':!apps/ssr-solidstart/.vinxi'
            && git commit -m "feat(table): vxe-grid 批 D——formConfig 搜索表单 + toolbar 自定义按钮（react only）"`
            (husky filesize/budget gates run; if the budget is exceeded,
            split: core first, then react+tests, then docs/example).
          Report the commit hash and final test counts.

          If FAIL with concrete fixes: apply the fixes, rerun failing checks
          until green, then run the full gate and commit as above. Do not
          silence checks.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-d-gate.md
