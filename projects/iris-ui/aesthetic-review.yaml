# iris-ui 美学评审：色彩和谐/排版/节奏/形态/动效五维诊断
git_commit: false
decision_log: /home/u1/iris-ui/docs/ui-audit/DECISIONS.md

stages:
  - name: review
    from_prompt: |
      You are conducting an AESTHETIC review of the iris-ui component library
      at /home/u1/iris-ui (four-framework, token-driven, productized). The
      functional/consistency layer is DONE (0 violations, pixel parity) —
      your job is the beauty layer: polish, harmony, and emotional quality.

      Read these design references FIRST:
        /home/u1/ai-batch-runner/ui-specs/geometry.md
        /home/u1/ai-batch-runner/ui-specs/design-intelligence/02-color-intelligence.md
        /home/u1/ai-batch-runner/ui-specs/design-intelligence/05-emotional-design.md
      Then audit the token values:
        packages/tokens/src/light.ts, dark.ts (colors/radii/shadows/transitions)
      and sample component styling across packages/react/src/primitives
      (Button, Card, Dialog, Table, Select, Input, Badge, Tooltip, Toast,
      Skeleton, EmptyState, Statistic).

      Evaluate across 5 aesthetic dimensions, each with evidence:
      1. COLOR HARMONY — are light/dark palettes harmonious? primary indigo
         #6366f1 + accent violet #8b5cf6: cohesive or clashing? semantic
         tones (success/warning/danger/info) — hue relationships, saturation
         balance, dark-mode brightness discipline.
      2. TYPOGRAPHY — font stack, size ladder (12-30px), line-heights,
         letter-spacing: is the rhythm musical? Are labels/captions/values
         well-scaled?
      3. SPACING RHYTHM — the 4pt scale in use: is there a consistent
         breathing room? dense vs airy balance in components?
      4. SHAPE & DEPTH — radii (2/6/12), shadows (sm/md/lg/xl), borders:
         are surfaces confident? too sharp (2px)? too soft? shadow layering
         for elevation (resting/hover/raised/overlay)?
      5. MOTION & DETAIL — transition tokens (150/250/400ms), hover/active/
         focus micro-interactions, skeleton shimmer, empty states: polished
         or bare?

      Output: for each dimension — strengths (evidence), weaknesses
      (evidence: token value / file:line / component), and CONCRETE
      aesthetic improvement proposals with the exact token or CSS change.
      Mark each proposal [MECHANICAL] (direct change possible) or
      [JUDGMENT] (design taste). Rank by aesthetic impact / effort.
      Do NOT modify files. Output a markdown report.
    output: /home/u1/iris-ui/docs/ui-audit/aesthetic.md
    mode: serial
    timeout: 1800
