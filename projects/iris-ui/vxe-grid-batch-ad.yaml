# 1. columnDrag / rowDrag（列/行拖拽——core createSortable 薄桥）
# 2. 行编辑模式（editConfig.mode='row'）
# 3. contextMenu（右键浮层菜单）
# 4. filterValues 多选筛选面板（列 filterable + filterOptions）
# 5. 懒加载树（lazyLoad——若 solid 有树支持；无则跳过文档化）
