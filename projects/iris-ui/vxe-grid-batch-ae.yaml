stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch AE (virtual
      tree + four-framework example). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the virtualScroll render guard (`virtualScroll && (!treeMode ||
         !hasDetail)` around line 4861), the IrisVirtualScroll component
         (itemCount/itemHeight/height/buffer props — how the window
         computes), the flatTree memo (visible expanded rows), and the
         detail-row expansion (hasDetail/renderDetail).
      2. /home/u1/iris-ui/packages/react/src/primitives/virtual-scroll/
         VirtualScroll.tsx — how itemCount flows and whether a changing
         itemCount mid-scroll is handled.
      3. /home/u1/iris-ui/apps/cms-react/src/pages/VxeGridExamplePage.tsx —
         the react example (4 sections: basic/edit/proxy/form).
      4. /home/u1/iris-ui/apps/cms/ (vue), apps/cms-solid/,
         apps/cms-svelte/ — their pages/menus/router structure to add the
         example page.

      Write a markdown baseline to the output path:
      - virtual tree design: enable virtualScroll in tree mode — flatTree is
        already the visible-rows list; the virtual window must recompute
        when expansion changes (itemCount = flatTree.length); row heights
        fixed (itemHeight); what breaks: absolute positioning of rows by
        index — expansion changes shift rows below; verify IrisVirtualScroll
        recomputes on itemCount change (check the component: does it clamp
        the scroll offset when itemCount shrinks?); the fix surface
      - detail mode: same for hasDetail (expanded detail rows add height —
        the DETAIL row height may differ from itemHeight — document: detail
        virtual rows use the same itemHeight slot or a height multiplier;
        pick: detail rows occupy one slot each (their content scrolls inside
        if taller) — document)
      - four-framework example plan: copy the react example structure to
        apps/cms (vue), apps/cms-solid, apps/cms-svelte — same 4 sections
        (basic usage + row editing + proxyConfig + formConfig) adapted to
        each framework's IrisTable API (props are aligned); menu entry +
        router registration + a smoke assertion in each app's e2e if
        feasible
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-ae-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch AE (virtual tree + four-framework
          example) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-ae-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests for the react
            part; the example pages are app files (apps/*) — separate
            commits or one commit if budget allows.
          - MANIFEST SCANNER HYGIENE: single-line function props.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: (1) virtual tree react fix + tests; (2) the four
            example pages (light — mirror the react page). If low, finish 1
            and the vue example, leave solid/svelte pages to a follow-up
            with a note.

          IMPLEMENT:
          1. Virtual tree (react Table.tsx):
             - remove the treeMode/hasDetail exclusion so virtualScroll
               applies to tree and detail modes (keep the guard only when
               neither is feasible — check what the exclusion protected
               against: the row render path for tree rows may differ;
               ensure the virtual row wrapper works with tree rows)
             - verify IrisVirtualScroll handles itemCount changes
               (expansion toggles): if it does not clamp/refresh, fix the
               component or reset the scroll on expansion change (document
               the choice)
             - detail mode: detail rows count as one virtual slot each
               (document: content taller than the slot scrolls inside the
               detail cell)
             - tests (new virtual-tree.test.tsx): virtual + tree renders
               only the visible window; expanding a node increases the
               virtual itemCount and keeps the scroll sane; virtual +
               renderDetail renders detail rows; flat virtual unchanged
          2. Four-framework example (apps/cms*, apps/cms-solid,
             apps/cms-svelte):
             - mirror apps/cms-react/src/pages/VxeGridExamplePage.tsx in
               each app (the same 4 sections; the IrisTable props are
               aligned across frameworks — adapt the syntax:
               vue props/events, solid JSX, svelte props)
             - register the menu entry (like the react app's menus.ts) +
               the router/page map (each app's Shell/router equivalent)
             - keep the page self-contained (server data arrays inline)
             - each app typecheck must pass
          3. Tests for the example pages: skip e2e for vue/solid/svelte
             (CI runs them); at minimum the apps typecheck + build pass.

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - each touched app: typecheck (and build for at least one)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ae-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch AE (virtual tree
