        output: /home/u1/iris-ui/docs/vxe-grid/batch-ae-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch AE (virtual tree + examples). Read the
