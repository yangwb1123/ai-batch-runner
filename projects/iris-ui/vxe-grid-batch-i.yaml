            commit -m "feat(table): vxe-grid 批 I——表头筛选面板/textarea 编辑器/formatter（react only）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-i-gate.md
