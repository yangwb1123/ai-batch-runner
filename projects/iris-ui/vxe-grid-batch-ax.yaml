# iris-ui grid 批 AX：单元格条件格式（when 谓词 + 样式规则）
#
# 目标：conditionalStyles?: Array<{ column?: string; when: (row, value) =>
# boolean; style: CSSProperties }>——单元格级条件样式（异常值/状态高亮）；
# core 纯函数匹配（框架无关规则结构 + 匹配器）；样式用 --iris-* token。
# 范围：react only；additive；core 纯函数。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-ax.yaml \
#   --log-file logs/iris-ui-batch-ax.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui grid batch AX (conditional
      formatting). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the body cell render (where cellStyle applies — the conditional
         styles merge AFTER cellStyle so rules win), the props surface.
      2. /home/u1/iris-ui/packages/core/src/ — pure function conventions.

      Write a markdown baseline to the output path:
      - proposed design:
        a) core matchConditionalStyles<Row>(rules: ReadonlyArray<{
           column?: string; when: (row: Row, value: unknown) => boolean;
           style: Record<string, string | number> }>, row: Row, columnKey:
           string, value: unknown): Array<Record<string, string | number>>
           — returns the styles of every rule that matches (column filter +
           when); empty when none; the style shape is framework-neutral
           (CSSProperties-like record); tests (column filter, multiple
           matches, no match, column-less rules apply to every column)
        b) react conditionalStyles?: Array<{ column?: string; when: (row:
           Row, value: unknown) => boolean; style: import('react').
           CSSProperties }> (single-line prop) — the body cell style merge:
           ...cellStyle, ...matchConditionalStyles(...) merged (later rules
           win); rules with token values (var(--iris-*)) work; editing
           cells keep the rules (the editor overlay is unaffected —
           document); performance note: rules evaluate per cell (memo? the
           cell render is already per-row — evaluate inline, document the
           cost for huge tables; virtual scroll limits the visible cells)
        c) docs + example snippet
      - file map + tests
      Do NOT modify files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-ax-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui grid batch AX (conditional formatting) in
          /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-ax-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; react only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props.
          - CSS uses --iris-* tokens only (rule styles may use token vars).
          - TIME BUDGET: light — finish both.

          IMPLEMENT:
          1. core (packages/core/src/conditional-styles.ts NEW + tests):
             - matchConditionalStyles per the baseline; export from
               index.ts; tests
          2. react (props.ts + types.ts + Table.tsx):
             - conditionalStyles?: Array<{ column?: string; when: (row:
               Row, value: unknown) => boolean; style:
               import('react').CSSProperties }> (single line)
             - body cell style merge: after cellStyle, merge
               matchConditionalStyles(...) (later rules win); the value
               passed is the raw cell value (getCellValue)
             - tests: a rule highlights matching cells (style applied);
               column filter; multiple rules merge in order; no match →
               unchanged
          3. Docs: iris 独有 section + example snippet

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/core test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ax-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch AX. Read
          batch-ax-baseline.md and batch-ax-adapt.md, inspect.

          Check:
          1. matchConditionalStyles: column filter; multi-match order;
             column-less rules; empty result
          2. react: style merge order (after cellStyle, later rules win);
             raw value passed; editing cells unaffected
          3. additive only; manifest hygiene; core framework-free; CSS
             tokens
          Run verification commands (core test, react test/typecheck/lint,
          audit, check:manifest). Write verdict markdown: PASS or FAIL with
          numbered findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ax-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch AX. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-ax-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): grid 批 AX——单元格条件格式（when 谓词 + 样式规则）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ax-gate.md
