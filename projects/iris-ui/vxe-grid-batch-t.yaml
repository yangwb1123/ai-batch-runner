# iris-ui vxe-grid 批 T：表格方法扩展 + 事件补齐 + radio 列视觉 + 分页总数
#
# 目标（tableProps 之外的方法/事件/UI 功能面）：
# 1. IrisTableHandle 扩展：scrollToRow / toggleRowExpand / clearSort /
#    clearFilter / setCurrentRow / setCurrentColumn（vxe 方法 parity）
# 2. 事件补齐：onCellDblClick / onRowDblClick / onHeaderClick /
#    onExpandChange / onTreeExpandChange / onFilterChange
# 3. radio 列视觉：selectable='single' 用 radio 圆圈（vxe type='radio' 列）
# 4. pagerConfig.showTotal：分页总条数显示（vxe pagerConfig parity）
# 范围：react only；additive。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-t.yaml \
#   --log-file logs/iris-ui-batch-t.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch T (handle
      methods + events + radio UI + pager total). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the IrisTableHandle object (~line 1980-2040, methods
         insertRow/removeRow/removeRows/updateRow/refetch/getData/
         getSelection/clearSelection/selectAll/toggleRowSelection), the
         event call sites (onRowClick in the row render, onCellClick in
         handleCellClick), the expand toggle render
         (data-iris-table-expand-toggle ~2957), the selection checkbox
         column render (IrisCheckbox — the radio visual swap), the pager
         render block (IrisPagination + pageSizes selector).
      2. /home/u1/iris-ui/packages/react/src/primitives/table/props.ts +
         types.ts — IrisTableHandle, IrisTablePagerConfig, cellRange.

      Write a markdown baseline to the output path:
      - proposed iris design (react only, additive):
        a) IrisTableHandle additions (all single-line):
           - scrollToRow(key: string | number): void — find the row in
             bodyData, scroll its DOM node into view
             (scrollIntoView({ block: 'nearest' }))
           - toggleRowExpand(key: string | number): void — toggle the
             expansion model for the key (works in tree mode AND detail-row
             mode)
           - clearSort(): void — reset the sort state (multi + single)
           - clearFilter(): void — clear filters + filterValues (both
             channels, via the existing clear handlers — find them)
           - setCurrentRow(key: string | number): void — set the current row
             (goes through onCurrentRowChange if provided, else no-op —
             document; or maintain internal current state? keep it simple:
             fires onCurrentRowChange(key, row) when the row exists and the
             handler is provided)
           - setCurrentColumn(key: string): void — same via
             onCurrentColumnChange
        b) events (props single-lines; params via named exported
           interfaces where inline objects would appear):
           - onCellDblClick?: (params: IrisTableCellClickParams<Row>) => void
             (reuse the existing params interface) — fired on cell
             dblclick; when col.editable with trigger dblclick, the edit
             still starts (internal first, then the event)
           - onRowDblClick?: (row: Row, rowIndex: number) => void
           - onHeaderClick?: (column: IrisTableColumn<Row>) => void —
             fired on header cell click AFTER the sort toggle (sortable
             headers still sort; the event is informational)
           - onExpandChange?: (row: Row, expanded: boolean) => void — fired
             when a detail row toggles (renderDetail mode)
           - onTreeExpandChange?: (row: Row, expanded: boolean) => void —
             tree mode expansion toggle (fired from the tree caret)
           - onFilterChange?: (filters: Record<string, string>) => void —
             fired when the text filters change (the existing
             onFiltersChange already exists? — check; if it does, alias or
             skip this one and document)
        c) radio visual: selectable='single' renders the selection column
           as a RADIO (circle) instead of a checkbox — swap the IrisCheckbox
           for a radio-styled button (native input[type=radio] styled with
           --iris-* tokens, or a CSS circle); keep the same data attributes
           and aria semantics; header cell for single mode stays empty
        d) pagerConfig.showTotal?: boolean — when proxy mode renders the
           pager, show `共 N 条` (i18n table.total) before the page-size
           selector
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-t-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch T (handle methods + events +
          radio UI + pager total) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-t-baseline.md. Read it first,
          then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; React only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: function-type props on ONE line; inline
            object params use named exported interfaces; export new types
            from index.ts.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: (1) events (light); (2) handle methods (light);
            (3) radio UI + pager total (light). All light — finish all.

          IMPLEMENT:
          1. handle methods (types.ts + Table.tsx):
             - add the six methods to IrisTableHandle (single-line type
               entries)
             - scrollToRow: find the row DOM node via
               `[data-iris-table-row="<key>"]` in the root and
               scrollIntoView({ block: 'nearest' }) (guard jsdom)
             - toggleRowExpand: if treeMode → expansion.toggle(String(key));
               else if renderDetail → toggle the detail expansion model
               (find how detail rows track expansion — there is an expand
               toggle; reuse its controller); no-op otherwise
             - clearSort: use the sort hooks (setSort(null) / multi
               setMultiSort([]))
             - clearFilter: clear both the filters channel and filterValues
               via their change handlers (onFiltersChange?.({}) and
               onFilterValuesChange?.({})) — or internal state if
               uncontrolled (match how filters are handled today; check if
               filters has an internal mode)
             - setCurrentRow/setCurrentColumn: find the row/column and fire
               the existing onCurrentRowChange/onCurrentColumnChange
               handlers (no-op without handlers, documented)
          2. events (props.ts + Table.tsx):
             - onCellDblClick: in the cell onDoubleClick (which today starts
               the edit for editable columns) — fire the event after the
               edit begins; non-editable columns now also fire it (add the
               handler to the cell)
             - onRowDblClick: row onDoubleClick next to the existing onClick
             - onHeaderClick: header cell onClick — fire after the sort
               toggle (flat + grouped branches)
             - onExpandChange: the detail expand toggle onClick handler
             - onTreeExpandChange: the tree caret onClick handler
             - onFilterChange: check if onFiltersChange already exists — if
               yes, SKIP adding onFilterChange and document that the text
               channel uses onFiltersChange; add onFilterValuesChange? —
               also exists (batch I). Document both; only add what is
               missing.
          3. radio visual (Table.tsx + styles.ts):
             - selectable === 'single': the selection cell renders a radio
               (input[type=radio] checked={selected} onChange=toggleRow,
               data-iris-table-radio, accent-color var(--iris-primary) or a
               custom circle via CSS — prefer native radio with
               accent-color: var(--iris-primary)); keep aria-label; header
               cell for single stays empty (unchanged)
          4. pager total (Table.tsx + i18n):
             - pagerConfig.showTotal: render `<span data-iris-table-total>共
               {proxyState.total} 条</span>` (i18n table.total — en:
               `Total {n}`; zh: `共 {n} 条`) before the page-size selector
             - i18n keys en + zh
          5. Tests (new handle-events-radio.test.tsx):
             - scrollToRow calls scrollIntoView on the row node (stub
               Element.prototype.scrollIntoView)
             - toggleRowExpand toggles the detail expansion
             - clearSort resets the sort indicator; clearFilter empties the
               filter input state
             - setCurrentRow/setCurrentColumn fire the handlers
             - onCellDblClick/onRowDblClick/onHeaderClick/onExpandChange/
               onTreeExpandChange fire with the right params
             - single mode renders input[type=radio]; multi unchanged
             - showTotal renders the total text

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, unfinished items.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-t-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch T (methods +
