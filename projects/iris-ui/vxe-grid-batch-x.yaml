# iris-ui vxe-grid 批 X：vue 框架功能对齐（proxyConfig/formConfig/multiSort/toolbar 扩展）
#
# 目标：把 react 已完成的 vxe-grid 功能面同步到 vue 适配器（vue 的
# IrisTable 目前停留在批 1 功能面）。范围（核心 4 项，全部复用 core 控制器）：
# 1. proxyConfig：服务端数据源（core createRemoteTableSource 已有——vue 薄桥）
# 2. formConfig：搜索表单（提交合并 filters + 页码重置 / 本地过滤）
# 3. multiSort：多列排序（core/useTableSort 逻辑——vue 版比较器）
# 4. toolbar 扩展：buttons / batch / onExport / zoom
# 后续批 Y 再做：行操作 expose / 懒加载树 / 右键菜单 / 筛选面板。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-x.yaml \
#   --log-file logs/iris-ui-batch-x.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch X (vue
      adapter feature parity — proxyConfig/formConfig/multiSort/toolbar).
      Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/vue/src/primitives/table/Table.ts — the
         vue IrisTable structure (defineComponent, props, setup, computed
         data pipeline: sortedData/bodyData, existing sort/filter handling,
         toolbar render if any, i18n usage).
      2. /home/u1/iris-ui/packages/core/src/remote-table.ts —
         createRemoteTableSource (the framework-agnostic proxy controller
         react already bridges).
      3. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the REACT reference implementations to mirror (search for the
         proxyConfig bridge, formConfig, multiSort usage, toolbar render).
      4. /home/u1/iris-ui/packages/vue/src/primitives/table/controlProps.ts
         + types.ts — the vue prop surface.
      5. /home/u1/iris-ui/packages/vue/src/primitives/ — available vue
         primitives (form-field/input/select/button/pagination).

      Write a markdown baseline to the output path:
      - vue table current state (what exists vs react)
      - proposed vue design (framework-idiomatic, thin bridge over core):
        a) proxyConfig prop (same shape as react: query/autoLoad/
           remoteSort/remoteFilter/pageSize/onPageChange) — controller
           created in setup (onScopeDispose destroy), state via refs,
           loading/error driven, data flows into the table data pipeline,
           pager renders (vue IrisPagination — check its props)
        b) formConfig prop (fields/submitText/resetText/onSearch/onReset) —
           form state refs, draft/applied two-state, submit merges into
           filters (proxy: setParams; local: effective filters in the
           filtered data memo), reset clears + re-queries
        c) multiSort prop + multiSortState/onMultiSortChange — header click
           cycles append/asc/desc/remove, sequence numbers, comparator in
           the sorted data memo (vue version — pure function over the sort
           array), single mode untouched
        d) toolbar extension: buttons (label/onClick/icon), batch (label/
           onClick), onExport, zoom? (SKIP zoom for vue — document;
           include buttons/batch/onExport only)
      - file map + tests (vue test file next to Table.test.ts)
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-x-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch X (vue adapter parity —
          proxyConfig/formConfig/multiSort/toolbar extension) in
          /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-x-baseline.md. Read it first,
          then AGENTS.md.

          HARD CONSTRAINTS:
          - Logic in packages/core stays framework-free — the vue bridge
            ONLY wires core controllers (createRemoteTableSource etc.) into
            the vue component; do NOT reimplement controller logic in vue.
          - Vue only — do NOT touch react/solid/svelte packages.
          - Additive props only. No breaking changes to the vue table API.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: function-type props stay single-line;
            inline object params use named exported interfaces; export new
            types from the vue table index.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: (1) proxyConfig (heavy); (2) toolbar extension
            (light); (3) formConfig (medium); (4) multiSort (medium). Order
            accordingly; if low on time finish 1+2, then 3, then 4 — leave
            the rest for batch Y with a clear handoff note.

          IMPLEMENT (mirror the react reference semantics exactly):
          1. proxyConfig (Table.ts + controlProps + types):
             - props: proxyConfig (query/autoLoad/remoteSort/remoteFilter/
               pageSize/onPageChange)
             - setup: create the controller once (createRemoteTableSource
               with query), subscribe state into refs (data/total/loading/
               error), onScopeDispose → destroy
             - data pipeline: proxy data feeds the table rows (the existing
               data prop stays; proxy wins when present)
             - remote sort/filter: sort/filter changes call setParams (no
               local processing)
             - pager: render below the body (vue IrisPagination — check the
               vue pagination primitive props; value/total/pageSize/
               onValueChange or similar); page change → setParams; pageSizes
               NOT required for batch X (document)
             - edit write-back: committed edits update the local copy until
               the next refetch (mirror the react liveData approach — vue:
               a ref holding the current rows, edits write through)
          2. toolbar extension (controlProps + Table.ts + types):
             - toolbar.buttons?: Array<{ key; label; onClick; icon? }>
             - toolbar.batch?: { label; onClick(keys) } — rendered when
               multi-selection is non-empty
             - toolbar.onExport?: () => void — export button
             - render after the built-ins (refresh/import if present — check
               what the vue toolbar has today and extend it)
          3. formConfig (controlProps + Table.ts):
             - fields (key/label/type text|select/options/placeholder/
               defaultValue), submitText/resetText, onSearch/onReset
             - draft state refs (per field), applied values ref
             - submit: strip empties → onSearch → proxy setParams
               ({ filters: merged, page: 1 }) or local effective filters in
               the filter memo
             - reset: defaults + re-query (mirror react: setParams no-op →
               forced refetch)
             - i18n keys exist already (table.formSubmit/formReset in core)
          4. multiSort (Table.ts + types):
             - multiSort?: boolean; multiSortState?: IrisTableSortState[];
               onMultiSortChange? — header click: append/cycle/remove;
               sequence number render (small muted number after the
               direction icon); comparator: ordered array comparison in the
               sorted-data computed; single mode unchanged
          5. Tests (new table/parity-x.test.ts next to Table.test.ts):
             - proxyConfig: loading → rows; remote sort re-query; page
               change query; autoLoad false
             - formConfig: submit merges filters + page reset (proxy); local
               filtering; reset clears
             - multiSort: header clicks build the array; sequence numbers;
               comparator order
             - toolbar: buttons render + fire; batch gated by selection;
               export fires

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/vue typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/vue test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/vue lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left for batch
          Y (explicit handoff list).
        output: /home/u1/iris-ui/docs/vxe-grid/batch-x-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch X (vue parity).
          Read batch-x-baseline.md and batch-x-adapt.md, inspect the vue
          implementation (Table.ts/controlProps/types + tests) against the
          react reference semantics.

          Check:
          1. proxyConfig: controller lifecycle (create/destroy); loading/
             error drive the vue states; remote sort/filter/page; pager
             wiring; edit write-back survives until refetch
          2. formConfig: draft/applied; submit page reset; local mode;
             reset behavior
          3. multiSort: array semantics; single mode untouched; comparator
             correct
          4. toolbar: buttons/batch/export render + fire; existing toolbar
             intact
          5. core stays framework-free (grep packages/core/src for vue
             imports = 0); additive; manifest hygiene (check:manifest);
             CSS tokens
          Run verification commands (vue typecheck/test/lint, audit,
          check:manifest). Write verdict markdown: PASS or FAIL with numbered
          findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-x-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch X (vue parity). Read the review
          verdict /home/u1/iris-ui/docs/vxe-grid/batch-x-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Update /home/u1/iris-ui/docs/vxe-grid-comparison.md: mark batch X
            rows (vue: proxyConfig/formConfig/multiSort/toolbar 扩展) done
            (vue) and note the remaining vue gaps for batch Y.
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): vxe-grid 批 X——vue 适配器功能对齐（proxyConfig/formConfig/multiSort/工具栏扩展）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-x-gate.md
