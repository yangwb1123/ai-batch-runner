# iris-ui grid 批 BB：批注编辑 UI（可写批注闭环）
#
# 目标：annotationEditing?: boolean——右键菜单内置"添加/编辑批注"项 →
# 面板（textarea + 保存/删除）→ 经 onAnnotationsChange 受控写回；
# 有批注单元格右键显示"编辑/删除"。
# 范围：react only；additive。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-bb.yaml \
#   --log-file logs/iris-ui-batch-bb.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui grid batch BB (annotation
      editing). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the contextMenu machinery (batch H: items + onSelect; batch AM/
         AW: the built-in items 值分布/摘要 — mirror the pattern), the
         annotations machinery (batch AZ: annotations prop + cellId key),
         the i18n.
      2. /home/u1/iris-ui/packages/react/src/primitives/table/props.ts —
         annotations prop shape.

      Write a markdown baseline to the output path:
      - proposed design:
        a) onAnnotationsChange?: (next: Record<string, string>) => void
           (single line) — the controlled write channel; annotations stay
           controlled (no internal state, document)
        b) annotationEditing?: boolean — when true: the context menu gains
           a built-in item 添加批注 (key '__iris-annotate') — or 编辑批注/
           删除批注 when the cell already has one (three keys:
           '__iris-annotate' / '__iris-annotate-edit' /
           '__iris-annotate-remove'); selecting opens a small panel
           (data-iris-annotate-panel, like the distribution panel):
           textarea (data-iris-annotate-input, seeded with the existing
           note) + 保存 (data-iris-annotate-save) / 删除 (only when a note
           exists) / close; save → onAnnotationsChange({ ...annotations,
           [cellKey]: text }) (empty text removes the key); the panel is
           positioned at the context menu anchor (the same floating
           pattern)
        c) i18n table.annotate / table.annotate.save / table.annotate.edit /
           table.annotate.remove (en + zh)
      - file map + tests
      Do NOT modify files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-bb-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui grid batch BB (annotation editing) in
          /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-bb-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; react only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: light-medium — finish both.

          IMPLEMENT:
          1. react (props.ts + Table.tsx + i18n):
             - onAnnotationsChange?: (next: Record<string, string>) => void
               (single line); annotationEditing?: boolean (single line)
             - contextMenu: when annotationEditing, append the built-in
               items (添加批注 or 编辑批注/删除批注 based on the cell's
               existing note — after the 摘要 item); onSelect routes to
               the annotate panel (data-iris-annotate-panel) with the
               textarea + 保存 + (删除 when a note exists); save → empty
               text removes the key, else sets it, via
               onAnnotationsChange; close paths (Esc/outside)
             - tests: menu items vary by existing note; save writes the
               key; empty text removes; remove deletes; no callbacks → the
               items still show but save is inert (document); no prop →
               no items
          2. Docs: iris 独有 section

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-bb-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch BB. Read
          batch-bb-baseline.md and batch-bb-adapt.md, inspect.

          Check:
          1. menu items conditional on the existing note; placement after
             摘要; save/remove semantics (empty removes); onAnnotationsChange
             called with a new object
          2. panel: textarea seeded; dismiss paths; no callbacks → inert
             save but items visible (documented)
          3. additive only; manifest hygiene; core framework-free; CSS
             tokens; i18n both languages
          Run verification commands (react test/typecheck/lint, audit,
          check:manifest). Write verdict markdown: PASS or FAIL with numbered
          findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-bb-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch BB. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-bb-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): grid 批 BB——批注编辑 UI（可写批注闭环）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-bb-gate.md
