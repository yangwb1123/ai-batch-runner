# iris-ui grid 批 AI：自然语言查询（AI 原生定位的差异化能力）
#
# 目标（iris "AI 原生 API" 定位——vxe 与主流 grid 均无）：
# 1. core：parseTableQuery 纯函数——把自然语言查询解析为结构化条件
#    （`age > 25 and role = Develop`、`name contains test`、
#    `status in (active, paused)`）→ 过滤 + 排序条件
# 2. react：query prop + 查询条 UI（工具栏输入）——解析结果经现有
#    filters/filterValues 通道应用；无效查询提示不崩溃
# 范围：react only；additive；逻辑下沉 core。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-ai.yaml \
#   --log-file logs/iris-ui-batch-ai.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui grid batch AI (natural
      language query). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/core/src/ — the filterSort material
         (DataViewQuery: filters/operators/sort shape — the parsed query
         should map into it), i18n.ts key style.
      2. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the filters/filterValues merge points (filteredData memo), the
         toolbar render (where a query input would live), the i18n usage.
      3. /home/u1/iris-ui/packages/react/src/primitives/table/props.ts —
         filters/filterValues prop shapes.

      Write a markdown baseline to the output path:
      - proposed design (core pure function + react bridge, additive):
        a) core parseTableQuery(query: string): { filters: Record<string,
           string>; inValues: Record<string, string[]>; sort: { key;
           direction } | null; error?: string } — grammar (documented):
           - `field op value` where op ∈ { =, !=, >, >=, <, <=, contains,
             in }
           - `in (a, b, c)` → inValues
           - AND/OR between conditions (OR maps to inValues for the same
             field; mixed AND/OR across fields → AND semantics, document)
           - `sort by field asc|desc` (optional trailing clause) → sort
           - field/value are bare tokens or quoted ("role = 'Test'")
           - unknown field → error string (not throw)
           - empty query → empty result
           tests: each op, quoted values, in-list, sort clause, AND/OR,
           errors (unknown field, bad syntax), case-insensitive fields
        b) react: query?: string; onQueryChange?: (next: string) => void —
           when query is provided, the toolbar renders a query input
           (data-iris-table-query-input, placeholder via i18n
           table.queryPlaceholder: '自然语言筛选，如 age > 25 and role =
           Test'); parse on every query change (memo); the parsed filters
           MERGE into the existing filter path (substring filters + inValues
           via the filterValues channel — local mode applies in the
           filteredData memo; proxy mode merges into the query filters as
           comma-join — document); sort from the clause applies ONLY when
           no explicit sort prop is set (document); parse error → show a
           muted hint under the input (data-iris-query-error) + the table
           keeps the last valid parse (document)
        c) i18n: table.queryPlaceholder (+ zh)
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-ai-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui grid batch AI (natural language query) in
          /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-ai-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; react only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props; named
            exported interfaces; export new types.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: (1) core parser + tests (medium); (2) react bridge
            + query input (light-medium). If low, finish 1 + the input
            render + merge, then tests.

          IMPLEMENT:
          1. core (packages/core/src/query-parser.ts NEW + tests):
             - parseTableQuery per the baseline grammar; export from
               packages/core/src/index.ts; comprehensive tests (ops,
               quoted values, in-lists, sort clause, AND/OR, errors,
               empty, case-insensitive fields, whitespace tolerance)
          2. react (props.ts + Table.tsx + i18n):
             - query?: string; onQueryChange?: (next: string) => void
               (single lines)
             - toolbar: when query !== undefined, render the input
               (data-iris-table-query-input) after the title (left side)
               with the i18n placeholder; onChange → onQueryChange
             - parse memo over the query (last valid parse kept on error —
               a ref holding the previous result; error shows
               data-iris-query-error hint)
             - merge: parsed.filters AND-parsed into the filteredData memo
               (substring semantics same as the filters prop); parsed
               inValues via the filterValues channel semantics (OR-match);
               parsed.sort applies only when sort prop is undefined
               (document); proxy mode: comma-join into the remote merge
             - i18n: table.queryPlaceholder + zh
          3. Tests (react query-input.test.tsx):
             - input renders with the placeholder; typing calls onQueryChange
             - a query filters rows locally (age > 25)
             - in-list filters (role in (Test, PM))
             - bad query shows the error hint and keeps the last valid
               filter
             - proxy mode: the query merges into the query filters
          4. Docs: add the feature to the iris 独有 section

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/core test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ai-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch AI (NL query).
          Read batch-ai-baseline.md and batch-ai-adapt.md, inspect.

          Check:
          1. parser: every op; quoted values; in-lists; sort clause;
             AND/OR semantics; error strings (no throw); empty; edge cases
             (whitespace, case, unknown field)
          2. react: input render + gating (query !== undefined); error
             hint + last-valid-parse; local merge (substring + inValues);
             proxy merge; sort-only-when-uncontrolled
          3. additive only; manifest hygiene; core framework-free; CSS
             tokens; i18n both languages
          Run verification commands (core test, react test/typecheck/lint,
          audit, check:manifest). Write verdict markdown: PASS or FAIL with
          numbered findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ai-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch AI. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-ai-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): grid 批 AI——自然语言查询（iris AI 原生定位）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ai-gate.md
