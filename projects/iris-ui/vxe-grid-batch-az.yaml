# iris-ui grid 批 AZ：单元格注释（批注——角标 + 悬停提示）
#
# 目标：annotations?: Record<string, string>（"rowKey::colKey" → 注释文本）
# 或 cellNote?: (row, column) => string——单元格右上角小三角批注标记 +
# 悬停显示注释（title 通道）；角标样式 --iris-* token。
# 范围：react only；additive。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-az.yaml \
#   --log-file logs/iris-ui-batch-az.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui grid batch AZ (cell
      annotations). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the body cell render (data-iris-table-cell + style + the tooltip
         title path), the cellId helper (how "rowKey::colKey" is formed —
         reuse the same key format), the baseCellStyle position (the badge
         needs position relative — check).
      2. /home/u1/iris-ui/packages/react/src/primitives/table/types.ts —
         column types.

      Write a markdown baseline to the output path:
      - proposed design:
        a) annotations?: Record<string, string> — key format
           `${rowKey}::${col.key}` (match cellId); when a cell has a note:
           render a small corner triangle (data-iris-cell-note, 6px
           absolute top-right, background var(--iris-warning) or
           var(--iris-primary)? pick warning-tinted: use
           var(--iris-warning) if present in the tokens, else primary;
           document) + the cell title shows the note (the tooltip title
           path: the note WINS over tooltipConfig/cellTooltip — document)
        b) cellNote?: (row: Row, column: IrisTableColumn<Row>) => string |
           null — dynamic notes (computed per cell; wins over the static
           annotations map for the same cell — document)
        c) tests: static note renders the badge + title; dynamic note;
           both → dynamic wins; no note → no badge
      - file map + tests
      Do NOT modify files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-az-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui grid batch AZ (cell annotations) in
          /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-az-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; react only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: light — finish both.

          IMPLEMENT:
          1. react (props.ts + Table.tsx + styles.ts):
             - annotations?: Record<string, string> (single line);
               cellNote?: (row: Row, column: IrisTableColumn<Row>) =>
               string | null (single line)
             - per cell: note = cellNote?.(row, col) ?? annotations[cellId
               key] — the note wins over the static map; with a note: the
               cell gets data-iris-cell-note + a corner triangle span
               (data-iris-cell-note-badge, 6px, absolute top-right,
               background var(--iris-warning, var(--iris-primary))) + the
               cell title = the note (wins over cellTooltip); the cell
               needs position relative (the baseCellStyle — add position
               relative only when a note exists, or always? always is
               simpler — but it changes the pinned cells? position
               relative + sticky conflict — the pinned style sets
               position sticky which overrides relative — the badge inside
               a pinned cell still positions against the sticky cell —
               document; add position relative in the note case only)
             - tests: static note badge + title; dynamic note; dynamic
               wins; no note → no badge; tooltip precedence
          2. Docs: iris 独有 section + example snippet

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-az-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch AZ. Read
          batch-az-baseline.md and batch-az-adapt.md, inspect.

          Check:
          1. key format matches cellId; note precedence (dynamic > static >
             none); title wins over tooltipConfig
          2. badge: only with a note; position relative only in the note
             case (pinned cells unaffected); token color
          3. additive only; manifest hygiene; core framework-free; CSS
             tokens
          Run verification commands (react test/typecheck/lint, audit,
          check:manifest). Write verdict markdown: PASS or FAIL with numbered
          findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-az-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch AZ. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-az-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): grid 批 AZ——单元格注释（批注角标 + 悬停提示）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-az-gate.md
