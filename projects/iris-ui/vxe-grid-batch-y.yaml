      - proposed vue design (framework-idiomatic, thin bridge over core):
        a) columnVisibility?: Record<string, boolean> +
           onColumnVisibilityChange? — displayColumns computed filters
           hidden columns from every render path (header/body/summary)
        b) filters?: Record<string, string> — client-side substring filter
           in the filtered-data computed (case-insensitive, '' ignored);
