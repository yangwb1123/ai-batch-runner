  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch Y (vue parity round 2 —
          columnVisibility/filters/seq/spanMethod/columnDrag/rowDrag/proxy
          methods) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-y-baseline.md. Read it first,
          then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; vue bridge only (no reimplementation of
            controller logic in vue); do NOT touch react/solid/svelte.
          - Additive props only. No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props; named
            exported interfaces for inline object params; export new types
            from the vue table index.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: (1) columnVisibility + filters + seq (light);
            (2) spanMethod (light-medium); (3) columnDrag + rowDrag
            (medium — the createSortable bridge is the fiddly part); (4)
            expose methods (light). Order accordingly; if low, finish 1+2+4
            and leave drag for batch Z with a handoff note.

          IMPLEMENT (mirror the react reference semantics):
          1. columnVisibility (types + Table.ts):
             - prop + event; displayColumns computed: safeColumns filtered
               by visibility (false hides); every render path uses
               displayColumns (header/body/summary)
          2. filters (types + Table.ts):
             - prop; the filtered-data computed applies substring
               case-insensitive matching ('' entries ignored) over
               displayColumns; combines with formConfig values (batch X)
               if both exist (AND)
          3. seq + seqStartIndex (types + Table.ts):
             - leading sequence column before selection (data-iris-table-
               cell="__seq"); value idx + seqStartIndex
          4. spanMethod (types + Table.ts):
             - (params: { rowIndex; columnIndex }) => { rowspan?; colspan? }
               | null; occupied-set skip across rows (mirror react: clear
               the set once per body render pass, mark occupied cells)
          5. columnDrag (types + Table.ts):
             - header cells get pointer handlers (createSortable bridge —
               mirror the react implementation: press → threshold →
               moveOver by closestCenter using ref-synced rects → end →
               reorder the columns array via onColumnOrderChange or internal
               order state; grouped headers NOT supported — document)
          6. rowDrag (types + Table.ts):
             - row handle (data-iris-row-drag-handle) + container pointer
               events; createSortable bridge; end → reorder the rows
               (through the local rows ref + onDataChange if provided)
          7. expose (Table.ts):
             - defineExpose: loadData/reloadData/commitProxy/getProxyInfo —
               bridge the batch-X proxy controller (createRemoteTableSource);
               loadData writes the local rows ref without a query
          8. Tests (new table/parity-y.test.ts):
             - columnVisibility hides columns; filters substring
             - seq renders idx+start; spanMethod merges + occupied skip
             - columnDrag reorders (pointer simulation); rowDrag reorders
             - expose methods: loadData without query; reloadData queries
               again; getProxyInfo shape

