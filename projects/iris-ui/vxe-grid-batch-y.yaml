           drag reorder via core createSortable (mirror the react bridge:
           pointer handlers on header cells, move-over → closestCenter,
           end → reorder columns)
        d) rowDrag?: boolean — row drag via createSortable (row handle +
           container pointer events, mirror react batch 2)
        e) expose (vue defineExpose): loadData(rows) / reloadData() /
           commitProxy(params?) / getProxyInfo() — bridge the batch-X proxy
           controller (createRemoteTableSource); loadData writes the local
           rows ref without a query
