# iris-ui advance 批 4：a11y 契约剩余覆盖（~121 组件 + 延后 4 组件）
#
# 执行（隔离 worktree，勿在主工作区跑）：
#   cd /home/u1/iris-ui/.pi-batch/worktrees/advance
#   python3 /home/u1/ai-batch-runner/pi-batch.py \
#     /home/u1/ai-batch-runner/projects/iris-ui/advance-a11y-remaining.yaml \
#     --log-file /home/u1/iris-ui/logs/advance-a11y-remaining.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/.pi-batch/worktrees/advance/docs/advance/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui advance 批 4：a11y 契约剩余覆盖.
      Isolated worktree: /home/u1/iris-ui/.pi-batch/worktrees/advance (branch
      feat/advance-directions — batches 1-3 commits already present; batch 1
      delivered the a11y contract machinery for 30 components).
      Monorepo facts:
      - packages/manifest/src/a11y.ts + a11y-registry.ts: curated registry
        (A11Y_SCOPE = 30 components) → regex-verified claims with per-file
        line-offset evidence (233/233 resolvable); scope ratchet test pins
        the exact 30 × 4 frameworks.
      - packages/manifest/src/a11y-scope.test.ts: fail-closed scope ratchet.
      - Deferred in batch 1: IrisTreeSelect / IrisDatePicker /
        IrisCalendar / IrisTransfer + the remaining ~121 components.
      Read a11y-registry.ts structure (entry shape, verify overrides,
      relationships, i18nKeys), a11y.ts extractor, the scope test, and the
      batch-1 adapt/gate reports. Write the baseline to the output path:
      the exact additive plan to extend coverage to the remaining
      components, with file map + test plan. Design constraints:
      (a) Extend A11Y_SCOPE + curated entries following the batch-1 shape
      exactly (same claim categories, evidence discipline: claims the
      regex cannot verify are proposedFields, never asserted).
      (b) Prefer breadth with honesty over false natives: if a component's
      a11y surface is thin (e.g. Spinner, Kbd, VisuallyHidden), a minimal
      but accurate entry (role only, few keyboard items) is fine; skip
      entries only when even the role cannot be verified — then list them
      as out-of-scope with reason.
      (c) Priorities: (1) the 4 deferred compounds (TreeSelect/DatePicker/
      Calendar/Transfer) which have real keyboard/aria surfaces; (2) data
      & navigation primitives with interactive roles; (3) display-only
      primitives (fast minimal entries). Target coverage: all manifest
      components have either an a11y entry or an explicit out-of-scope
      reason — ratchet updated to pin the new coverage set.
      (d) MCP guidance renderer and codegen comments stay unchanged
      (they consume records generically); verify no consumer drift.
      Do NOT modify files; report exact file paths to create/change and
      the component→outcome matrix.
    output: /home/u1/iris-ui/.pi-batch/worktrees/advance/docs/advance/batch-4-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui/.pi-batch/worktrees/advance
        prompt: |
          Implement iris-ui advance 批 4：a11y 契约剩余覆盖 in the isolated worktree
          /home/u1/iris-ui/.pi-batch/worktrees/advance, per the baseline
          /home/u1/iris-ui/.pi-batch/worktrees/advance/docs/advance/batch-4-baseline.md.
          Read it first, then AGENTS.md and the batch-1 implementation
          (packages/manifest/src/a11y.ts + a11y-registry.ts) as the mold.

          HARD CONSTRAINTS:
          - Extend, do not refactor: same entry shape, same claim
            categories, same evidence discipline. Every claim verified by
            the extractor against the React reference source; unverifiable
            → proposedFields. No fabricated 'native'.
          - Scope ratchet test updated to pin the new coverage set (all
            components either covered or explicitly out-of-scope).
          - Additive only; manifest stats unchanged; gen:manifest +
            check:manifest + check:docs-reference must stay green.
          - No dist/tgz/node_modules edits. No adapter source changes
            (metadata only) unless a genuine a11y BUG is discovered — then
            report it, do not fix out-of-batch (log as finding).
          - TIME BUDGET: medium — finish completely. Mechanical breadth
            over depth; thin entries for display-only primitives.

          VERIFY (run in the worktree):
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/manifest test && ... typecheck && ... lint`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm
            gen:manifest && pnpm check:manifest && pnpm
            check:docs-reference`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/mcp test` (consumers unaffected)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          Report: coverage matrix delta (before/after), native vs proposed
          counts, any genuine a11y bugs found (reported, not fixed),
          test counts, what is left. Do not commit.
        output: /home/u1/iris-ui/.pi-batch/worktrees/advance/docs/advance/batch-4-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui/.pi-batch/worktrees/advance
        prompt: |
          You are the adversarial reviewer for iris-ui advance 批 4：a11y 契约剩余覆盖.
          Read batch-4-baseline.md and batch-4-adapt.md in
          /home/u1/iris-ui/.pi-batch/worktrees/advance/docs/advance/, inspect
          the implementation. Check: evidence discipline (no fabricated
          native claims — spot-check 10+ entries against source), scope
          ratchet pins the new set, batch-1 machinery unmodified in
          behavior, gen:manifest + check:manifest + check:docs-reference
          green, additive only. Run verification commands. Write verdict
          markdown: PASS or FAIL with numbered findings (severity,
          file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/.pi-batch/worktrees/advance/docs/advance/batch-4-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui/.pi-batch/worktrees/advance
        prompt: |
          Gate stage for iris-ui advance 批 4：a11y 契约剩余覆盖. Read the review verdict
          /home/u1/iris-ui/.pi-batch/worktrees/advance/docs/advance/batch-4-review.md.
          If PASS: run the full repo gate in the worktree
          (`env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm turbo run
          test typecheck lint build --concurrency=2`), gen:manifest +
          check:manifest + check:docs-reference, update
          docs/advance/SUMMARY.md, and commit on branch
          feat/advance-directions:
          `git add -A -- . ':!node_modules' && git commit -m
          "feat(manifest): advance 批 4——a11y 契约剩余覆盖"`
          Report commit hash, coverage matrix, and final test counts.
          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/.pi-batch/worktrees/advance/docs/advance/batch-4-gate.md
