# iris-ui vxe-grid 批 J：树形懒加载 + 批量删除 + Tab 编辑导航
#
# 目标：
# 1. 树形懒加载（vxe tree-config.lazy parity）：展开无子节点的行时异步
#    加载子节点并注入
# 2. 批量删除（handle.removeRows）：多选后批量移除行（vxe removeRows parity）
# 3. Tab 编辑导航：编辑态 Tab 提交并进入下一列（vxe edit 键盘体验）
# 范围：react only；additive。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-j.yaml \
#   --log-file logs/iris-ui-batch-j.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch J (lazy tree +
      batch delete + Tab edit navigation). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         tree mode (getSubRows, flattenTree, flatTree memo around line 1105,
         the tree toggle button render), the editing input/select/textarea
         render (around line 1580-1900), the IrisTableHandle (tableRef,
         batch E), removeRow.
      2. /home/u1/iris-ui/packages/react/src/primitives/table/types.ts +
         props.ts — IrisTableHandle, IrisTableColumn (editable/editor).

      Write a markdown baseline to the output path:
      - proposed iris design (react only, additive):
        a) lazyLoad?: (row: Row, load: (children: Row[]) => void) => void —
           tree mode only: a leaf row WITHOUT children (getSubRows returns
           empty) that HAS a lazyLoad configured renders the expand caret;
           clicking it: marks the key as loading (caret spins / disabled,
           data-iris-tree-loading), calls lazyLoad(row, (children) => stores
           children in an internal lazyChildren Map (rowKey → Row[]) and
           expands the node); flattenTree's getChildren consults the lazy
           map first, then getSubRows; lazy children participate in sorting
           like normal children (withSortedChildren still applies); a loaded
           node's caret toggles collapse/expand normally
        b) IrisTableHandle.removeRows(keys: Array<string | number>) — batch
           remove; prunes the keys from selection; fires onDataChange once;
           no-op keys ignored (core removeRowFromList reuse — consider a core
           helper or compose the existing one per key)
        c) Tab edit navigation — when editing (text/number/select/textarea),
           pressing Tab: preventDefault, commit the current edit, and begin
           editing the NEXT editable column in the same row (columns order;
           stop at the last editable column — no wrap); Shift+Tab goes BACK
           to the previous editable column (stop at the first); no editable
           neighbor → just commit and close (plain behavior)
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-j-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch J (lazy tree + batch delete + Tab
          edit navigation) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-j-baseline.md. Read it first,
          then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; React only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤5 changed files + tests.
          - MANIFEST SCANNER HYGIENE: function-type props on ONE line; inline
            object params use named exported interfaces; export new types
            from index.ts.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: (1) batch delete (light); (2) Tab navigation
            (light); (3) lazy tree (heavy). If low on time, finish 1+2 and
            the lazy-tree render + load path, then tests.

          IMPLEMENT:
          1. IrisTableHandle.removeRows (types.ts + Table.tsx):
             - add `removeRows: (keys: Array<string | number>) => void` to the
               handle interface (types.ts single-line)
             - Table: batch remove via the core helper per key (reuse
               removeRowFromList; compose: iterate keys, skip missing), prune
               selection (rebase + toggle each present key), commitRowList
               once, onDataChange once
          2. Tab edit navigation (Table.tsx):
             - find the editing handlers (input/select/textarea onKeyDown);
               add a shared helper: onTabKey(e, dir) — if e.key === 'Tab':
               preventDefault, commitEdit(), compute the next/prev editable
               column for the CURRENT row (leafColumns order, col.editable),
               beginEdit(row, nextCol, k, idx) if found; note the current edit
               target lives in editCtxRef (row/col/rowIndex) — reuse it
             - wire into the text input, select, and textarea onKeyDown
               (before the Enter/Escape handling is fine)
          3. Lazy tree (props.ts/types.ts + Table.tsx):
             - IrisTableProps: lazyLoad?: (row: Row, load: (children: Row[])
               => void) => void (single line)
             - Table state: lazyChildrenRef = useRef<Map<string, Row[]>>(new
               Map()); lazyLoadingRef = useRef<Set<string>>(new Set()) + a
               tick state to re-render on load/loading transitions (or use
               React state copies — prefer a simple useState for the loading
               set since it drives render)
             - flattenTree getChildren: (r) => lazyChildrenRef.current.get(
               String(rowKeyOf(r))) ?? getSubRows!(r) — lazy children win
             - caret render (tree toggle button): if the row has NO children
               from getSubRows AND lazyLoad is configured AND the key is not
               in lazyChildren — render the caret; onClick: if loading →
               noop; else mark loading (state), call lazyLoad(row,
               (children) => { lazyChildrenRef.current.set(key, children);
               expansion.toggle(key) /* expand it */; clear loading }) —
               match how expansion.toggle is used elsewhere (the model API);
               loading caret shows data-iris-tree-loading and a muted/spin
               style (CSS token-friendly, e.g. opacity + animation via
               --iris-* or a simple emoji-free char)
             - children loaded participate in sorting (withSortedChildren
               wraps getChildren — check it composes)
          4. Tests (new lazy-tree-batch.test.tsx):
             - lazyLoad: a row without children shows the caret; click →
               lazyLoad called with the row; load([...]) resolves → children
               render expanded; caret now toggles collapse; loading state
               prevents double-load
             - removeRows: batch removes several keys, prunes selection,
               fires onDataChange once; missing keys ignored
             - Tab: editing → Tab commits and opens the next editable column;
               Shift+Tab goes back; no neighbor → commits and closes

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          Report: files changed, tests added, counts, unfinished items if any.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-j-adapt.md

