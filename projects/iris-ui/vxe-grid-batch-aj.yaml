            commit -m "feat(table): grid 批 AJ——区域统计 + 查询视图联动（iris 独有闭环）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-aj-gate.md
