      You are preparing the baseline for iris-ui advance 批 3：CLDR 级国际化. Isolated
      worktree: /home/u1/iris-ui/.pi-batch/worktrees/advance (branch
      feat/advance-directions, already contains batches 1-2 commits).
      Monorepo facts (verify before designing):
      - packages/core/src/i18n.ts: DEFAULT_LOCALE = 'en-US'; locale message
        registry + useI18n().t('key') consumer pattern (defaults = English).
      - packages/core/src/locale.ts: existing locale-related material.
      - packages/plugin-locale-zh/src/core/index.ts: zh-CN message pack via
        registerMessages. Only en-US + zh-CN exist today.
      - packages/core/src/date.ts: formatLocalISO (timezone-safe), date
        helpers. No number/currency/plural/relative-time formatters exist.
      - Components consume i18n via useI18n().t() (Pagination/Select/Table…).
      Read i18n.ts, locale.ts, date.ts, plugin-locale-zh core, and 2-3
      consumers (IrisPagination, IrisSelect). Write the baseline to the
      output path: exact additive design for CLDR-level localization, with
      file map + test plan. Design constraints:
      (a) core framework-free pure functions + locale-data registration
      (extend the existing registry idiom — registerMessages today,
      register locale data/formatting packs additively).
      (b) Scope: number (grouping/decimals/sign), currency, date (locale
      patterns, timezone-safe), relative time, plural rules. Wrap
      Intl.NumberFormat/DateTimeFormat/PluralRules with explicit
      fallbacks for limited-ICU environments; never throw on unknown
      locale; document browser ICU variance.
      (c) Deliver zh-CN + en-US locale packs; i18n.ts gains locale-aware
      format helpers (e.g. t() + formatNumber/formatDate/formatRelative
      on the same store), components can consume them without new deps.
      (d) One concrete consumer wiring example (e.g. IrisPagination total
      count with grouping, or Select option count) to prove the path —
      additive prop-free (derive from active locale).
      (e) SSR-safe (Intl available in Node; no DOM/window use).
      Defer: non-Gregorian calendars, timezone pickers, full CLDR data
      generation — document as follow-ups.
      Do NOT modify files; report exact file paths to create/change.
