# iris-ui 的门禁声明
#
# source of truth 是目标仓自己的 AGENTS.md / README / package.json。这里只**调用**
# 目标仓的门禁，绝不在运行器里复制一份。validator 在目标仓的 cwd 下执行。
#
# campaign / pipeline 的 implement 阶段只允许引用 repo-gate：checks/project_gates.py
# 会断言这一点。
#
# 依据：AGENTS.md §质量门（合并前置）：pnpm turbo run test typecheck lint build + coverage + pnpm size + 各 pnpm check:*
# 备注：另有 size / check:manifest / check:parity / check:registry / check:doc-facts
#       等专项与 coverage 阈值。
# 仓库性质：本仓前端是 Vue/TS monorepo（pnpm + turbo）；AGENTS.md:45 另有“core 不出现框架 import”的
#       grep 约定。
project:
  target_repo: "~/workspace/job/iris-ui"

agent:
  bin: pi
  default_timeout: 1800
  default_workers: 1

validators:
  repo-gate:
    cmd: "pnpm turbo run test typecheck lint build"
