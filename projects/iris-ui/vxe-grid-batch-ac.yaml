# iris-ui vxe-grid 批 AC：svelte 适配器功能对齐（核心批）
#
# 目标：svelte 的 IrisTable（.svelte 文件）目前停留在批 1 功能面——对齐
# 核心能力（同 vue/solid 的核心批范围）：
# 1. proxyConfig（服务端数据源——core createRemoteTableSource 薄桥）
# 2. formConfig（搜索表单）
# 3. multiSort（多列排序）
# 4. columnVisibility + filters（列显隐 + 客户端筛选）
# 5. seq / spanMethod（序号列 / 单元格合并）
# 6. toolbar 扩展（buttons / batch / onExport）
# 后续批 AD：svelte 交互（拖拽/行编辑模式/contextMenu/筛选面板/代理方法）。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-ac.yaml \
#   --log-file logs/iris-ui-batch-ac.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch AC (svelte
      adapter parity — core round). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/svelte/src/primitives/table/ — the svelte
         IrisTable (.svelte file + props.ts + types.ts + tableUtils.ts; how
         data/sort/filter/edit are handled today — svelte 5 runes).
      2. /home/u1/iris-ui/packages/core/src/remote-table.ts —
         createRemoteTableSource.
      3. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         react reference semantics (proxyConfig/formConfig/multiSort/
         columnVisibility/filters/seq/spanMethod/toolbar).
      4. /home/u1/iris-ui/packages/svelte/src/primitives/ — available svelte
         primitives (pagination/form-field/select/button).
      5. /home/u1/iris-ui/AGENTS.md — svelte-specific rules (never name a
         $state variable `state`; generics + $state<T>() breaks svelte-check).

      Write a markdown baseline to the output path:
      - svelte table current state (what exists vs react)
      - proposed svelte design (framework-idiomatic — runes, thin bridge
        over core):
        a) proxyConfig — createRemoteTableSource in $effect + onDestroy;
           $state for data/total/loading/error; pager render (svelte
           IrisPagination props?)
        b) formConfig — draft/applied $state; submit merges filters
           (proxy setParams / local); reset
        c) multiSort + multiSortState/onMultiSortChange — header click
           cycles; sequence numbers; ordered comparator
        d) columnVisibility + onColumnVisibilityChange — displayColumns
           $derived filter
        e) filters — substring client-side filtering in the data $derived
        f) seq + seqStartIndex — leading sequence column
        g) spanMethod — occupied-set merge in the body render
        h) toolbar extension: buttons/batch/onExport
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-ac-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch AC (svelte adapter parity — core
          round) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-ac-baseline.md. Read it
          first, then AGENTS.md (svelte rules: $state naming, generics).

          HARD CONSTRAINTS:
          - Core framework-free; svelte bridge only; do NOT touch react/vue/
            solid.
          - Additive props only. No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props; named
            exported interfaces; export new types.
          - CSS uses --iris-* tokens only.
          - SVELTE RULES: never name a $state variable `state`; avoid
            generics + $state<T>() patterns that break svelte-check.
          - TIME BUDGET: (1) columnVisibility + filters + seq (light);
            (2) spanMethod (light); (3) proxyConfig (heavy); (4) multiSort
            (medium); (5) formConfig (medium); (6) toolbar (light). If low,
            finish 1+2+3+6, leave 4/5 for batch AD with a handoff note.

          IMPLEMENT (mirror react reference semantics):
          1. columnVisibility/filters/seq/seqStartIndex — displayColumns
             $derived; substring filter $derived; sequence column
          2. spanMethod — occupied-set merge in the body cells
          3. proxyConfig — createRemoteTableSource + $effect + destroy;
             $state for data/total/loading/error; remote sort/filter/page;
             pager (svelte IrisPagination); edit write-back keeps local
             edits until refetch
          4. multiSort — header click append/cycle/remove; sequence
             numbers; ordered comparator
          5. formConfig — draft/applied; submit → proxy setParams
             ({ filters: merged, page: 1 }) or local; reset re-queries
          6. toolbar extension — buttons/batch/onExport
          7. Tests (new table/parity-ac.test.ts):
             - columnVisibility/filters/seq/spanMethod basics
             - proxyConfig: loading → rows; remote sort; page change;
               autoLoad false
             - multiSort order; formConfig submit/reset; toolbar buttons

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/svelte typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/svelte test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/svelte lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, handoff list for batch
          AD.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ac-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch AC (svelte core
          parity). Read batch-ac-baseline.md and batch-ac-adapt.md, inspect
          against the react reference semantics.

          Check:
          1. columnVisibility: every render path; controlled event
          2. filters: substring semantics; '' ignored
          3. seq/spanMethod: occupied-set correctness
          4. proxyConfig: controller lifecycle; loading/error; remote
             sort/filter/page; pager; edit write-back
          5. multiSort: array semantics; single untouched
          6. formConfig: draft/applied; page reset; reset behavior
          7. toolbar: buttons/batch/export
          8. svelte rules respected ($state naming); core framework-free;
             additive; manifest hygiene; CSS tokens
          Run verification commands (svelte typecheck/test/lint, audit,
          check:manifest). Write verdict markdown: PASS or FAIL with numbered
          findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ac-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch AC (svelte core parity). Read the
          review verdict /home/u1/iris-ui/docs/vxe-grid/batch-ac-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Update /home/u1/iris-ui/docs/vxe-grid-comparison.md: mark batch
            AC rows (svelte: proxyConfig/formConfig/multiSort/列显隐/筛选/
            序号/合并/工具栏扩展) done (svelte) and refresh the gaps list
            (svelte 交互批 AD 下一轮).
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): vxe-grid 批 AC——svelte 适配器功能对齐（核心批）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ac-gate.md
