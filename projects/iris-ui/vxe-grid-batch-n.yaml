          4. highlightHoverRow: false suppresses hover; true default
             unchanged
          5. additive only; manifest hygiene; core framework-free; CSS tokens
          Run verification commands (react test/typecheck/lint, audit). Write
          verdict markdown: PASS or FAIL with numbered findings (severity,
          file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-n-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
