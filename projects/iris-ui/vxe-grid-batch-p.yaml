# iris-ui vxe-grid 批 P：mergeHeaderCells/footerSpanMethod + round/padding + aggregateAccuracy + 表头表尾提示
#
# 目标（对照 vxe tableProps 盘点继续关闭缺口）：
# 1. mergeHeaderCells：表头单元格合并（vxe mergeCells 三件套剩余）
# 2. footerSpanMethod：表尾单元格合并（vxe footerSpanMethod parity）
# 3. round / padding：圆角边框 / 内边距
# 4. aggregateAccuracy：合计精度（summary 数字保留小数位）
# 5. headerTooltipConfig / footerTooltipConfig：表头/表尾悬停提示
# 范围：react only；additive。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-p.yaml \
#   --log-file logs/iris-ui-batch-p.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch P (header
      merge + footer span + round/padding + accuracy + header/footer
      tooltips). Monorepo: /home/u1/iris-ui. Reference:
      /tmp/vxe-ref/package/es/table/src/props.js.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the grouped header render (headerMatrix, cell.colSpan/rowSpan),
         the flat header render, the summary/footerMethod/footerData rows,
         the root container style (borderRadius), BASE_CELL_STYLE padding.
      2. /home/u1/iris-ui/packages/react/src/primitives/table/props.ts +
         types.ts — spanMethod, summary (IrisTableAggregateOp), tooltipConfig,
         bordered/round.
      3. /home/u1/iris-ui/packages/react/src/primitives/table/styles.ts —
         TABLE_ROW_CSS / borderStyle helpers.

      Write a markdown baseline to the output path:
      - proposed iris design (react only, additive):
        a) mergeHeaderCells?: Array<{ row: number; col: number; rowspan?:
           number; colspan?: number }> — applies to the FLAT header (1-row)
           AND the grouped header matrix rows? — vxe mergeHeaderCells
           targets the header cells; for iris: apply to the flat header row
           (grid row 1): cells at (row=0, col) get rowspan/colspan via
           gridColumnEnd/gridRowEnd span (same occupied-skip technique as
           spanMethod: an occupied set over (row, col) keys, skipped cells
           render null); grouped headers: also support (row = headerMatrix
           level, col = leaf index)? keep SIMPLE: flat header only (row
           always 0), document
        b) footerSpanMethod?: (params: { rowIndex: number; columnIndex:
           number; columns: IrisTableColumn<Row>[]; data: Row[] }) =>
           { rowspan?: number; colspan?: number } | null — applies to the
           footerMethod rows AND the summary row (whichever renders): same
           occupied-skip technique as spanMethod but over the footer rows;
           rowIndex counts the footer rows (0-based)
        c) round?: boolean — when bordered && round: root border-radius
           var(--iris-radius-lg); padding?: string — overrides BASE_CELL_STYLE
           padding (cell-level; applied via a CSS var --iris-cell-pad on the
           root so baseCellStyle reads var(--iris-cell-pad, var(--iris-cell-
           pad-y, 8px) 12px))
        d) aggregateAccuracy?: number — summary aggregate results round to
           that many decimals (toFixed(n), strip trailing zeros? keep
           Number(x.toFixed(n)) for numeric; non-numeric untouched)
        e) headerTooltipConfig?: { content?: (column:
           IrisTableColumn<Row>) => string } — header cells get a native
           title when set (same pattern as tooltipConfig); footerTooltipConfig
           same for summary/footerMethod/footerData cells with (column) →
           string
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-p-baseline.md
    mode: serial

