          - Core framework-free; React only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: function-type props on ONE line; inline
            object params use named exported interfaces; export new types
            from index.ts.
          - CSS uses --iris-* tokens only.

          IMPLEMENT:
          1. mergeHeaderCells (props.ts + types.ts + Table.tsx):
             - mergeHeaderCells?: Array<{ row: number; col: number;
               rowspan?: number; colspan?: number }> (single line; named
               interface IrisTableMergeCell exported)
             - flat header: an occupied set of "row:col" keys; cells in the
               merge list get gridColumnEnd span colspan / gridRowEnd span
