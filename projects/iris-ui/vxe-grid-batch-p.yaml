          3. round/padding (props.ts + Table.tsx + styles.ts):
             - round?: boolean — root border-radius:
               var(--iris-radius-lg, 10px) when bordered && round
             - padding?: string — root sets --iris-cell-pad: <padding>;
               BASE_CELL_STYLE padding becomes var(--iris-cell-pad,
               var(--iris-cell-pad-y, 8px) 12px) (size presets still
               override via --iris-cell-pad-y)
          4. aggregateAccuracy (props.ts + Table.tsx):
             - aggregateAccuracy?: number — the summary render of an
               aggregate value: Number(value.toFixed(n)) when the op result
               is a finite number; string results untouched; renderSummary
               still wins when provided
          5. headerTooltipConfig/footerTooltipConfig (props.ts + Table.tsx):
             - headerTooltipConfig?: { content?: (column:
               IrisTableColumn<Row>) => string }; footerTooltipConfig?: {
               content?: (column: IrisTableColumn<Row>) => string } (single
               lines) — native title on header cells / footer cells (summary,
               footerMethod, footerData) when set
          6. Tests (new merge-round-accuracy.test.tsx):
             - mergeHeaderCells: colspan merges adjacent header cells,
               occupied cells skipped; no merge → unchanged
             - footerSpanMethod: colspan on footerMethod rows; occupied
               skip
             - round renders the radius; padding overrides cell padding
