               (document); grouped header: NOT applied (document)
          2. footerSpanMethod (props.ts + Table.tsx):
             - footerSpanMethod?: (params: { rowIndex: number; columnIndex:
               number; columns: IrisTableColumn<Row>[]; data: Row[] }) =>
