      - proposed iris design (react only, additive):
        a) autoResize?: boolean — a ResizeObserver on the ROOT container
           updates a state holding the measured height (and width); when
           height is NOT set but autoResize is on, the table fills the
           container height (height: 100% of the observed height); when
           height IS set, autoResize only keeps the internal scroll height
           in sync (no visible change); also re-measure on window resize
           (ResizeObserver covers it); guard for jsdom (no ResizeObserver →
           no-op)
        b) scrollbarConfig?: { theme?: 'default' | 'thin' } (single line;
           default 'default') — 'thin' renders a slim scrollbar via a
           data-iris-scrollbar-thin attr + CSS (::-webkit-scrollbar width 6px
           + thumb --iris-border / hover --iris-primary; scrollbar-width:
           thin for Firefox); applies to the root scroll container(s)
        c) editDirtyConfig?: { indicator?: boolean; className?: boolean }
           (single line; indicator default true) — when enabled, a cell
           whose value was changed by editing gets data-iris-cell-dirty +
           a small marker dot (::after via CSS using --iris-primary) in the
           cell corner (position absolute, top/right, 6px); the dirty set is
           tracked internally (rowKey:colKey → true) on commit write-back
           and cleared when the value is edited back to the ORIGINAL value
