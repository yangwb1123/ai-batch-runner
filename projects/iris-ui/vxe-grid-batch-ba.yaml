# iris-ui grid 批 BA：数据版本历史（自动快照时间线 + 恢复）
#
# 目标：versionHistory?: { max?: number }——每次数据变更自动快照（环形
# max 默认 20）；工具栏"历史"按钮 → 时间线面板（时间 + 变更类型 → 点击
# 恢复）；handle getVersions/restoreVersion。core createVersionHistory
# 控制器（框架无关）。
# 范围：react only；additive；core 控制器。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-ba.yaml \
#   --log-file logs/iris-ui-batch-ba.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui grid batch BA (version
      history). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         commitRowList (the single mutation channel — where snapshots
         hook), the toolbar render, the handle object, the audit log
         machinery (batch AT — the type hints; the version entries can
         mirror them), the panel patterns (stats/audit panels).
      2. /home/u1/iris-ui/packages/core/src/audit-log.ts — the ring buffer
         pattern (mirror for the version history).

      Write a markdown baseline to the output path:
      - proposed design:
        a) core createVersionHistory<Row>(options?: { max?: number }) —
           push(rows: readonly Row[], meta?: { type: string }): number
           (the version index); list(): Array<{ index: number; timestamp:
           number; type?: string; rows: Row[] }> (newest first);
           get(index): rows; clear(); subscribe; max default 20 (ring);
           tests (ring limit, order, get by index, clear, subscribe)
        b) react versionHistory?: { max?: number } (single line) — when
           enabled: commitRowList pushes a snapshot with the audit type
           hint (reuse the type from batch AT — 'edit'/'insert'/'paste'/
           'batch'/'fill'/'undo'/'redo'); the toolbar renders a history
           button (data-iris-history-trigger, i18n table.history) → panel
           (data-iris-history-panel, like the audit panel): newest-first
           entries (time + type), clicking an entry restores that version
           (rows → commitRowList WITHOUT pushing a new snapshot — a
           suppress flag, document) + closes; Esc/outside closes
        c) handle: getVersions(): Array<{ index; timestamp; type? }>;
           restoreVersion(index): void
        d) i18n table.history (en + zh)
      - file map + tests
      Do NOT modify files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-ba-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui grid batch BA (version history) in
          /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-ba-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; react only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: (1) core + tests (light); (2) react wiring +
            panel + handle (medium). Finish both.

          IMPLEMENT:
          1. core (packages/core/src/version-history.ts NEW + tests):
             - createVersionHistory per the baseline; export from index.ts
             + types; tests
          2. react (props.ts + Table.tsx + i18n):
             - versionHistory?: { max?: number } (single line)
             - controller in a ref (create once with max); commitRowList:
               when enabled, push the PRE-change rows + the audit type hint
               (from the batch AT plumbing — reuse the type); a suppress
               flag for restore commits (a ref — restoreVersion calls
               commitRowList with the flag set)
             - toolbar history button (when enabled) → panel (newest-first:
               formatted time via formatClock + type label); click an entry
               → restore (rows → suppressed commit) + close; Esc/outside
               close
             - handle: getVersions / restoreVersion
             - i18n table.history (en + zh)
          3. Tests (version-history.test.tsx):
             - core: ring/order/get/clear/subscribe
             - react: an edit pushes a version; the panel lists it; restore
               applies the rows without pushing a new version; no prop →
               inert
          4. Docs: iris 独有 section

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/core test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ba-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch BA. Read
          batch-ba-baseline.md and batch-ba-adapt.md, inspect.

          Check:
          1. core: ring limit; newest-first; get by index; clear;
             subscribe
          2. react: snapshot BEFORE each mutation; restore does not push;
             panel entries + restore UX; handle methods; type hints
          3. additive only; manifest hygiene; core framework-free; CSS
             tokens; i18n both languages
          Run verification commands (core test, react test/typecheck/lint,
          audit, check:manifest). Write verdict markdown: PASS or FAIL with
          numbered findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ba-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch BA. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-ba-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): grid 批 BA——数据版本历史（自动快照时间线 + 一键恢复）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ba-gate.md
