# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-ak.yaml \
#   --log-file logs/iris-ui-batch-ak.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui grid batch AK (range paste
      + unique rule). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the clipConfig paste path (batch O: reads clipboard, writes into
         the range anchor onward — currently single-cell-ish), the
         cellRange state (anchor + end coordinates).
      2. /home/u1/iris-ui/packages/core/src/edit-rules.ts — the EditRule
         type + validateEditRules implementation (where to add `unique`).
      3. /home/u1/iris-ui/packages/core/src/table-rows.ts — setCellValue
         (the write-back helper for paste).

      Write a markdown baseline to the output path:
      - proposed design:
        a) range paste (react, additive behavior of the existing
           clipConfig.paste — no new prop): clipboard text rows × cols →
           write from the range anchor (row, col) onward: cell (anchorRow +
           r, anchorCol + c) gets the parsed value; when a range is
           selected, paste fills EXACTLY the selected rectangle (clipboard
           smaller → fill from the top-left, remaining cells unchanged;
           clipboard larger → clipped); rows beyond the table end are
           ignored (document); each cell commit through the existing
           write-back channel (one commitRowList for the whole paste);
           number-like values stay strings (document — same as today)
        b) EditRule gains `unique?: boolean` (single line in the type) —
           validateEditRules: when unique is true, check whether another
           row in the SAME column holds the same value (String comparison;
           the check runs against the data rows — the rule validator needs
           the rows: how does validateEditRules receive context today?
           read edit-rules.ts — the validator signature may need the row
           list; extend the rule context additively); the rule fails with
           the rule's message (or a default '值必须唯一')
           tests: unique passes on first use, fails on duplicate, works
           with other rules, empty string handling (empty values are NOT
           duplicates — document)
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-ak-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui grid batch AK (range paste + unique rule) in
          /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-ak-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; additive only; react for the paste bridge.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props; named
            exported interfaces.
          - TIME BUDGET: (1) unique rule + tests (light); (2) range paste
            + tests (light-medium). Finish both.

          IMPLEMENT:
          1. unique rule (core edit-rules.ts + tests):
             - EditRule.unique?: boolean; validateEditRules gains the data
               context (read the current signature — extend additively: an
               optional `rows` param or a per-rule callback change; keep
               backward compatibility — existing callers must not break)
             - unique check: String compare across the given rows for the
               same column; empty values excluded; failure message = the
               rule's message or a default (i18n? the rule message is
               caller-supplied — default '值必须唯一'? use the English
               default 'Value must be unique' matching the existing message
               style — check the defaults of other rules)
             - tests: first-use pass; duplicate fail; empty values not
               duplicates; combines with required/pattern; rows context
               optional (without rows the rule is skipped — document)
          2. range paste (react Table.tsx + tests):
             - in the paste handler: parse rows × cols; anchor = the range
               start (or the single cell); for r/c within the paste size:
               if the target cell exists in bodyData → setCellValue;
               clip to the table bounds; selected range → fill exactly the
               selected rectangle from its top-left; one commitRowList;
               values stay strings
             - tests: multi-row paste writes the rectangle; selected range
               fills exactly; overflow clipped; onDataChange fired once
          3. Docs: iris 独有 section additions (range paste + unique rule)

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/core test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ak-adapt.md

  - name: review
