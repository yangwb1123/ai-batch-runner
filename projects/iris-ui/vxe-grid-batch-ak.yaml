# iris-ui grid 批 AK：范围粘贴增强 + unique 唯一性校验规则（编辑闭环）
#
# 目标：
# 1. 范围粘贴：clipConfig paste 从"单格写入"增强为"矩形范围写入"——
#    粘贴多行多列从锚点开始覆盖（选中范围时精确覆盖；越界忽略文档化）
# 2. editRules unique 内置规则：core validateEditRules 新增 unique 选项
#    （跨行同列重复值检查，提交时拒绝）——四框架共享（core 规则引擎）
# 范围：core（unique 规则）+ react（范围粘贴 + unique 透传）；additive。
