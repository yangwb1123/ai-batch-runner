          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤3 changed files + tests; props.ts at
            474/500 — move new types to types.ts if needed.
          - MANIFEST SCANNER HYGIENE: single-line function props; export new
