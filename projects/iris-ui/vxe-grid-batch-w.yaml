      2. /home/u1/iris-ui/packages/react/src/primitives/table/exportCsv.ts
         + exportExcel.ts — the current export API (rows + columns → string/
         file).
      3. /home/u1/iris-ui/packages/react/src/primitives/table/props.ts +
         types.ts — IrisTableHandle shape.

