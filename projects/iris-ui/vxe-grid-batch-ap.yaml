# iris-ui grid 批 AP：选择摘要条 + 导出选中行（选择闭环）
#
# 目标：
# 1. 选择摘要条：selectable multi 且有选择时，工具栏显示
#    "已选 N 行 · 合计 X"（数字列合计——复用 aggregate 材料）+ 清空选择
# 2. 导出选中：handle.exportSelectionCsv()——选中行导出（与
#    exportCurrentViewCsv 同管线）
# 范围：react only；additive；core 复用。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-ap.yaml \
#   --log-file logs/iris-ui-batch-ap.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui grid batch AP (selection
      summary + export selection). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the selection state (displaySelection), the toolbar render (batch
         button area), the aggregate material (summary op computation —
         where the summary row computes sum), the handle methods
         (exportCurrentViewCsv / clearSelection), the i18n usage.
      2. /home/u1/iris-ui/packages/core/src/ — aggregate helper (the
         summary op — reuse for the selection sum).

      Write a markdown baseline to the output path:
      - proposed design:
        a) selection summary: when selectable === 'multi' && displaySelection
           length > 0, the toolbar renders (before the batch button):
           "已选 N 行"（i18n table.selectionSummary）— and when any leaf
           column has `summary: 'sum'`（or a numeric column? pick: columns
           with summary sum — the SAME columns the summary row sums）:
           "· 合计 X"（each sum column's total over the selected rows,
           formatted like the summary row）; a clear button
           (data-iris-selection-clear, i18n) → clearSelection; no new props
           needed (document) — OR a prop selectionSummary?: boolean to gate
           it? pick additive gating: `selectionSummary?: boolean` (default
           false — document why: avoids surprise UI)
        b) handle.exportSelectionCsv(): string — exportCsv over the
           selected rows (displaySelection → rows in bodyData order) with
           displayColumns; empty selection → '' (document)
      - file map + tests
      Do NOT modify files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-ap-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui grid batch AP (selection summary + export
          selection) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-ap-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; react only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤4 changed files + tests.
          - MANIFEST SCANNER HYGIENE: single-line function props.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: light — finish both.

          IMPLEMENT:
          1. selection summary (props.ts + Table.tsx + i18n):
             - selectionSummary?: boolean (single line)
             - when enabled && multi && selection non-empty: toolbar shows
               (data-iris-selection-summary) "已选 N 行" + for each leaf
               column with summary: 'sum': "· 合计 {value}"（sum over the
               selected rows — reuse the same computation the summary row
               uses; format like the summary cell）; a clear button
               (data-iris-selection-clear) → handle clearSelection
             - i18n table.selectionSummary {count} (en + zh)
             - tests: summary shows with selection, hides without; sum
               correct; clear button clears
          2. export selection (types.ts + Table.tsx):
             - IrisTableHandle.exportSelectionCsv(): string (single line)
             - impl: selected rows in bodyData order → exportCsv with
               displayColumns; empty → ''
             - tests: selection → csv of the selected rows; empty selection
               → ''
          3. Docs: iris 独有 section

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
            (regenerate + commit — ALWAYS)
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ap-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch AP. Read
          batch-ap-baseline.md and batch-ap-adapt.md, inspect.

          Check:
          1. selection summary: gated by the prop; count text; sum over
             selected rows matches the summary-row computation; clear
             button; hidden without selection
          2. export selection: selected rows in bodyData order; hidden
             columns excluded; empty selection ''
          3. additive only; manifest hygiene; core framework-free; CSS
             tokens; i18n both languages
          Run verification commands (react test/typecheck/lint, audit,
          check:manifest). Write verdict markdown: PASS or FAIL with numbered
          findings (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ap-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch AP. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-ap-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): grid 批 AP——选择摘要条 + 导出选中行（选择闭环）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-ap-gate.md
