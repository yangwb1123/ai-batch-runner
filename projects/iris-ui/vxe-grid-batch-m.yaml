# iris-ui vxe-grid 批 M：分组统计行 + 批量工具栏 + 列宽自适应
#
# 目标（推进到功能面全覆盖的收尾方向）：
# 1. 分组统计（vxe grouping parity 简化版）：组内小计行——列 groupBy +
#    组标题行（合并列显示分组值），组内数据 + 可选 summary 小计
# 2. 批量工具栏（vxe toolbar 选中联动）：选择 > 0 时工具栏显示批量操作
#    按钮（如批量删除），与 handle.removeRows 组合
# 3. 列宽自适应（vxe column width auto 简化）：列 width: 'auto' → 按内容
#    最大宽度渲染（max-content），不参与 1fr 均分
# 范围：react only；additive。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-m.yaml \
#   --log-file logs/iris-ui-batch-m.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch M (group
      summary rows + batch toolbar + auto column width). Monorepo:
      /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         bodyData / filteredData pipeline, the row render, the toolbar
         render block, gridTemplateColumns computation.
      2. /home/u1/iris-ui/packages/react/src/primitives/table/props.ts +
         types.ts — toolbar, summary, IrisTableHandle.removeRows, width.
      3. /home/u1/iris-ui/packages/react/src/primitives/table/TableBody.tsx /
         TableRow.tsx if they exist — where rows are composed.

      Write a markdown baseline to the output path:
      - proposed iris design (react only, additive):
        a) column `groupBy?: boolean` (single line) — when set, the table
           groups bodyData by that column's raw value (stable order of first
           appearance); each group renders: a group header row
           (data-iris-group-row, spanning all columns, showing the group
           value, muted bg, --iris-* tokens) followed by its rows; if any
           group column also has `summary`, a group footer row
           (data-iris-group-summary) with the same aggregate ops as the
           global summary, computed per group; one group column only (first
           groupBy column wins; document)
           interplay: sorting/filtering happen BEFORE grouping (group on
           filteredData order); proxy mode: grouping is client-side over the
           loaded page (document)
        b) toolbar gains `batch?: { label: string; onClick: (keys:
           Array<string | number>) => void; icon?: string }` (single line) —
           when selectable is multi and displaySelection has ≥1 key, the
           toolbar renders the batch button (data-iris-table-toolbar-batch)
           after the built-ins (primary color, --iris-* tokens); onClick
           receives the current selected keys
        c) column width 'auto': in gridTemplateColumns, a column with
           width === 'auto' gets `minmax(max-content, max-content)` instead
           of the 1fr fallback; resolvedColWidths (pinned offsets / column
           virtualization) treat 'auto' as a default pixel width
           (DEFAULT_PINNED_WIDTH) — document the limitation
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-m-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch M (group summary + batch toolbar +
          auto width) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-m-baseline.md. Read it first,
          then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; React only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤5 changed files + tests.
          - MANIFEST SCANNER HYGIENE: function-type props on ONE line; export
            new types from index.ts.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: (1) auto width (light); (2) batch toolbar (light);
            (3) group rows (heavy). If low on time, finish 1+2 + the group
            row render, then tests.

          IMPLEMENT:
          1. auto width (Table.tsx):
             - gridTemplateColumns: width === 'auto' → 'minmax(max-content,
               max-content)' (before the string-width branch)
             - resolvedColWidths: 'auto' falls back to DEFAULT_PINNED_WIDTH
               (same as other non-numeric widths) — verify the existing
               branch handles it or add it
          2. batch toolbar (props.ts + Table.tsx):
             - toolbar.batch?: { label: string; onClick: (keys:
               Array<string | number>) => void; icon?: string } (single
               line in the toolbar type)
             - render after the built-ins when selectable === 'multi' &&
               displaySelection.length > 0: button
               data-iris-table-toolbar-batch with the label; onClick →
               toolbar.batch.onClick([...displaySelection])
          3. group rows (types.ts + Table.tsx):
             - IrisTableColumn.groupBy?: boolean (single line)
             - compute groups: useMemo over bodyData (flat mode only; tree
               mode groups are NOT applied — document); group key = String(
               getCellValue(row, groupCol)); order = first appearance
             - render: for each group, a group header row
               (data-iris-group-row) with a cell spanning all grid columns
               (gridColumn 1 / -1) showing the group value (String) +
               count (e.g. `Role: Develop (12)` — or just the value;
               document); then the group's rows (existing row render path —
               the rows currently map over bodyData directly; you will need
               to change the body row map to iterate the grouped structure);
               then a group summary row when the group column (or any
               column) has summary — reuse the aggregate material (find how
               the global summary computes values and reuse it per group;
               keep it simple: same ops as the global summary row, computed
               over the group's rows)
             - keep selection/tree/expansion untouched (grouping applies
               after filtering; selection keys still work)
          4. Tests (new group-batch-autowidth.test.tsx):
             - auto width: 'auto' column renders max-content template
             - batch button: appears with selection, hides without; onClick
               receives the keys
             - groups: group header rows render the value; rows grouped
               under them; group summary computes per group (e.g. count or
               sum of a numeric column with summary: 'sum'); no groupBy →
               unchanged

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          Report: files changed, tests added, counts, unfinished items.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-m-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch M (group rows +
          batch toolbar + auto width). Read batch-m-baseline.md and
          batch-m-adapt.md, inspect the implementation.

          Check:
          1. groups: header rows render the group value; rows grouped;
             summary per group (ops match the global summary); empty groups
             skipped; tree mode untouched; sorting/filtering before grouping;
             selection works on grouped rows
          2. batch button: only with multi selection; keys passed; hides
             when empty; built-ins unaffected
          3. auto width: template string correct; pinned/virtual fallback;
             other widths unchanged
          4. additive only; manifest hygiene; core framework-free; CSS tokens
          Run verification commands (react test/typecheck/lint, audit). Write
          verdict markdown: PASS or FAIL with numbered findings (severity,
          file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-m-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch M. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-m-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
          - Update /home/u1/iris-ui/docs/vxe-grid-comparison.md: mark batch M
            rows (group summary / batch toolbar / auto width) done (react).
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): vxe-grid 批 M——分组统计行/批量工具栏/列宽自适应（react only）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-m-gate.md
