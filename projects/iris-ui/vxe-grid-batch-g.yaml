# iris-ui vxe-grid 批 G：3 个 LOW 修复 + tooltipConfig + checkbox 范围选择
#
# 目标：
# 1. 修复批 F review 的 3 个 LOW（selectAll union、expandAll seed 时机、
#    tree 模式 multi 比较器）
# 2. tooltipConfig：单元格内容悬停提示（vxe tooltip-config parity）
# 3. checkbox 范围选择：shift+点击批量勾选中间行（vxe checkbox-config.range）
# 范围：react only；additive。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-g.yaml \
#   --log-file logs/iris-ui-batch-g.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch G (3 LOW
      fixes + tooltipConfig + checkbox range). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/docs/vxe-grid/batch-f-review.md — the 3 LOW
         findings (F1 selectAll union at Table.tsx ~886, F2 expandAll seed
         burn ~967, F3 tree multi comparator ~929).
      2. /tmp/vxe-grid/package/types/components/table.d.ts — tooltip-config
         (TooltipConfig: showAll/contentMethod/theme) and checkbox-config
         (range: boolean, rangeMethod).
      3. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the cell render (showOverflow/ellipsis cells), selection checkbox
         row render + toggleRow, expandAll seeding, multi comparator usage.
      4. /home/u1/iris-ui/packages/react/src/primitives/table/types.ts +
         props.ts — current props.

      Write a markdown baseline to the output path:
      - vxe semantics: tooltip-config (hover shows full cell content when
        truncated / showAll), checkbox-config.range (shift-click checks the
        range between two clicks; respects checkMethod)
      - proposed iris design (react only, additive):
        a) 3 LOW fixes exactly as the review prescribes
        b) tooltipConfig?: { showAll?: boolean; content?: (row: Row,
           column: IrisTableColumn<Row>) => string } — when set, cells render
           a native `title` attribute (lightweight; no per-cell portal) —
           content from the callback or the raw value; showAll forces it on
           every cell, default only when the cell content differs from the
           truncated text (always on for simplicity is acceptable — document
           it)
        c) checkbox range: when selectable === 'multi', shift-clicking a row
           checkbox checks all rows between the last clicked key and this key
           in bodyData order (respects checkMethod, skips disabled rows);
           record the anchor key in a ref; normal clicks still toggle single
           rows and update the anchor
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-g-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch G (3 LOW fixes + tooltipConfig +
          checkbox range) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-g-baseline.md. Read it first,
          then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; React only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; ≤5 changed files + tests.
          - MANIFEST SCANNER HYGIENE: function-type props on ONE line; inline
            object params use named exported interfaces; export new types
            from packages/react/src/primitives/table/index.ts.
          - CSS uses --iris-* tokens only.

          IMPLEMENT:
          1. LOW fixes (Table.tsx):
             - F1 selectAll (handle method): union with the existing
               selection instead of replacing (respect checkMethod like
               toggleAll)
             - F2 expandAll seed: only burn the one-shot ref when the seeded
               keys are non-empty (so a later proxy page with parents can
               still seed)
             - F3 tree multi comparator: use the multi comparator for tree
               children when multiSort is on (find where tree children get
               sorted — withSortedChildren or the tree flatten — and pass the
               multi comparator)
          2. props.ts/types.ts:
             - tooltipConfig?: { showAll?: boolean; content?: (row: Row,
               column: IrisTableColumn<Row>) => string }
             Export from index.ts.
          3. Table.tsx tooltipConfig:
             - cell divs get `title` when tooltipConfig is set: content from
               the callback or String(raw); showAll false → only when the
               cell text is truncated is hard to detect cheaply — document
               that showAll defaults the title on every cell (acceptable;
               keep it simple and explicit)
          4. Table.tsx checkbox range:
             - anchorRef (last checked row key); row checkbox onClick:
               shiftKey && anchor → toggle ALL rows between anchor index and
               this row index in bodyData (respect checkMethod — skip
               disabled); always update the anchor (even without shift)
             - selection updates go through the model's toggle for each key
               (batch in one rebaseToProp + toggles)
             - header select-all resets the anchor
          5. Tests:
             - extend/multi-sort or new range-tooltip.test.tsx:
               - selectAll unions (existing selection kept + checkMethod
                 respected)
               - expandAll seeds only when children exist (proxy first page
                 without parents → later page seeds)
               - tree multiSort sorts children
               - tooltipConfig renders title on cells (content callback +
                 raw value + showAll off/on)
               - shift-click range checks rows between anchors (disabled rows
                 skipped); normal click updates anchor

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          Report: files changed, tests added, counts, deviations.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-g-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch G (3 LOW fixes +
          tooltipConfig + checkbox range). Read batch-g-baseline.md and
          batch-g-adapt.md, inspect the implementation (Table.tsx,
          props.ts/types.ts, tests).

          Check:
          1. F1: selectAll unions and respects checkMethod; header toggleAll
             unchanged
          2. F2: expandAll seed survives an empty first page; later pages
             with children seed; no double-expand after
          3. F3: tree children sort with the multi comparator; single mode
             tree sorting unchanged
          4. tooltipConfig: title on cells (callback + raw), showAll
             semantics documented, no portal/per-cell cost, additive
          5. checkbox range: shift-click range respects bodyData order +
             checkMethod; anchor updates on every click; header select-all
             resets anchor; range works across pages? (document if not)
          6. additive only; manifest hygiene; core framework-free; CSS tokens
          Run verification commands (react test/typecheck/lint, audit). Write
          verdict markdown: PASS or FAIL with numbered findings (severity,
          file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-g-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch G. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-g-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
          - Update /home/u1/iris-ui/docs/vxe-grid-comparison.md: mark batch G
            rows (tooltip-config / checkbox range) done (react).
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): vxe-grid 批 G——tooltipConfig/checkbox 范围选择 + 批 F 遗留修复（react only）"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-g-gate.md
