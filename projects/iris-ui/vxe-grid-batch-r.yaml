         types.ts — rowKey, footerMethod, footerSpanMethod (batch P).

      Write a markdown baseline to the output path:
      - proposed iris design (react only, additive):
        a) zIndex?: number — applied to the root container style (zIndex)
        b) syncResize?: boolean — when autoResize is off but syncResize on:
           re-measure on state changes (data length / loading / error /
           visibility change — a compact effect that re-runs the measure
           function used by autoResize; if autoResize is on it is redundant
           and ignored)
        c) keepSource?: boolean — DOCUMENTATION-ONLY flag: the table already
           never mutates the input data (immutable updates everywhere); when
           true we also guarantee it by copying at the liveData seed (data →
           [...data] once at mount, so external mutations to the original
           array never leak in); default false (current behavior)
        d) rowId?: (row: Row, rowIndex: number) => string | number — used as
           the row key fallback BEFORE the index fallback (rowKeyOf order:
           row[rowKey] ?? rowId?.(row, idx) ?? idx); affects selection/
           editing/expansion keys
        e) mergeFooterItems?: Array<{ row: number; col: number; rowspan?:
           number; colspan?: number }> — config-form footer merge over the
           footer row stack (summary/footerMethod/footerData), same
           occupied-skip as footerSpanMethod; when BOTH footerSpanMethod and
           mergeFooterItems exist, the function wins (document)
      - file map + tests
      Do NOT modify source files.
