# iris-ui vxe-grid 批 R：收尾小项——zIndex/syncResize/keepSource/rowId/mergeFooterItems
#
# 目标（vxe tableProps 盘点最后一批小缺口）：
# 1. zIndex：表格 z-index 配置
# 2. syncResize：状态属性变化时自动同步尺寸（与 autoResize 组合）
# 3. keepSource：保留原始数据（排序/筛选不改源数组——当前已不可变，提供
#    显式开关文档化）
# 4. rowId：行 id 生成函数（rowKey 缺失时的回退）
# 5. mergeFooterItems：配置式表尾合并（vxe mergeFooterItems parity）
# 范围：react only；additive。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-r.yaml \
#   --log-file logs/iris-ui-batch-r.log --retries 2

