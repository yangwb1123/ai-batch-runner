          IMPLEMENT:
          1. zIndex (props.ts + Table.tsx): zIndex?: number — root style
             zIndex when set
          2. syncResize (props.ts + Table.tsx): syncResize?: boolean — when
             true && !autoResize, an effect keyed on [data, loading, error,
