# iris-ui vxe-grid 批 F：multiSort 多列排序 + validConfig + 选择方法 + expandAll
#
# 目标：IrisTable 补齐 vxe-grid 多列排序（sortConfig.multiple）、编辑校验
# 消息开关（validConfig）、选择方法（clearSelection/selectAll/toggleRowSelection）、
# 树形默认全展开（expandAll）。范围：react only；additive。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-f.yaml \
#   --log-file logs/iris-ui-batch-f.log --retries 2
# 注意：adapt 是重活，900s 可能不够——把实现拆成尽量小的明确改动，
# 先 core+类型+测试，再 Table.tsx 桥接；若超时，留下已完成部分由维护者收尾。

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch F (multiSort +
      validConfig + selection methods + expandAll). Monorepo: /home/u1/iris-ui.

      Read:
      1. /tmp/vxe-grid/package/types/components/table.d.ts — SortConfig
         (multiple/chronological/remote, line ~1282), ValidConfig (~3642),
         and the grid methods list for selection methods
         (clearSelection/selectAll/toggleRowSelection).
      2. /home/u1/iris-ui/packages/react/src/primitives/table/useTableSort.ts —
         current single-column sort (IrisTableSortState, cycleSort, sorter).
      3. /home/u1/iris-ui/packages/react/src/primitives/table/Table.tsx —
         the sort header click path, the proxy query params (sort), and the
         IrisTableHandle (tableRef) from batch E.
      4. /home/u1/iris-ui/packages/react/src/primitives/table/types.ts +
         props.ts — IrisTableSortState, IrisTableHandle.

      Write a markdown baseline to the output path:
      - vxe semantics: sortConfig.multiple (multi-column sorts with sequence
        numbers, click cycles asc→desc→clear, chronological order), remote
        multi-sort, validConfig.showMessage (edit-rule error message display
        toggle), selection methods, expand-all
      - proposed iris design (react only, additive):
        a) multiSort?: boolean — when on: sort state is an ORDERED ARRAY
           (reuse IrisTableSortState as the item type); props
           multiSortState?: IrisTableSortState[] (controlled) +
           onMultiSortChange?; header click: new column appends, existing
           column cycles asc→desc→removed; the header shows a small sequence
           number (1-based) on non-primary sort columns; comparator compares
           columns in array order (stable); proxy mode: query params gets
           `sorts?: IrisTableSortState[]` (additive field; `sort` stays for
           single-column mode); useTableSort extended with a multi mode
           (keep single mode untouched — no breaking changes)
        b) validConfig?: { showMessage?: boolean } (default true) — when
           false, edit-rule errors still BLOCK the commit but the inline
           error message element is not rendered (cell keeps aria-invalid)
        c) IrisTableHandle additions (additive methods):
           clearSelection(): void; selectAll(): void (multi mode, respects
           checkMethod); toggleRowSelection(key: string | number): void
        d) expandAll?: boolean — tree mode (getSubRows): initial expansion of
           ALL rows (only applies to the initial expansion state; changing the
           prop later does not re-expand)
      - file map: useTableSort.ts (multi mode), types.ts/props.ts (new props),
        Table.tsx (header sort UI + handle methods + validConfig render +
        expandAll seed), tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-f-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch F (multiSort + validConfig +
          selection methods + expandAll) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-f-baseline.md. Read it first,
          then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; React only; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; keep the total changed-file count low.
          - MANIFEST SCANNER HYGIENE: function-type props on ONE line; inline
            object params use named exported interfaces; export new types
            from packages/react/src/primitives/table/index.ts.
          - CSS uses --iris-* tokens only.
          - TIME BUDGET: this is a heavy task. Order of work: (1) types +
            useTableSort multi mode + its tests; (2) Table.tsx bridge
            (header UI, handle methods, validConfig, expandAll); (3) table
            integration tests. If you run low on time, finish (1)+(2) and
            write at least the multiSort integration test.

          IMPLEMENT:
          1. types.ts/props.ts:
             - multiSort?: boolean (additive)
             - multiSortState?: IrisTableSortState[] (controlled) +
               onMultiSortChange?: (next: IrisTableSortState[]) => void
             - validConfig?: { showMessage?: boolean }
             - expandAll?: boolean
             - IrisTableHandle additions: clearSelection(), selectAll(),
               toggleRowSelection(key: string | number)
             - IrisTableProxyQueryParams: add optional `sorts?:
               IrisTableSortState[]` (multiSort mode passes it; `sort` stays
               single-column)
             Export new types from index.ts.
          2. useTableSort.ts — add a MULTI mode WITHOUT changing single mode:
             - options: multiSort?: boolean; multiSortState?: IrisTableSortState[];
               defaultMultiSort?: IrisTableSortState[]; onMultiSortChange?
             - multi cycle: clicking a column not in the array appends
               { key, direction: 'asc' }; clicking an existing column cycles
               asc → desc → remove from array; array order = click order
             - comparator: iterate the array; first non-zero comparison wins
               (stable)
             - sortedData uses the multi comparator when multiSort is on
             - expose: multiSortState (controlled or internal), cycleMultiSort(col)
             Keep the single-column API byte-compatible.
          3. Table.tsx:
             - sortable header click: multiSort ? cycleMultiSort : cycleSort
             - header: when multiSort is on and the column has a sort index
               > 0, render the sequence number next to the direction icon
               (data-iris-sort-seq, small muted number)
             - proxy query: pass `sorts` (multi) or `sort` (single) — the
               controller params merge; check how the sort reaches query and
               extend it additively
             - validConfig.showMessage === false: still run editRules
               validation and block the commit, but skip rendering the
               `data-iris-table-editor-error` message element (keep
               aria-invalid)
             - handle methods: clearSelection → selModel clear (all rows);
               selectAll → same as toggleAll(true) respecting checkMethod;
               toggleRowSelection(key) → toggle a single key (guard
               checkMethod? no — direct toggle, vxe toggleRowSelection bypasses
               checkMethod)
             - expandAll: seed the expansion model with all tree keys when
               true (initial only; look at how defaultExpandedRowKeys seeds
               expansion and add expandAll alongside)
          4. Tests:
             - useTableSort.test.ts additions: multi append/cycle/remove,
               comparator precedence, controlled mode
             - table test (new file multi-sort.test.tsx): header click order
               + sequence number render, multi comparator order, proxy sorts
               param, validConfig hides message but blocks, handle
               clearSelection/selectAll/toggleRowSelection, expandAll seeds
               tree expansion

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/core test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react typecheck`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          Report: files changed, tests added, counts, what is left unfinished
          if any.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-f-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch F (multiSort +
          validConfig + selection methods + expandAll). Read batch-f-baseline.md
          and batch-f-adapt.md, inspect the implementation (useTableSort.ts,
          Table.tsx, props.ts/types.ts, tests).

          Check:
          1. multi mode never breaks single mode (no behavior change when
             multiSort is off)
          2. multi cycle: append asc → cycle desc → remove on third click;
             array order = click order; sequence numbers render correctly
          3. comparator precedence (first column wins, tie → second) and
             stability
          4. proxy: sorts param passed in multi mode; single mode still sends
             `sort`
          5. validConfig.showMessage=false: commit blocked but message hidden;
             aria-invalid retained
          6. handle: clearSelection/selectAll/toggleRowSelection work and
             coexist with checkMethod (selectAll respects it)
          7. expandAll seeds initial expansion only; later prop changes do not
             re-expand
          8. additive only; manifest hygiene; core framework-free; CSS tokens
          Run verification commands (core test, react test/typecheck/lint,
          audit). Write verdict markdown: PASS or FAIL with numbered findings
          (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-f-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch F. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-f-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm gen:manifest`
          - Update /home/u1/iris-ui/docs/vxe-grid-comparison.md: mark the
            batch F rows (multiSort / validConfig / selection methods /
            expandAll) as done (react).
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): vxe-grid 批 F——multiSort/validConfig/选择方法/expandAll（react only）"`
            (split commits if budget blocks).
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-f-gate.md
