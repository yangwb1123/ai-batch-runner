#    浮层 checkbox 面板）
# 范围：vue only；additive；core 复用（createRemoteTableSource 已有）。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-z.yaml \
#   --log-file logs/iris-ui-batch-z.log --retries 2

