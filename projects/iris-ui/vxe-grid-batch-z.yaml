# iris-ui vxe-grid 批 Z：vue 适配器功能对齐第三批（交互深水区）
#
# 目标：vue 对齐收官批——
# 1. 行编辑模式（editConfig.mode='row'：整行编辑，所有可编辑列同时打开）
# 2. 树形懒加载（lazyLoad：展开无子行时异步加载注入）
# 3. contextMenu（右键浮层菜单：虚拟锚点 + useFloating——vue 有 floating
#    模块？检查 vue useFloating 是否存在——存在则桥接，否则自绘 fixed）
