# iris-ui vxe-grid 批 AF：四框架 example E2E + 跨框架视觉 parity + 导出增强
#
# 目标（功能面已全——收尾验证 + 增强）：
# 1. 四框架 example E2E：react 已有 3 个 VxeGrid 测试——为 vue/solid/
#    svelte 的 VxeGridExamplePage 各加 E2E 冒烟断言（渲染 4 区 + 核心交互）
# 2. 跨框架视觉 parity：把 example 页纳入各 app 的 visual-parity 流程
#    （若框架支持）——至少 vue 的 visual-parity.spec.ts 已存在，扩展路由
# 3. 导出 Excel 增强：exportExcel 支持表头样式（加粗）+ 可选列宽（vxe
#    export-config 样式 parity 简化版——XML 样式：bold header + width）
# 范围：react（导出增强）+ 四框架 e2e。
#
# 执行：python pi-batch.py projects/iris-ui/vxe-grid-batch-af.yaml \
#   --log-file logs/iris-ui-batch-af.log --retries 2

git_commit: false
decision_log: /home/u1/iris-ui/docs/vxe-grid/DECISIONS.md

stages:
  - name: baseline
    from_prompt: |
      You are preparing the baseline for iris-ui vxe-grid batch AF (example
      E2E + visual parity + Excel export styling). Monorepo: /home/u1/iris-ui.

      Read:
      1. /home/u1/iris-ui/apps/cms-react/e2e/pages.spec.ts — the 3 existing
         VxeGrid tests (login flow, sections, proxy + form interactions).
      2. /home/u1/iris-ui/apps/cms/e2e/ (vue), apps/cms-solid/e2e/,
         apps/cms-svelte/e2e/ — their e2e setup (smoke.spec.ts login flow,
         visual-parity.spec.ts and its PARITY_FRAMEWORK env + snapshot
         approach; note: visual parity may compare across frameworks from
         the react runner — read apps/cms-react/e2e/visual-parity.spec.ts
         to see how it drives the other frameworks).
      3. /home/u1/iris-ui/packages/react/src/primitives/table/exportExcel.ts
         — the current SpreadsheetML exporter.
      4. /home/u1/iris-ui/packages/core/src/table-export.ts —
         toSpreadsheetXml options (column widths? styles?).

      Write a markdown baseline to the output path:
      - e2e plan per framework app: the login flow (each app's smoke
        pattern), the VxeGrid example route/menu, assertions (4 sections
        render; proxy section loads rows; form search filters) — mirror the
        react tests
      - visual-parity plan: how the existing cross-framework visual parity
        runner works (does it snapshot users page? can the vxe example page
        be added? read the spec) — propose the minimal addition
      - export Excel styling: toSpreadsheetXml current capability; the
        proposed option: bold header row (cell style with font-weight bold
        via the XML styles table) + per-column width; additive option param
      - file map + tests
      Do NOT modify source files.
    output: /home/u1/iris-ui/docs/vxe-grid/batch-af-baseline.md
    mode: serial

  - name: adapt
    from_outputs: baseline
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Implement iris-ui vxe-grid batch AF (example E2E + visual parity +
          Excel styling) in /home/u1/iris-ui, per
          /home/u1/iris-ui/docs/vxe-grid/batch-af-baseline.md. Read it
          first, then AGENTS.md.

          HARD CONSTRAINTS:
          - Core framework-free; additive only.
          - No dist/tgz/node_modules/manifest.json edits.
          - Test files ≤500 lines; e2e spec files are exempt from the 500
            line cap but keep them tight.
          - CSS uses --iris-* tokens only (e2e doesn't add CSS).
          - TIME BUDGET: (1) Excel styling (light); (2) e2e specs for the
            three apps (medium — mostly mirroring); (3) visual parity
            extension (light if the runner supports it). If low, finish 1+2.

          IMPLEMENT:
          1. Excel styling (core table-export.ts + react exportExcel.ts +
             tests):
             - toSpreadsheetXml: add an option { headerStyle?: boolean;
               columnWidths?: Array<number> } — headerStyle writes a bold
               font style (XML styles: Font with bold val=1) applied to the
               header cells; columnWidths writes <Col> widths; the react
               exportExcel passes through the options
             - core tests for the XML output (contains bold style + col
               widths); react exportExcel test update if any
          2. e2e specs (apps/cms/e2e/, apps/cms-solid/e2e/,
             apps/cms-svelte/e2e/):
             - each app: a vxe-example.spec.ts mirroring the react tests:
               login (use each app's smoke login flow), goto the vxe example
               route/menu (check the menu key each app registered — from
               batch AE the pages exist; find their route keys), assert the
               4 sections render, the proxy section loads rows (wait for a
               Test1 row), the form search filters (fill name → submit →
               rows reduced)
             - do NOT run them here (the playwright webServer for these apps
               is unreliable locally) — write them so CI can run them; run
               only the react one to confirm the pattern still passes
          3. visual parity: if the existing runner can include the example
             page cheaply (a route list), add the route; otherwise document
             why not and skip (report the decision)

          VERIFY:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm --filter @iris-ui-kit/core test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react typecheck && ... test`
          - `env COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm --filter
            @iris-ui-kit/react lint` (0 errors)
          - `python /home/u1/ai-batch-runner/projects/iris-ui/scripts/iris-ui-spec.py
            --mode all --json` → 0 violations
          Report: files changed, tests added, counts, what is left.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-af-adapt.md

  - name: review
    from_outputs: adapt
    mode: serial
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          You are the adversarial reviewer for iris-ui batch AF. Read
          batch-af-baseline.md and batch-af-adapt.md, inspect.

          Check:
          1. Excel styling: XML well-formed (styles table + cols + header
             font); default output unchanged when options omitted; react
             passthrough
          2. e2e specs: mirror the react flows; correct per-app login/route;
             deterministic assertions (no flaky waits beyond the proxy
             delay)
          3. visual parity decision documented
          4. core framework-free; additive; manifest hygiene
          Run verification commands (core test, react test/typecheck/lint,
          audit). Write verdict markdown: PASS or FAIL with numbered findings
          (severity, file:line, fix). Do NOT modify files.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-af-review.md

  - name: gate
    from_outputs: review
    mode: serial
    validate: |
      python {tool_root}/projects/iris-ui/scripts/iris-ui-spec.py --mode all --json
    tasks:
      - cwd: /home/u1/iris-ui
        prompt: |
          Gate stage for iris-ui batch AF. Read the review verdict
          /home/u1/iris-ui/docs/vxe-grid/batch-af-review.md.

          If PASS: run the full repo gate:
          - `cd /home/u1/iris-ui && env COREPACK_ENABLE_PROJECT_SPEC=0
            corepack pnpm turbo run test typecheck lint build --concurrency=2`
          - audit → 0; gen:manifest + check:manifest
          - Update /home/u1/iris-ui/docs/vxe-grid-comparison.md: mark batch
            AF rows (example E2E 四框架 / 导出样式) done.
          - Commit: `git add -A -- . ':!apps/ssr-solidstart/.vinxi' && git
            commit -m "feat(table): vxe-grid 批 AF——四框架 example E2E + 导出 Excel 样式"`
          Report commit hash and final test counts.

          If FAIL with concrete fixes: apply fixes, rerun, full gate, commit.
        output: /home/u1/iris-ui/docs/vxe-grid/batch-af-gate.md
