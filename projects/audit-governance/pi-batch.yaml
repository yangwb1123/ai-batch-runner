# audit-governance 的门禁声明
#
# source of truth 是目标仓自己的 AGENTS.md / HARNESS.md / Makefile。这里只**调用**
# 目标仓的门禁，绝不在运行器里复制一份。validator 在目标仓的 cwd 下执行，所以
# `python3 cli.py check` 跑的是目标仓的 cli.py。
#
# campaign / pipeline 的 implement 阶段只允许引用 repo-gate：checks/project_gates.py
# 会断言这一点。于是"LLM 产出能否被接受"由目标仓的门禁决定，而不是由运行器里一份
# 可能与目标仓漂移的 validator 列表决定。
#
# 依据：AGENTS.md：任何代码或契约变更后必须 python3 cli.py quality
# 备注：完整门禁含 race 与发布构建（约 2 分钟）。cli.py check 是它的快速子集，不是门禁。
project:
  target_repo: "~/snaplink-audit-governance"

agent:
  bin: pi
  default_timeout: 1800
  default_workers: 1

validators:
  repo-gate:
    cmd: "python3 cli.py quality"
  # 产物完成度检查（工具提供的脚本，项目自己声明引用）
  no-refusal:
    cmd: "python3 {tool_root}/scripts/check-no-refusal.py {output}"
