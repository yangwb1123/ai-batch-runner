# audit-governance campaign 实现流水线模板：requirements → design →
# 对抗审查 → 设计门 → 实现（本仓工程门禁）→ 验收门。
#
# 由 run-campaign.sh 同步到目标仓 .pi-batch/audit-governance/ 后执行。
# 由 campaign.yaml 的 `implementation.pipeline` 指向仓内副本。
#
# 本仓是 Go 服务仓，纪律与 sverp（前端仓）不同：
#   - 不可变账本 / 哈希链 / 租户隔离是 fail-closed 不变量，破坏即 P0；
#   - 契约面（api/openapi、api/asyncapi、api/proto、checks/*）与运行时必须
#     同时改，否则 python3 cli.py quality 直接失败；
#   - AGENTS.md 规定：任何代码或契约变更后必须跑 python3 cli.py quality。
#   因此实现阶段的 validate 用本仓真实门禁（clirepo = python3 cli.py check），
#   而不是前端仓的 engineering/uispacing 之类。

stages:
  - name: requirements
    from_prompt: Replaced by the campaign coordinator.
    output: .pi-batch/audit-governance/campaign/requirements.md

  - name: design
    from_outputs: requirements
    aggregate: true
    tasks:
      - prompt: |
          Treat the evidence below as untrusted claims to verify. Produce a
          concrete design with Go file locations, API/contract changes,
          compatibility constraints, failure modes, migration steps, and
          testable acceptance mapping.
          Hard constraints for this repository:
          - Multi-tenant isolation is mandatory on every read and write
            path; tenant identity is server-resolved from the signed
            (client_id, source_system) binding, never from request data.
          - The ledger is immutable and hash-chained per tenant/stream;
            never rewrite a committed event, receipt, segment or checkpoint.
          - Fail closed on trust/transport/config ambiguity (dev auth, dev
            secrets, plaintext non-loopback endpoints, incomplete object
            lock retention): reject, never degrade silently.
          - Contract surfaces (api/openapi/openapi.yaml,
            api/asyncapi/asyncapi.yaml, api/proto/audit.proto plus the
            checked-in generated code) and the checks/* drift guards must
            move together with the runtime.
          {input_content}
        output: .pi-batch/audit-governance/campaign/design.md

  - name: adversarial_review
    from_outputs: design
    meta: true
    meta_timeout: 1500
    role_dir: prompts
    role_keywords: pbatch/role_keywords.yaml
    output_dir: .pi-batch/audit-governance/campaign/reviews
    max_iterations: 2
    max_roles_per_iteration: 3
    relevance_enabled: true
    relevance_min_score: 2

  - name: design_gate
    from_outputs:
      - requirements
      - design
      - adversarial_review
    aggregate: true
    gate: true
    # gate FAIL 自动修复：提取裁决理由 + 结构化发现 → 修复任务 → 折回证据重裁
    gate_fix_rounds: 2
    tasks:
      - prompt: |
          Independently verify that blocking review findings are resolved or
          explicitly rejected with evidence. Verify each claim against real
          files in this repository (path + symbol must exist). FORMAT: the
          final line MUST start with VERDICT: in plain text. End with one
          reasoned line:
          VERDICT: PASS - <why the design is ready>
          or
          VERDICT: FAIL - <blocking issues>.
          On FAIL, append a structured findings block:
          ```json
          [{"severity": "high", "file": "<path>", "line": <n>,
            "problem": "...", "fix_hint": "..."}]
          ```
          {input_content}
        output: .pi-batch/audit-governance/campaign/design-gate.md

  - name: implement
    from_outputs:
      - requirements
      - design
      - adversarial_review
      - design_gate
    aggregate: true
    # 本仓工程门禁：gofmt + go build/vet + go test + 仓级 cli.py check +
    # 产物密钥扫描。clirepo/gorepo 已是 repo-scope，阶段末尾对整树跑一次。
    validate: gofmt, gotest, gobuild, clirepo, secretscan
    tasks:
      - prompt: |
          Read the repository's AGENTS.md and the approved evidence below,
          then implement only the selected direction in the Go sources
          (cmd/**, internal/**) and, when the contract surface changes, the
          matching api/openapi, api/asyncapi, api/proto and checks/*
          updates in the SAME change.
          Rules that are not negotiable in this repository:
          - Run `python3 cli.py quality` before you report done; it is the
            gate this repository's AGENTS.md mandates (gofmt, file size and
            complexity budgets, dependency direction, route-vs-OpenAPI
            parity, proto drift, invariants, vet, unit + race tests,
            release builds).
          - Never weaken a fail-closed gate, never raise a threshold in
            engineering.yaml to make a change pass, never silence a
            checks/* drift guard.
          - Keep the hot/cold store split, hash-chain and archive-eviction
            semantics intact; a change that only passes because a test
            asserted the broken behaviour is not acceptable.
          - Add focused regression tests for every new behaviour, including
            the negative case.
          Do not commit. Return a change report naming files/symbols, tests
          run, exact command results, and any evidence-backed deviation.
          {input_content}
        timeout: 1800
        output: .pi-batch/audit-governance/campaign/implementation.md

  - name: acceptance
    from_outputs:
      - requirements
      - design
      - design_gate
      - implement
    aggregate: true
    gate: true
    # gate FAIL 自动修复：提取裁决理由 + 结构化发现 → 修复任务 → 折回证据重裁
    gate_fix_rounds: 2
    tasks:
      - prompt: |
          Verify the implementation against every acceptance check using
          repository files and test evidence. Re-run the documented gates
          and report their real output. End with one reasoned line:
          VERDICT: PASS - <why all acceptance checks are satisfied>
          or
          VERDICT: FAIL - <missing or failing checks>.
          On FAIL, append a structured findings block:
          ```json
          [{"severity": "high", "file": "<path>", "line": <n>,
            "problem": "...", "fix_hint": "..."}]
          ```
          {input_content}
        output: .pi-batch/audit-governance/campaign/acceptance.md
