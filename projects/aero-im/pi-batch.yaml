# aero-im 的门禁声明
#
# source of truth 是目标仓自己的 AGENTS.md / HARNESS.md / Makefile。这里只**调用**
# 目标仓的门禁，绝不在运行器里复制一份。validator 在目标仓的 cwd 下执行，所以
# `python3 cli.py check` 跑的是目标仓的 cli.py。
#
# campaign / pipeline 的 implement 阶段只允许引用 repo-gate：checks/project_gates.py
# 会断言这一点。于是"LLM 产出能否被接受"由目标仓的门禁决定，而不是由运行器里一份
# 可能与目标仓漂移的 validator 列表决定。
#
# 依据：HARNESS.md：每次提交/编辑前，Agent 必须运行 make check-harness
# 备注：四步：cargo check 全 workspace、文件尺寸、函数复杂度、依赖方向。
project:
  target_repo: "~/aero-im"

agent:
  bin: pi
  default_timeout: 1800
  default_workers: 1

validators:
  repo-gate:
    cmd: "make check-harness"
