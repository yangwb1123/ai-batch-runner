# aero-im 后端（Rust）维护 campaign —— 5 天无人值守轨道。
#
# 运行（引擎与本文件都在 ai-batch-runner 仓内，cwd 必须是目标仓）：
#   bash ~/ai-batch-runner/projects/aero-im-be-5d/run-campaign.sh --dry-run
#   bash ~/ai-batch-runner/projects/aero-im-be-5d/run-campaign.sh --top-only
#
# 硬边界（写进每个 agent 的 prompt，并由仓内门禁兜底）：
#   * 只做后端 Rust 域：crates/、migrations/、scripts/。**绝对不碰 web/**。
#   * 不跑 PostgreSQL / Docker / migration / 外部网络（PG 门控测试保持 #[ignore]）。
#   * 不擅自启用 durable-v1 或 account-summary 生产开关，不改 docs/sprint/TODO.md
#     的 staging/生产验收项。
name: aero-im-backend-5d

discovery:
  # 只列后端根目录；web/ 不在 roots 里，所以它连模块候选都进不来。
  roots:
    - crates
    - migrations
  exclude:
    - target
    - testdata
    - gen
    - generated
    - mock
    - docs
    - examples
    - logs
    - vendor
    - node_modules
    - .git
    - .github
    - .pi-batch
    - __pycache__
    - web
  max_depth: 2
  fallback_top_level: false

analysis:
  jobs: 2
  retries: 2
  candidate_limit: 3
  prompt: |
    Analyze module '{module}' at {module_path} of aero-im — a pure-Rust
    AI-native IM + live-streaming platform (axum gateway, NATS JetStream
    event bus, Postgres + pgvector repos, Redis cluster state, WebRTC
    SFU/WHIP, bots/workers/timers). Read /home/u1/aero-im/AGENTS.md first
    and obey it: the crate dependency graph must stay acyclic, room data
    routes must call `ImService::assert_room_access(participant, room)`
    (participant argument first), tagged-enum `kind` fields must not
    collide, and every non-success branch of an at-least-once state machine
    must re-park the claimed row in a retryable state.

    SCOPE — backend Rust only. Any direction whose evidence lives in `web/`
    is out of scope and must not be proposed. No frontend, no CSS, no
    SolidJS/Vite, no pnpm.

    Return ONLY a JSON array with at most {candidate_limit} high-value
    directions, sorted by value. Each object must contain: title, problem,
    value (1-10), risk_reduction (1-10), effort (1-10), confidence (1-10),
    evidence (JSON array of existing file/symbol paths), and acceptance
    (JSON array of testable checks). evidence and acceptance MUST be JSON
    arrays of strings, for example:
    {"title": "...", "problem": "...", "value": 7, "risk_reduction": 6,
     "effort": 2, "confidence": 8,
     "evidence": ["crates/aero-storage/src/audit_governance/outbox.rs:210"],
     "acceptance": ["cargo test --workspace --lib passes",
                    "new unit test covers the repark path"]}
    Do not modify code. Claims without repository evidence must be
    identified as proposed, not verified. A direction that cannot be
    verified by hermetic commands (`cargo check --workspace`,
    `cargo test --workspace --lib`, `cargo clippy --workspace --all-targets`,
    `make ci`) is not a valid direction.

selection:
  max_directions: 1
  max_total_directions: 2
  minimum_score: 0

implementation:
  pipeline: .pi-batch/aero-im-be-5d/campaign-pipeline.yaml
  requirement_stage: requirements
  concurrency: 1
  # 单个方向的硬墙钟上限（秒）。
  timeout: 14400
  # 无进展看门狗：单个 pipeline 超过该秒数没有产物推进即判失败。
  no_progress_timeout: 7200
  worktree_root: .pi-batch/aero-im-be-5d/worktrees

state:
  output_dir: docs/auto
  state_file: docs/auto/state.jsonl
  summary_file: docs/auto/SUMMARY.md
  line_max_bytes: 262144

recovery:
  # 连续无进展 round → fail closed 停止（安全电路，默认即生效；显式写出来
  # 是为了让 5 天无人值守的停止条件可审计）。
  stop_after_stalled_rounds: 2
  # 失败的 worktree 一律保留供人工检查，绝不 reset/stash/checkout。
  restore_on_failure: false
  enabled: false

preflight:
  # 任何模型调用之前先验：pipeline 必须引用目标仓自己的 repo-scope 门禁，
  # 否则「LLM 产出能否被接受」就没有被目标仓裁决。
  require_repo_validator: true
  required_repo_validators:
    - repo-gate
    - repo-tests
    - repo-clippy

estimates:
  analysis_minutes: 4
  pipeline_minutes: 45
