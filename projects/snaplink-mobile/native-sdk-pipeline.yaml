# Snaplink native (Android/Kotlin) SDK capability work — governed pipeline.
#
# Scope is deliberately limited to work that this host can actually verify.
# The Swift SDK is excluded on purpose: there is no Swift toolchain on this
# machine, so Swift changes could not be compiled or tested, and unverified
# output in a security-relevant SDK is exactly what this repository forbids.
# Swift is listed in the plan as follow-up work requiring a macOS runner.
#
# The three M0/M1 decisions that gate the mobile *app* (M3) are human-owned and
# are NOT in scope: numeric/decimal wire semantics (docs/API_V1_NUMERIC_WIRE_REVIEW.md
# in the SVERP repository), official public client IDs / API audience / redirect
# registration, and the App Link + HTTPS endpoint decision table. Nothing here
# depends on them, and nothing here may assume their outcome.
#
# Run from the Snaplink repository root (the agent edits that tree and the
# validators run there):
#   cd /home/dwp/snaplink
#   python /home/dwp/ai-batch-runner/pi-batch.py \
#     --pipeline /home/dwp/ai-batch-runner/projects/snaplink-mobile/native-sdk-pipeline.yaml \
#     --model opencode/space-bunny-free --thinking max --retries 2
#
# git_commit stays false: the agent's code changes land in the working tree for a
# human to read before anything is committed. Nothing may be published.

git_commit: false

stages:
  # ── 1. Plan: establish the real gap from the source, not from the registry ──
  - name: plan
    from_prompt: |
      You are planning work on the Snaplink Android/Kotlin SDK in the
      repository at /home/dwp/snaplink. Establish the real gap from the SOURCE,
      not from the capability registry, and produce a plan. Do not write
      implementation code.

      Context you must verify yourself before planning anything:

      1. ops/build/sdk-paradigm.json marks 11 capabilities `missing` for
         kotlin, but the Kotlin sources in sdks/kotlin/main/ already contain
         Entitlement.kt, LicenseFile.kt, PresentationPreferences.kt,
         CommerceTransport.kt, ErrorTaxonomy.kt, and SnaplinkAuthClient exposes
         setup / accountContext / presentationPreferences /
         updatePresentationPreferences / clear / logout / currentSession. The
         registry appears to UNDERSTATE what exists. Confirm or refute this per
         capability with file:line evidence, and do not take the registry's word
         for anything.
      2. Compare against the languages that are already onboarded. Read how
         sdks/swift/Sources, sdks/php/src, sdks/python/snaplink_sso and the Go
         SDK implement the same capability, and match their shape rather than
         inventing a Kotlin-only convention.
      3. Two gaps look genuinely real and are the likely core of this work:
         - the Android secure store is `internal` in
           sdks/kotlin/main/AndroidSecureStore.kt, so a consumer cannot inject
           a state store, while the other SDKs allow injection;
         - there is no `isLoggedIn`-style query, though `currentSession()`
           exists.
         Verify both, and say precisely what is missing.

      Produce a plan containing, for each of the three work items below, the
      evidence, the exact files to change, the public API shape you propose
      (with signatures), the tests you will add, and the risks:

        A. An injectable state store for the Kotlin SDK, keeping the Android
           Keystore implementation as the default so existing behaviour is
           unchanged. It must store PKCE transactions and tokens exactly as
           today and must keep failing closed on storage errors.
        B. A logged-in query for the Kotlin SDK. It must be conservative: it
           must NOT fabricate or resurrect a session, must not perform network
           I/O, and must not report logged-in for a session whose token is
           already expired. State the exact semantics you choose and why they
           are fail-closed.
        C. Reconciling ops/build/sdk-paradigm.json with reality: entries that
           become `present` need a real file and a real symbol that the
           checker can find, and anything you cannot evidence stays `missing`.
           Changing an entry must reflect a capability that demonstrably works,
           not merely a symbol that happens to exist.

      Constraints that are not negotiable:
      - Do not weaken, relax, or reconfigure any gate, threshold, or check. Do
        not add an exemption of any kind. The repository forbids growing
        exemption maps.
      - Do not touch Go, server, deployment, workflow, or release code.
      - Do not add third-party dependencies.
      - Do not touch sdks/swift at all: there is no Swift toolchain here, so
        Swift changes could not be compiled or tested. Record Swift as
        follow-up instead.
      - Do not publish anything, and do not create tags.
      - The package coordinate is site.ywbsd.sso:snaplink and is owned by a
        fail-closed publication gate; leave that build configuration alone.

      Finish by stating clearly what you will NOT do and why.
    output: /home/dwp/ai-batch-runner/projects/snaplink-mobile/runs/plan.md
    mode: serial

  # ── 2. Implement: real code + real tests, behind the repository's own gates ──
  - name: implement
    from_outputs: plan
    # AND semantics: the stage fails unless every one of these passes. These are
    # this repository's real gates, not a proxy for them. The Gradle command
    # needs JAVA_HOME set explicitly because the default on this host is Java 8.
    validate: >-
      cd /home/dwp/snaplink && python cli.py sdk-naming check;
      cd /home/dwp/snaplink && python cli.py sdk-surface check;
      cd /home/dwp/snaplink && python cli.py sdk-paradigm check;
      cd /home/dwp/snaplink && make fmt;
      cd /home/dwp/snaplink && go test -run 'TestMaintainability_|TestArchitecture_' .;
      cd /home/dwp/snaplink && python -m pytest checks/ -q;
      cd /home/dwp/snaplink && python -m unittest discover -s ops/scripts -p 'test_sdk_*.py';
      cd /home/dwp/snaplink/sdks && JAVA_HOME=/usr/lib/jvm/java-21-openjdk ./gradlew :snaplink:testDebugUnitTest :snaplink:lintDebug :snaplink:assembleRelease
    tasks:
      - prompt: |
          You are the implementer for the Snaplink Android SDK. Read
          {input_content} (the plan) and treat it as the scope boundary.

          Implement the plan in the real sources under
          /home/dwp/snaplink/sdks/kotlin, following the shapes the already
          onboarded SDKs use. Requirements that do not bend:

          - Behaviour preservation first. Existing callers must keep working
            unchanged. The Android Keystore store stays the default; injection
            is additive.
          - Fail closed. A storage error, a Keystore error, or an unreadable
            state must surface as an error. Never convert an unknown or missing
            fact into a default, an empty success, or a false "logged in".
          - The logged-in query must not do network I/O and must not resurrect
            or fabricate a session.
          - Every behavioural change ships with a test that fails without the
            change. A test that passes either way is not evidence.
          - When you touch ops/build/sdk-paradigm.json, every entry you set to
            `present` must name a real file and a real symbol that
            `python cli.py sdk-paradigm check` can find, and you must be able
            to point at the test that proves the capability works. If a
            capability is not demonstrably working, leave it `missing` and say
            so — an honest `missing` is the correct outcome, not a failure.

          Run the gates yourself and paste their real output. If a gate fails,
          fix the cause; never adjust the gate.

          Do not touch sdks/swift, Go, server, deployment, workflow or release
          files. Do not add dependencies. Do not commit, tag, or publish.

          Finish with a completion report: what changed (file:line), what each
          test proves, every gate's actual result, and anything you deliberately
          left undone with the reason.
        output: /home/dwp/ai-batch-runner/projects/snaplink-mobile/runs/implementation.md

  # ── 3. Adversarial review: roles picked from the evidence ──
  - name: review
    from_outputs: implement
    meta: true
    role_dir: prompts
    output_dir: /home/dwp/ai-batch-runner/projects/snaplink-mobile/runs/reviews
    max_iterations: 2
    mode: serial

  # ── 4. Gate: an independent verdict, blocking on anything unverified ──
  - name: gate
    from_outputs: review
    aggregate: true
    gate: true
    mode: serial
    tasks:
      - prompt: |
          You are the gatekeeper for changes to the Snaplink Android SDK, an
          OAuth/OIDC client library. Read {input_content} (the plan, the
          implementation report and the review deliverables) and verify against
          the repository itself, not against the reports' own claims.

          Verify, and refuse to accept on assertion:
          - The plan's evidence holds: re-check the file:line claims about what
            already existed versus what was added.
          - No existing caller can observe a behaviour change. The Keystore
            store is still the default and still fails closed.
          - The logged-in query cannot report a session as usable when it is
            not, does no network I/O, and does not resurrect state.
          - Every `present` entry added to ops/build/sdk-paradigm.json names a
            real symbol and is backed by a test that fails without the change.
          - No gate, threshold, or exemption was weakened; no dependency added;
            no Go, server, workflow, release or Swift file changed.
          - The gates in the implementation report are reported with their real
            output, and any that were not run are stated as not run rather than
            assumed to pass.

          Output on the last line, exactly:
          VERDICT: PASS - <why the work is complete and verified>
          or
          VERDICT: FAIL - <the blocking issues>
        output: /home/dwp/ai-batch-runner/projects/snaplink-mobile/runs/gate.md
