# snaplink-console B6 批次实施 campaign（审计读路径）
# 前置：docs/proposals/audit-contract-batch-snaplink-console.md；
#       B1-5 read self-audit 已由 sink 仓实现
name: console-b6-audit-read-path

discovery:
  roots:
    - lib
  exclude:
    - testdata
    - gen
    - generated
    - mock
    - build
    - docs
    - examples
    - logs
    - .git
    - .pi-batch
    - __pycache__
  max_depth: 2
  fallback_top_level: true

analysis:
  jobs: 4
  retries: 2
  candidate_limit: 3
  prompt: |
    Analyze module '{module}' at {module_path} of snaplink-console
    (Flutter admin console, capability-driven navigation). An approved
    contract (audit v2.1) assigns batch B6: (1) audit read-path
    integration — the audit timeline page must call the sink read API
    (tenant_id + trace_id via BFF; lib/services/audit_log_service.dart
    + lib/api/portal_api.dart actual paths, not lib/services/), the
    localStorage ring becomes debug-only recording, display server-side
    records; (2) edge generation verification — login must emit
    auth.login.success with client_id=sso-admin-console. Keep the capability-
    driven navigation pattern (no guessing interfaces). Return ONLY a
    JSON array with at most {candidate_limit} high-value directions
    toward B6, sorted by value. Each object must contain: title,
    problem, value (1-10), risk_reduction (1-10), effort (1-10),
    confidence (1-10), evidence (existing file/symbol paths), and
    acceptance (testable checks mapping to T-12 joint). Do not modify
    code. Claims without repository evidence must be identified as
    proposed.

selection:
  max_directions: 2
  minimum_score: 0

implementation:
  pipeline: examples/repository-campaign-pipeline.yaml
  requirement_stage: requirements
  concurrency: 1
  timeout: 14400
  worktree_root: .pi-batch/worktrees

state:
  output_dir: docs/auto
  state_file: docs/auto/state.jsonl
  summary_file: docs/auto/SUMMARY.md
  line_max_bytes: 262144

estimates:
  analysis_minutes: 3
  pipeline_minutes: 25
