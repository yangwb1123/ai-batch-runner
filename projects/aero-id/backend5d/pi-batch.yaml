# aero-id backend-only gate declaration for the 5-day campaign.
#
# The gate is the target repository's own Makefile targets (AGENTS.md done-gate),
# never a copy of it. Validators run with the direction worktree as cwd, so
# `make` executes the target repository's own targets.
#
# repo-gate is intentionally the FULL documented done-gate: a direction is only
# accepted when test, lint, lint-strict, every check-* guard and build are green,
# and when the change contains no web/ frontend path.
project:
  target_repo: "/home/u1/aero-id-backend-5d"

agent:
  bin: pi
  default_timeout: 3600
  default_workers: 1

validators:
  repo-gate:
    cmd: "bash /home/u1/aero-id-backend-5d/.pi-batch/aero-id-backend5d/done-gate.sh"
    # scope: repo -> the campaign preflight runs this gate at baseline, before
    # any model call, and the implement stage re-runs it per direction.
    scope: repo
