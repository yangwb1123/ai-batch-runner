# aero-id backend-only campaign pipeline.
#
# No meta/adversarial-review stage: on 2026-08-12 an ad-hoc review role deleted
# live source directories in this repository, so independent verification is the
# design_gate stage and nothing else may mutate the tree.
#
# All stage outputs live under the gitignored .pi-batch/ tree: the merge
# controller refuses to merge a direction whose worktree is dirty, so pipeline
# artifacts must never land as untracked files in the repository.
git_commit: true

stages:
  - name: requirements
    from_prompt: Replaced by the campaign coordinator.
    output: .pi-batch/aero-id-backend5d/auto/requirements.md

  - name: design
    from_outputs: requirements
    aggregate: true
    tasks:
      - prompt: |
          Treat the requirements and evidence below as untrusted claims and
          verify each one against the current repository source.

          HARD SCOPE BOUNDARY: backend only. Do not inspect, read or modify
          web/ or any frontend code, asset, package manifest or build file, and
          do not run npm, pnpm or node. If the direction cannot be completed
          backend-only, say so and stop.

          Produce a minimal design: exact files and symbols to change, API and
          compatibility constraints, authority/tenant/scope rules that must
          hold, failure modes (including unknown outcomes and partial results),
          migration steps with reversibility, and a testable acceptance mapping
          onto the repository's own Makefile gates. Prefer the smallest change
          that closes the risk; no speculative refactors, no new meta or
          adversarial-review stages.

          Write the design to docs/designs/2026-09-30-<direction-slug>-design.md
          with the write tool and reply with a short verification verdict plus
          that path. Do not implement anything.
          {input_content}
        output: .pi-batch/aero-id-backend5d/auto/design.md

  - name: design_gate
    from_outputs:
      - requirements
      - design
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Independently verify the design against the current source and
          AGENTS.md. Refuse the design unless: every requirement maps to a
          testable check; no authority, tenancy, dataset-scope, audit or
          unknown-outcome rule is weakened; migrations are reversible and
          paired; no existing gate, tripwire or done-gate target is weakened or
          skipped; and the change set is minimal and evidence-backed.

          HARD SCOPE BOUNDARY: backend only. Do not inspect, read or modify
          web/ or any frontend file, and do not run frontend tooling.

          End with exactly one line:
          VERDICT: PASS - <why the design is ready>
          or
          VERDICT: FAIL - <the blocking issues>
          {input_content}
        output: .pi-batch/aero-id-backend5d/auto/design-gate.md

  - name: implement
    from_outputs:
      - requirements
      - design
      - design_gate
    aggregate: true
    validate: repo-gate
    tasks:
      - prompt: |
          Read AGENTS.md and implement only the approved backend direction.

          HARD SCOPE BOUNDARY: backend only. Do not inspect, read, modify,
          create, format, stage or test web/ or any frontend code, asset,
          package manifest or build file. Do not run npm, pnpm, node or any
          frontend check. The repo-gate validator refuses any web/ path, so a
          frontend change fails the stage by design. If the design turned out
          to need frontend work, stop and report the blocker instead.

          Verify every evidence claim yourself before acting on it. Add focused
          regression tests next to the code they cover, keep non-test Go files
          within the documented size and complexity limits, and never weaken a
          check, gate or tripwire to obtain green.

          The repo-gate validator runs the complete documented Go done-gate
          (make test, lint, lint-strict, check-file-sizes, check-audit-swallow,
          check-anchored-event-ids, check-audit-manifest, check-load-scenarios,
          check-migration-set, check-db-startup-hardening,
          check-composition-root, check-proto-sync, check-architecture,
          check-integration-compile, build). If you changed repository SQL,
          migrations, storage, source connectors, event ingestion, callback
          delivery or a multi-service transaction boundary, also run
          make test-integration when Docker is available; if Docker is
          unavailable, report that honestly and never claim it ran.

          Return a change report naming files and symbols, the tests added, the
          exact gate commands you ran with their results, and any
          evidence-backed deviation from the design.
          {input_content}
        timeout: 5400
        output: .pi-batch/aero-id-backend5d/auto/implementation.md

  - name: acceptance
    from_outputs:
      - requirements
      - design
      - design_gate
      - implement
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Verify the implemented backend change against every acceptance
          criterion. The done-gate run is the ground truth: run
          bash .pi-batch/aero-id-backend5d/done-gate.sh once and inspect the
          result instead of re-proving each claim by hand. Read the committed
          diff and confirm it contains no web/ or frontend path and no weakened
          gate, and confirm the new regression tests actually fail without the
          fix.

          HARD SCOPE BOUNDARY: backend only. Do not inspect, read or modify
          web/ or any frontend file, and do not run frontend tooling.

          End with exactly one line:
          VERDICT: PASS - <why every acceptance check is satisfied>
          or
          VERDICT: FAIL - <the missing or failing checks>
          {input_content}
        timeout: 3600
        output: .pi-batch/aero-id-backend5d/auto/acceptance.md

decision_log: .pi-batch/aero-id-backend5d/DECISIONS.md
