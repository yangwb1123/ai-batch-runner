# iris-ui 项目级 Campaign：自动发现 @iris-ui-kit/vue 包各模块的改进方向
# → 结构化评分 → 在 iris-ui 仓库内源码实现（只改 packages/vue/src/**，
# 禁止碰 dist/；发布与 sverpweb-stable 升级由 scripts/sverp/iris-publish.sh
# 完成，不在本 campaign 内发布）。
#
# 运行（见 scripts/sverp/run-campaign.sh）：
#   run-campaign.sh iris --dry-run
#   run-campaign.sh iris --max-directions 2 --reuse
#   run-campaign.sh iris --modules packages/vue/src/admin
#
# 注意：本文件由 run-campaign.sh 同步到仓库内 .pi-batch/sverp/campaign.yaml
# 后执行。改这里即可。

name: iris-vue-improvements

discovery:
  roots:
    - packages/vue/src/admin
    - packages/vue/src/async
    - packages/vue/src/behaviors
    - packages/vue/src/data
    - packages/vue/src/error-boundary
    - packages/vue/src/form
    - packages/vue/src/layouts
    - packages/vue/src/machine
    - packages/vue/src/motion
    - packages/vue/src/provider
    - packages/vue/src/resource
    - packages/vue/src/skeletons
    - packages/vue/src/skins
    - packages/vue/src/theme
    - packages/vue/src/undo
  exclude:
    - node_modules
    - dist
    - .git
    - .pi-batch
    - docs
    - testdata
    - generated
    - playground
    # primitives/ 含 90 个组件子目录，默认不进自动发现（会拆成 90 个模块）；
    # 需要深度审计时用: run-campaign.sh iris --modules packages/vue/src/primitives
    # （显式 --modules 绕过目录遍历，把 primitives 作为单个模块分析）
    - primitives
  max_depth: 1
  fallback_top_level: false

analysis:
  jobs: 4
  retries: 2
  candidate_limit: 3
  prompt: |
    Analyze module '{module}' at {module_path} in the iris-ui monorepo —
    specifically the @iris-ui-kit/vue package (Vue 3.5 adapter consumed by
    sverpweb-stable at exact versions). Scope is limited to packages/vue.
    Return ONLY a JSON array with at most {candidate_limit} high-value
    improvement directions, sorted by value.
    Each object must contain: title, problem, value (1-10),
    risk_reduction (1-10), effort (1-10), confidence (1-10),
    evidence (array of existing file/symbol paths), and acceptance
    (array of testable checks).
    evidence and acceptance MUST be JSON arrays of strings, e.g.:
    {"title": "...", "problem": "...", "value": 7, "risk_reduction": 6, "effort": 2, "confidence": 8,
     "evidence": ["packages/vue/src/admin/NavMenu.ts:42"], "acceptance": ["pnpm --filter @iris-ui-kit/vue test passes"]}
    Do not modify code. Claims without repository evidence must be
    identified as proposed, not verified.
    DISIPLINE: fixes must be implemented in packages/vue/src/** source
    only — never in dist/ (build artifacts, never committed). The release
    loop (version bump → npm publish → sverpweb-stable dependency upgrade
    → verification) is handled by scripts/sverp/iris-publish.sh, NOT by
    this campaign. Backward compatibility with the published API matters:
    prefer additive changes; breaking changes must be flagged in title
    with "[breaking]".

selection:
  max_directions: 2
  minimum_score: 0

implementation:
  pipeline: .pi-batch/sverp/campaign-pipeline.yaml
  requirement_stage: requirements
  concurrency: 1
  # 每个方向流水线总墙钟截止
  timeout: 14400
  worktree_root: .pi-batch/worktrees

state:
  output_dir: .pi-batch/campaign
  state_file: .pi-batch/campaign/state.jsonl
  summary_file: .pi-batch/campaign/SUMMARY.md
  line_max_bytes: 262144

estimates:
  analysis_minutes: 4
  pipeline_minutes: 30
