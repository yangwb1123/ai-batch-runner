                result: passed
            not_executed:
              - check: 浏览器人工验收
                reason: 本轮无浏览器环境
            residual_risks:
              - 尚未收敛的指标及其原因
            assumptions:
              - 收敛数字的复核口径（哪条命令、哪个阈值）
          ```

          result 只能取 passed / failed / not_executed；changed_files 必须
          列出本任务真实新增或修改的文件；not_executed 每项都要带 reason；
          禁止写「理论上应该通过 / should pass」这类伪造通过表述。
        timeout: 3600
        output: .pi-batch/aps-settings/refactor-production-line.md
        thinking: max
        validate: completion

      - prompt: |
          你是重构执行者。阅读 {input_content}（方案，含前两个任务的结果）
          与 apps/web/src/pages/aps/settings/CalendarSettings.tsx。
          按方案拆分（行事历本体 / 班次与周同步 / 跨生产线同步副作用分离），
          新模块放在同目录。
          硬约束：对外 props/emits 契约不变；不改 API 调用与参数；不新增
          硬编码文案；不修改 ApsSettingsPage.tsx、其它 settings 文件与任何
          CSS；不 commit。跨生产线同步必须仍覆盖全部生产线。
          收敛目标：源文件 < 400 行、事件处理函数 <= 8、嵌套深度 <= 4。
          结束时用 completion 报告格式给出：result、拆分文件清单、收敛前后
          数字、验证命令与结果。

          产物末尾必须包含如下 ```yaml 代码块，字段名与缩进逐字照抄
          （completion 门禁按机械格式校验，不接受自由描述）：

          ```yaml
          completion_report:
            summary: 一句话说明本任务做了什么
            changed_files:
              - apps/web/src/pages/aps/settings/<新模块>.tsx
            commands_executed:
              - command: pnpm --filter @sverp/web test
                result: passed
            not_executed:
              - check: 浏览器人工验收
                reason: 本轮无浏览器环境
            residual_risks:
              - 尚未收敛的指标及其原因
            assumptions:
              - 收敛数字的复核口径（哪条命令、哪个阈值）
          ```

          result 只能取 passed / failed / not_executed；changed_files 必须
          列出本任务真实新增或修改的文件；not_executed 每项都要带 reason；
          禁止写「理论上应该通过 / should pass」这类伪造通过表述。
        timeout: 3600
        output: .pi-batch/aps-settings/refactor-calendar.md
        thinking: max
        validate: completion

      - prompt: |
          你是重构执行者。阅读 {input_content}（方案，含前几个任务的结果）
          与 apps/web/src/pages/aps/settings/PhaseSettings.tsx、
          apps/web/src/pages/aps/settings/ApsAutoSchedulePanel.tsx。
          按方案降低嵌套深度并抽出子组件/纯函数，新模块放在同目录。
          硬约束：对外 props/emits 契约不变；不改 API 调用与参数；不新增
          硬编码文案；不修改 ApsSettingsPage.tsx、其它 settings 文件与任何
          CSS；不 commit。自动排程面板的 source gate 与失败态必须保持不变
          （失败/降级时清除陈旧预览）。
          收敛目标：两个源文件均 < 400 行、嵌套深度 <= 4。
          结束时用 completion 报告格式给出：result、拆分文件清单、收敛前后
          数字、验证命令与结果。

          产物末尾必须包含如下 ```yaml 代码块，字段名与缩进逐字照抄
          （completion 门禁按机械格式校验，不接受自由描述）：

          ```yaml
          completion_report:
            summary: 一句话说明本任务做了什么
            changed_files:
              - apps/web/src/pages/aps/settings/<新模块>.tsx
            commands_executed:
              - command: pnpm --filter @sverp/web test
                result: passed
            not_executed:
              - check: 浏览器人工验收
