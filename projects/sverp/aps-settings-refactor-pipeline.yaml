          列出本任务真实新增或修改的文件；not_executed 每项都要带 reason；
          禁止写「理论上应该通过 / should pass」这类伪造通过表述。
        timeout: 3600
        output: .pi-batch/aps-settings/refactor-phase-auto.md
        thinking: max
        validate: completion

      - prompt: |
          你是重构执行者。阅读 {input_content}（方案与前面所有任务的结果）。
          本任务只处理 apps/web/src/pages/aps/ApsSettingsPage.tsx：收敛
          嵌套深度，把面板装配/筛选器/月份与生产线选择等职责拆到
          apps/web/src/pages/aps/settings/ 下的新模块。
          硬约束：路由 /prod/schedule/setting 仍指向本页；地址栏参数
