# /prod/schedule/setting（ApsSettingsPage）结构优化流水线。
#
# 目标：只做结构性重构，降低该路由页面的 god-file / 事件处理函数 / 判断点 /
# 嵌套深度风险，同时零行为变化。确定性 UI 规范门禁当前已是 0 违规，因此本轮
# 不做视觉改版，也不引入新的硬编码文案。
#
# 范围白名单（超出即视为越界，必须拒绝）：
#   apps/web/src/pages/aps/ApsSettingsPage.tsx
#   apps/web/src/pages/aps/ApsSettingsPage.css
#   apps/web/src/pages/aps/settings/**
#   apps/web/src/i18n.ts            ← 新文案 key（2026-10-01 gate-fix 把这条漏掉，
#                                    导致 head/middle/tail 本地化文案被回滚）
#   apps/web/src/pages/aps/__testkit__/kit.ts  ← Iris 交互桩
# 新拆分出的模块必须放在 apps/web/src/pages/aps/settings/ 内。
#
# 运行（必须从 sverpweb-stable 仓库根执行，让项目级 pi-batch.yaml 生效）：
#   cd /home/dwp/workspace/job/sverpweb-stable
#   PBATCH_SCRIPT_DIR="$PWD" python3 /home/dwp/ai-batch-runner/pi-batch.py \
#     /home/dwp/ai-batch-runner/projects/sverp/aps-settings-refactor-pipeline.yaml \
#     --retries 2 --log-file logs/aps-settings-refactor.log
#
# 门禁说明：
#   uicheck / uieng 是仓库级扫描（scope: repo，阶段末各跑一次）；
#   uigeometry 没有 --baseline，而全前端存在 9 处**存量**圆角家族违规
#   （style.css 2、BsShipTracingPage.css 1、MoldDetailPage.css 3、
#   SrmSharingPage.css 3；均为 HEAD 上已有、白名单外、本轮未改动的文件），
#   因此几何门禁按本流水线负责的页面范围执行，避免用无关存量阻塞本轮重构。
#   行为回归由 stage commands 的 typecheck + vitest 全量兜底，任一失败即阶段失败。
# god-file 等 strict 指标不是阻断门禁（存量按基线管理），本流水线只要求
# 「不新增」并给出可核对的收敛数字。
#
# provider/model 显式钉住：项目级 pi-batch.yaml 的 default_model 为空，会落到
# pi 自身默认 provider，而该 provider 当前余额为 0（insufficient_user_quota）。
# 显式 provider 同时让 provider breaker 按 provider 分区记账，避免沿用
# agent:pi 上已触发的 24h 冷却。改 provider 前必须先实测可用：
#   pi auth check --provider opencode
#   pi --provider opencode --model space-bunny-free --thinking max \
#     -p "reply with the single word OK"
#
# thinking=max 通过**任务级** `thinking: max` 传递。schema 只在 task 级支持
# thinking，且 stage 必须恰好有一个输入源，因此 from_prompt 的 plan 阶段与
# meta 编排的 review 角色用 agent 默认 thinking；5 个重构任务与 gate 裁决任务
# 显式 `thinking: max`。这是 harness 的能力边界（AGENT_THINKING_OVERRIDE 恒为空），
# 不是本流水线的取舍。

git_commit: false
decision_log: docs/auto/DECISIONS.md

# 每个 refactor 任务都要附的完成报告模板（逐字格式，由 completion 门禁机械校验）。
# 字段名、2 空格缩进、result ∈ {passed, failed, not_executed} 都不能改。
stages:
  # ── 1. 计划：基于确定性违规清单给出逐文件重构方案 ──
  - name: plan
    provider: opencode
    model: space-bunny-free
    from_prompt: |
      你是 sverpweb-stable（Vue 3.5 + @iris-ui-kit/vue 0.2.52 ERP 前端，
      apps/web/src）的重构规划者。本轮只优化 /prod/schedule/setting 路由页面
      （ApsSettingsPage）的代码结构，不改任何业务行为、接口契约或路由。

      先自行复核确定性违规清单（命令都在仓库根执行）：
        python3 /home/dwp/ai-batch-runner/scripts/check-frontend-quality.py \
          --dir apps/web/src/pages/aps --strict --json
        python3 /home/dwp/ai-batch-runner/scripts/check-ui-spec.py \
          --dir apps/web/src/pages/aps --all --json
        python3 /home/dwp/ai-batch-runner/scripts/check-ui-geometry.py \
          --dir apps/web/src/pages/aps --all --json
      并阅读 /home/dwp/ai-batch-runner/ui-specs/ 与 ui-specs/engineering/ 资产。

      已知违规（复核后以你的复核结果为准）：
        ApsSettingsPage.tsx                  631 行、嵌套 5
        settings/ProductionLineSettings.tsx  1056 行、15 个事件处理函数、38 个判断点、嵌套 8
        settings/PlanArrangementSettings.tsx 1211 行、10 个事件处理函数、嵌套 12
        settings/CalendarSettings.tsx        820 行、10 个事件处理函数
        settings/PhaseSettings.tsx           598 行、嵌套 5
        settings/ApsAutoSchedulePanel.tsx    嵌套 5
      UI 规范（间距/颜色/style）与几何合规目前是 0 违规，重构不得引入新的违规。

      输出一份逐文件重构方案（markdown），每个待拆文件都要写清：
        1. 拆分边界：新文件路径 + 每个新模块的单一职责 + 导出面
           （保持原组件对外 props/emits/slots 契约完全不变，调用方
           ApsSettingsPage.tsx 不需要改 props 用法）。
        2. 迁出的具体符号（computed / handlers / 纯函数 / 常量 / 列定义），
           以及迁出后行为等价的判据。
        3. 事件处理函数 / 判断点 / 嵌套深度的收敛目标数字，以及用什么手段达成
           （例如把内联箭头函数收敛为已声明的 handler、把 render 里的三元
           链提成具名函数、把大 JSX 块提成子组件）。
        4. 风险与验证方式：依赖现有测试（settings/*.test.tsx、
           ApsSettingsPage.test.tsx）如何证明行为未变。
        5. 明确不做的事：不改 API 调用与参数、不改 i18n key、不改 CSS 视觉、
           不动 ApsSettingsPage.css 以外的样式、不引入新依赖、不 commit。
      方案必须可被逐个任务独立执行（每个任务只碰一个源文件）。
    output: .pi-batch/aps-settings/plan.md

  # ── 2. 重构：逐文件串行拆分，每任务一个源文件 ──
  - name: refactor
    from_outputs: plan
    provider: opencode
    model: space-bunny-free
    mode: serial
    validate: uicheck,uieng
    validate_cmd: "python {tool_root}/scripts/check-ui-geometry.py --dir {cwd}/apps/web/src/pages/aps --all --json"
    commands:
      - pnpm --filter @sverp/web typecheck
      - pnpm --filter @sverp/web test
    command_timeout: 2400
    tasks:
      - prompt: |
          你是重构执行者。阅读 {input_content}（方案）与
          apps/web/src/pages/aps/settings/PlanArrangementSettings.tsx。
          按方案拆分这个文件：把纯函数、常量、列定义、计算属性与事件处理
          函数迁到 apps/web/src/pages/aps/settings/ 下的新模块，
          让 PlanArrangementSettings.tsx 只保留组件装配。
          硬约束：
          - 组件对外 props/emits/渲染结果与调用方契约逐字不变；
          - 不得修改任何 API 调用、请求参数或 i18n key；
          - 不得新增硬编码 UI 文案（文案走 translate/t）；
          - 不得修改 ApsSettingsPage.tsx、ApsSettingsPage.css 或其它 settings 文件；
          - 不得 git commit。
          收敛目标：源文件 < 400 行、事件处理函数 <= 8、嵌套深度 <= 4。
          结束时用 completion 报告格式给出：result、拆分出的文件清单、
          收敛前后行数/事件处理函数/判断点/嵌套深度数字、验证命令与结果。

          产物末尾必须包含如下 ```yaml 代码块，字段名与缩进逐字照抄
          （completion 门禁按机械格式校验，不接受自由描述）：

          ```yaml
          completion_report:
            summary: 一句话说明本任务做了什么
            changed_files:
              - apps/web/src/pages/aps/settings/<新模块>.tsx
            commands_executed:
              - command: pnpm --filter @sverp/web test
                result: passed
            not_executed:
              - check: 浏览器人工验收
                reason: 本轮无浏览器环境
            residual_risks:
              - 尚未收敛的指标及其原因
            assumptions:
              - 收敛数字的复核口径（哪条命令、哪个阈值）
          ```

          result 只能取 passed / failed / not_executed；changed_files 必须
          列出本任务真实新增或修改的文件；not_executed 每项都要带 reason；
          禁止写「理论上应该通过 / should pass」这类伪造通过表述。
        timeout: 3600
        output: .pi-batch/aps-settings/refactor-plan-arrangement.md
        thinking: max
        validate: completion

      - prompt: |
          你是重构执行者。阅读 {input_content}（方案，含上一任务的结果）
          与 apps/web/src/pages/aps/settings/ProductionLineSettings.tsx。
          按方案拆分这个文件（颜色/手持量/生产起始日/班次/周行事历/
          保存与删除流程分离），新模块放在同目录。
          硬约束：对外 props/emits 契约不变；不改 API 调用与参数；
