  # ── 3. 对抗审查：结构与行为等价性复核 ──
  - name: review
    from_outputs: refactor
    provider: opencode
    orchestrator_provider: opencode
    worker_provider: opencode
    orchestrator_model: space-bunny-free
    worker_model: space-bunny-free
    meta: true
    meta_timeout: 3600
    meta_role_retries: 1
    meta_max_failed_roles: 1
    role_dir: prompts
    role_keywords: pbatch/role_keywords.yaml
    output_dir: .pi-batch/aps-settings/reviews
    max_iterations: 2
    max_roles_per_iteration: 3
    relevance_enabled: true
    relevance_min_score: 2
    mode: serial

  # ── 4. 裁决门：结构收敛 + 行为零变化 ──
  - name: gate
    from_outputs:
      - plan
      - refactor
      - review
    provider: opencode
    model: space-bunny-free
    aggregate: true
    gate: true
    gate_fix_rounds: 1
    gate_fix_validate: "python {tool_root}/scripts/check-ui-spec.py --dir {cwd}/apps/web/src/pages/aps --all && python {tool_root}/scripts/check-ui-geometry.py --dir {cwd}/apps/web/src/pages/aps --all"
    meta_timeout: 2400
    tasks:
      - prompt: |
          你是独立裁决者，只依据下面三份产物与仓库现状判断，不做实现。
          裁决必须回答：
          1) 本轮是否为纯结构重构：逐项核对「API 调用与参数、对外
             props/emits、路由与地址栏参数、权限与 CSRF 流程、i18n key、
             源状态 fail-closed 展示、自动排程 source gate」是否未变。
             **i18n 判定例外**：若本轮确实需要新增文案 key，
             apps/web/src/i18n.ts 在白名单内，按「key 新增数」记账，不得
             一律判为越界（上一轮因白名单漏列把它当成越界回滚，误伤了
             head/middle/tail 的本地化文案）。
          1b) 已知必须保留的 UI 契约：生产起始日使用 **IrisDatePicker**，
             且 head/middle/tail 旧值以本地化文本呈现；自行 grep
             `IrisDatePicker` 与 `lineStartDateHead` 复核。
          2) 确定性门禁：`uicheck`（仓库级）、`uieng`（仓库级）与页面范围的
             `check-ui-geometry.py --dir apps/web/src/pages/aps --all` 是否全绿
             （自行复跑核对）。注意：全前端另有 9 处 HEAD 已有的圆角家族违规，
             分布在 style.css / BsShipTracingPage.css / MoldDetailPage.css /
             SrmSharingPage.css，均为本轮白名单外的存量，不作为本轮判定依据，
             但要在报告中注明仍待清理。
          3) 收敛是否属实：复跑
             `python3 /home/dwp/ai-batch-runner/scripts/check-frontend-quality.py
              --dir apps/web/src/pages/aps --strict --json`
             确认 ApsSettingsPage.tsx 与 settings/ 下不再有 god-file、
             事件处理函数、判断点、嵌套深度违规。
          4) 是否越界：是否改动了白名单之外的文件、ApsSettingsPage.css 的
             视觉、任何 dist/tgz 产物。
          任一条不成立 → 输出 VERDICT: FAIL - <可核对的具体理由>；
          全部成立 → 输出 VERDICT: PASS - <逐条结论 + 关键数字>。
          禁止输出裸 VERDICT: PASS。
        timeout: 2400
        output: .pi-batch/aps-settings/gate.md
        thinking: max
