# sverpweb-stable 项目级 Campaign：自动发现 apps/web 各模块的改进方向
# → 结构化评分 → 在仓库内实现（source-first：iris-ui 组件缺陷不得在此
# 实现，必须路由到 iris-ui 仓库）。
#
# 运行（见 scripts/sverp/run-campaign.sh）：
#   run-campaign.sh sverpweb --dry-run
#   run-campaign.sh sverpweb --max-directions 2 --reuse
#
# 注意：本文件由 run-campaign.sh 同步到仓库内 .pi-batch/sverp/campaign.yaml
# 后执行（campaign 要求配置与 pipeline 模板位于仓库内）。改这里即可。

name: sverpweb-improvements

discovery:
  roots:
    - apps/web/src
  exclude:
    - node_modules
    - dist
    - .git
    - .pi-batch
    - docs
    - testdata
    - generated
    - style.css
  # depth 1 = 顶层模块（components/layouts/pages/router/stores/theme/utils），
  # depth 2 = pages 下的子域（aps/bs-pricing），根级页面文件由 pages 模块覆盖
  max_depth: 2
  fallback_top_level: false

analysis:
  jobs: 4
  retries: 2
  candidate_limit: 3
  prompt: |
    Analyze module '{module}' at {module_path} in this Vue 3.5 ERP web
    application (apps/web, built on @iris-ui-kit/vue component library).
    Return ONLY a JSON array with at most {candidate_limit} high-value
    improvement directions, sorted by value.
    Each object must contain: title, problem, value (1-10),
    risk_reduction (1-10), effort (1-10), confidence (1-10),
    evidence (array of existing file/symbol paths), and acceptance
    (array of testable checks).
    evidence and acceptance MUST be JSON arrays of strings, e.g.:
    {"title": "...", "problem": "...", "value": 7, "risk_reduction": 6, "effort": 2, "confidence": 8,
     "evidence": ["apps/web/src/stores/auth.ts:42"], "acceptance": ["pnpm --filter @sverp/web test passes"]}
    Do not modify code. Claims without repository evidence must be
    identified as proposed, not verified.
    IMPORTANT (source-first discipline): if you find a defect that belongs
    to the iris-ui component library itself (component behavior/visual/
    interaction bugs of @iris-ui-kit/vue — e.g. NavMenu, Table, Modal,
    Form), do NOT propose it as a direction here. Instead append a line
    after the JSON array starting with "IRIS-UI-FINDINGS:" followed by a
    JSON array of {title, problem, evidence} for those library defects.
    Those will be routed to the iris-ui repository for source fixes.
    Directions here must be implementable in sverpweb-stable sources only.

selection:
  max_directions: 2
  minimum_score: 0

implementation:
  pipeline: .pi-batch/sverp/campaign-pipeline.yaml
  requirement_stage: requirements
  concurrency: 1
  # 每个方向流水线总墙钟截止（前端全门禁 build 较慢）
  timeout: 14400
  worktree_root: .pi-batch/worktrees

state:
  output_dir: .pi-batch/campaign
  state_file: .pi-batch/campaign/state.jsonl
  summary_file: .pi-batch/campaign/SUMMARY.md
  line_max_bytes: 262144

estimates:
  analysis_minutes: 3
  pipeline_minutes: 25
