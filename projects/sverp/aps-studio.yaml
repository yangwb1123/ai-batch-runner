schema_version: studio/v1
name: sverp-aps-design-ledger
brief: >-
  Source-first design and staged implementation of APS as a composable
  production-planning system: sales demand, steel plans, operation schedules,
  daily arrangements, execution facts, material/resource constraints,
  exceptions, inventory and shipment projections.
constraints:
  - Preserve sourceStatus and distinguish unknown from zero
  - Do not replace ERP, MES/scan, WMS, EAM/TPM, QA or logistics authority
  - Every production fact is corrected or reversed, never physically deleted
  - Published commands require permission, CSRF, version, idempotency and audit
  - Source-supported behavior only; proposals remain explicitly proposed
artifacts:
  - id: requirements
    type: requirements
    path: docs/aps/design/requirements.json
    required: [goal, personas, flows, data_sources, permissions, failure_paths, acceptance, non_goals]
  - id: product
    type: product_model
    path: docs/aps/design/product.json
    required: [scope, user_journeys, modes, state_models, non_goals]
  - id: domain
    type: domain_model
    path: docs/aps/design/domain.json
    required: [bounded_contexts, entities, relationships, invariants, state_machines]
  - id: ux
    type: ux_spec
    path: docs/aps/design/ux.json
    required: [routes, information_architecture, interactions, view_states, permissions]
  - id: architecture
    type: architecture
    path: docs/aps/design/architecture.json
    required: [modules, dependency_direction, aggregates, projections, integration_ports, decisions]
  - id: data
    type: persistence_model
    path: docs/aps/design/data.json
    required: [tables, keys, quantities, indexes, constraints, history, migration]
  - id: technology
    type: technology_decisions
    path: docs/aps/design/technology.json
    required: [decisions, alternatives, rejected_options, compatibility, rollback]
  - id: api
    type: api_contract
    path: docs/aps/design/api.json
    required: [queries, commands, errors, versions, idempotency, permissions, audit]
  - id: implementation
    type: implementation_plan
    path: docs/aps/design/implementation.json
    required: [waves, dependencies, acceptance_matrix, change_budget, rollback]
  - id: validation
    type: validation_matrix
    path: docs/aps/design/validation.json
    required: [invariants, contract_tests, permission_tests, source_tests, acceptance]
stages:
  - id: requirements
    role: requirement
    artifacts: [requirements]
    effort: 45
  - id: product
    role: product
    artifacts: [product]
    depends_on: [requirements]
    effort: 40
  - id: domain
    role: domain
    artifacts: [domain]
    depends_on: [requirements]
    effort: 60
  - id: ux
    role: ux_designer
    artifacts: [ux]
    depends_on: [requirements, product]
    effort: 60
  - id: architecture
    role: architecture
    artifacts: [architecture]
    depends_on: [domain]
    effort: 60
  - id: data
    role: data
    artifacts: [data]
    depends_on: [domain, architecture]
    effort: 60
  - id: technology
    role: architecture
    artifacts: [technology]
    depends_on: [architecture, data]
    effort: 35
  - id: api
    role: api
    artifacts: [api]
    depends_on: [domain, architecture, data]
    effort: 50
  - id: implementation
    role: planning
    artifacts: [implementation]
    depends_on: [requirements, product, domain, ux, architecture, data, technology, api]
    effort: 45
  - id: validation
    role: testing
    artifacts: [validation]
    depends_on: [implementation]
    effort: 40
gates: []
