            apps/web/src/pages/aps/components/ApsPlanReadinessDialog.tsx（嵌套 6）
            apps/web/src/pages/aps/components/autoDistribute.ts（嵌套 5）
          本任务只把内联三元/条件渲染链提成具名函数或同目录子组件，把深层嵌套
          拍平。**不要**顺手重构它们的其它结构。
          通用硬约束：对外 props/emits/渲染结构不变；逐字保留 api 调用与参数；
          QR 内容、时间轴数据、readiness 检查项与文案逐字保留；不改 i18n key
          集合；不改任何 .css；不碰 settings/；缺陷只记录不修；不引入新依赖；
          不 commit。
          收敛目标：四个文件嵌套深度均 <= 4。
          结束时附上 `completion_report` 代码块（字段与缩进逐字照抄）：
          ```yaml
          completion_report:
            summary: 一句话说明本任务做了什么
            changed_files:
              - apps/web/src/pages/aps/components/ApsPhaseQrDialog.view.tsx
            commands_executed:
              - command: pnpm --filter @sverp/web test
                result: passed
            not_executed:
              - check: 浏览器人工验收
                reason: 本轮无浏览器环境
            residual_risks:
              - 尚未收敛的指标及其原因
            assumptions:
              - 收敛数字的复核口径（哪条命令、哪个阈值）
          ```
        timeout: 3600
        output: .pi-batch/aps-refactor/refactor-nesting-group.md
        thinking: max
        validate: completion

  # ── 3. 对抗审查：结构与行为等价性复核 ──
  - name: review
    from_outputs: refactor
    provider: opencode
    orchestrator_provider: opencode
    worker_provider: opencode
    orchestrator_model: space-bunny-free
    worker_model: space-bunny-free
    meta: true
    meta_timeout: 3600
    meta_role_retries: 1
    meta_max_failed_roles: 1
    role_dir: prompts
    role_keywords: pbatch/role_keywords.yaml
    output_dir: .pi-batch/aps-refactor/reviews
    max_iterations: 2
    max_roles_per_iteration: 3
    relevance_enabled: true
    relevance_min_score: 2
    mode: serial

  # ── 4. 裁决门：结构收敛 + 行为零变化 ──
  - name: gate
    from_outputs:
      - plan
      - refactor
      - review
    provider: opencode
    model: space-bunny-free
    aggregate: true
    gate: true
    gate_fix_rounds: 1
    gate_fix_validate: "python {tool_root}/scripts/check-ui-spec.py --dir {cwd}/apps/web/src/pages/aps --all && python {tool_root}/scripts/check-ui-geometry.py --dir {cwd}/apps/web/src/pages/aps --all"
    meta_timeout: 2400
    tasks:
      - prompt: |
          你是独立裁决者，只依据下面三份产物与仓库现状判断，不做实现。
          裁决必须逐条回答，任何一条不成立即 FAIL：

          1) **纯结构重构**：用 `git show HEAD:<file>` 与工作树逐项 diff 核对
             下列契约是否未变——api 调用路径/方法/参数对象字段顺序；组件
             props/emits 归一化后是否逐字一致；权限 `rejectReadOnly`/`canWrite`
             与 CSRF 缺失分支；版本号并发校验；源状态 fail-closed 展示（未知/
             不可用不得显示为空或 0）；自动排程 source gate 与 degraded 分支；
             轮询周期与 fullscreen 失败提示；地址栏参数读写语义。
          2) **i18n**：key 集合与 HEAD 的差异必须逐条有理由；只允许新增页面确实
             需要的 key，且 5 个 locale 同步。禁止删除既有 key。
          3) **确定性门禁**（自行复跑，不采信上游报告）：
             - `python3 /home/dwp/ai-batch-runner/scripts/check-ui-spec.py --dir apps/web/src --all --json`
             - `python3 /home/dwp/ai-batch-runner/scripts/check-frontend-quality.py --dir apps/web/src --json`
             - `python3 /home/dwp/ai-batch-runner/scripts/check-ui-geometry.py --dir apps/web/src/pages/aps --all --json`
             - `pnpm --filter @sverp/web typecheck`
             - `pnpm --filter @sverp/web test`
             - `python3 /home/dwp/ai-batch-runner/scripts/check-i18n.py --root . --base HEAD`
          4) **收敛属实**：复跑
             `check-frontend-quality.py --dir apps/web/src/pages/aps --strict --json`，
             确认四个路由页面源码 + components/ + phase-schedule/ 下不再有
             god-file / 事件处理函数 / 判断点 / 嵌套深度 / api 调用数违规。
             **允许残留并记账**（不算 FAIL）：`__testkit__/kit.ts`、
             `__testkit__/fixtures.ts`、`__testkit__/kit.test.tsx` 与
             10 个 >400 行的测试文件；以及仓库级 geometry 的 9 处 HEAD 存量
             （style.css / BsShipTracingPage.css / MoldDetailPage.css /
             SrmSharingPage.css，本轮未改动）。
          5) **未越界**：不得改动 `apps/web/src/pages/aps/settings/**`、任何
             `.css`、任何 dist/tgz；不得 commit（`git log -1` 仍为 367c987）。
          6) **缺陷诚实性**：`.pi-batch/aps-refactor/deferred-defects.md` 存在，
             且如实记录了重构中发现但未修的缺陷，没有把缺陷"顺手修掉"后宣称
             零行为变化。
          输出格式：首行必须是 `VERDICT: PASS - <理由>` 或
          `VERDICT: FAIL - <可核对的具体理由>`，禁止裸 VERDICT，禁止把
          VERDICT 写在 markdown 标题里（`# VERDICT:` 不会被解析）。
        timeout: 2400
        output: .pi-batch/aps-refactor/gate.md
        thinking: max