# APS 四个路由页面的结构优化流水线（settings 页已单独完成，本轮不碰）。
#
#   /prod/schedule/plan         → apps/web/src/pages/aps/ApsPlanPage.tsx
#   /prod/schedule/statistics   → apps/web/src/pages/aps/ApsStatisticsPage.tsx
#   /prod/schedule/feasibility  → apps/web/src/pages/aps/ApsFeasibilityBoardPage.tsx
#   /prod/schedule/view         → apps/web/src/pages/aps/ApsViewPage.tsx
#   （共用）                    → apps/web/src/pages/aps/components/**、phase-schedule/**
#
# 目标：只做结构性重构，把 god-file / 事件处理函数 / 判断点 / 嵌套深度 / api 调用数
# 收敛到阈值内，同时**零行为变化**。确定性 UI 规范门禁当前是 0 违规，因此本轮
# 不做视觉改版、不改 CSS、不新增硬编码文案。
#
# 范围白名单（超出即越界，必须拒绝并如实上报）：
#   apps/web/src/pages/aps/ApsPlanPage.tsx
#   apps/web/src/pages/aps/ApsStatisticsPage.tsx
#   apps/web/src/pages/aps/ApsFeasibilityBoardPage.tsx
#   apps/web/src/pages/aps/ApsViewPage.tsx
#   apps/web/src/pages/aps/components/**
#   apps/web/src/pages/aps/phase-schedule/**
#   apps/web/src/i18n.ts                        ← 仅当页面确实缺少文案时新增 key
#   apps/web/src/pages/aps/__testkit__/kit.ts  ← 仅当测试需要新的 Iris 桩
# 新拆分出的模块必须与被拆文件同目录。
#
# 明确排除（本轮不动，已在 gate 判据里作为「允许残留」记账）：
#   apps/web/src/pages/aps/settings/**   ← 上一轮已归零，再动就是无谓churn
#   apps/web/src/pages/aps/**/*.css      ← 视觉不动
#   __testkit__/fixtures.ts、kit.ts、kit.test.tsx 与 10 个 >400 行的测试文件
#     ← 测试基建/测试代码不是运行时复杂度；一次拆 30+ 测试文件的风险高于收益
#
# provider/model：项目级 pi-batch.yaml 的 default_model 为空会落到余额为 0 的
# provider（insufficient_user_quota），且 provider breaker 会按 provider 分区
# 记账。改之前必须实测：
#   pi auth check --provider opencode
#   pi --provider opencode --model space-bunny-free --thinking max \
#     -p "reply with the single word OK"
#
# thinking=max 只能落到任务级（schema 只支持 task.thinking；stage 级与 meta 角色
# 拿不到，AGENT_THINKING_OVERRIDE 恒为空），所以 9 个重构任务与 gate 显式
# max，plan 与 review 角色用 agent 默认。
#
# 运行（必须从 sverpweb-stable 仓库根执行）：
#   cd /home/dwp/workspace/job/sverpweb-stable
#   PBATCH_SCRIPT_DIR="$PWD" python3 /home/dwp/ai-batch-runner/pi-batch.py \
#     /home/dwp/ai-batch-runner/projects/sverp/aps-refactor-pipeline.yaml \
#     --retries 2 --log-file logs/aps-refactor.log

git_commit: false
decision_log: docs/auto/DECISIONS.md

stages:
  # ── 1. 计划：复核确定性清单，给出逐文件拆分方案 ──
  - name: plan
    provider: opencode
    model: space-bunny-free
    from_prompt: |
      你是 sverpweb-stable（Vue 3.5 + @iris-ui-kit/vue 0.2.52 ERP 前端，
      apps/web/src）的重构规划者。本轮只优化 APS 的四个路由页面
      （ApsPlanPage / ApsStatisticsPage / ApsFeasibilityBoardPage / ApsViewPage）
      及其共用 components/ 与 phase-schedule/ 的**代码结构**，不改业务行为、
      接口契约或路由。settings/ 已单独完成，本轮禁止触碰。

      先自行复核确定性清单（命令在仓库根执行）：
        python3 /home/dwp/ai-batch-runner/scripts/check-frontend-quality.py \
          --dir apps/web/src/pages/aps --strict --json
        python3 /home/dwp/ai-batch-runner/scripts/check-ui-spec.py \
          --dir apps/web/src/pages/aps --all --json
        python3 /home/dwp/ai-batch-runner/scripts/check-ui-geometry.py \
          --dir apps/web/src/pages/aps --all --json

      待收敛的源文件（复核后以你的结果为准；settings/ 下的 0 违规是上一轮成果）：
        ApsPlanPage.tsx                    3354 行 / 10 handlers / 34 api / 98 判断点 / 嵌套 15
        components/ApsArrangedPlanDialog.tsx 1513 行 / 9 handlers / 9 api / 91 判断点 / 嵌套 10
        ApsStatisticsPage.tsx              1372 行 / 8 api / 35 判断点 / 嵌套 14
        components/ApsDetailedBoard.tsx    1153 行 / 20 api / 45 判断点 / 嵌套 5
        ApsFeasibilityBoardPage.tsx        976 行 / 9 handlers / 嵌套 12
        ApsViewPage.tsx                    767 行
        phase-schedule/ApsPlanPhaseScheduleDialog.tsx 508 行 / 嵌套 6
        components/dailyFinishBreakdown.ts 401 行 / 8 api
        嵌套专项（4 个文件）：components/ApsLineScheduleDialog.tsx(5)、
          components/ApsPhaseQrDialog.tsx(5)、components/ApsPlanReadinessDialog.tsx(6)、
          components/autoDistribute.ts(5)

      输出逐文件方案（markdown），每个文件写清：
        1. 拆分边界：新文件路径 + 单一职责 + 导出面（组件的 props/emits/渲染
           结构必须让调用方**一行都不用改**）。
        2. 迁出的具体符号（api 调用层 / 计算属性 / 事件处理函数 / 纯函数 /
           列定义 / 子组件），以及行为等价的判据。
        3. 收敛目标数字与手段（把内联箭头函数收敛为已声明 handler、把 render
           里的三元链提成具名函数、把大 JSX 块提成子组件、把 api 调用集中到
           一个 loader 模块）。
        4. 风险与验证：依赖哪些现有测试证明行为未变。
        5. 明确不做：不改 API 调用与参数、不改 props/emits、不改 i18n key、
           不改任何 CSS、不碰 settings/、不引入新依赖、不 commit；
           发现真实缺陷只记录不修（写到 .pi-batch/aps-refactor/deferred-defects.md）。
      方案必须能被逐任务独立执行，每个任务只碰一个源文件。
    output: .pi-batch/aps-refactor/plan.md

  # ── 2. 重构：逐文件串行，一任务一源文件 ──
  - name: refactor
    from_outputs: plan
    provider: opencode
    model: space-bunny-free
    mode: serial
    validate: uicheck,uieng
    validate_cmd: apsgeometry
    commands:
      - pnpm --filter @sverp/web typecheck
      - pnpm --filter @sverp/web test
    command_timeout: 2400
    tasks:
      - prompt: |
          你是重构执行者。阅读 {input_content}（方案）与
          apps/web/src/pages/aps/ApsPlanPage.tsx。
          本任务只拆**数据/状态层**：把 34 处 api 调用、请求参数组装、加载与
          刷新流程、派生计算迁到同目录的新模块（如 ApsPlanPage.data.ts /
          useApsPlanPageState.ts），让源文件只留渲染与装配。
          通用硬约束（下面每个任务都适用，逐条遵守）：
          - 对外 props/emits/渲染结构不变；调用方 ApsViewPage 等不需改动；
          - 逐字保留每个 api 调用的路径、方法、参数对象与字段顺序；
          - 逐字保留权限/CSRF 流程：`rejectReadOnly`、`canWrite`、CSRF token
            缺失时的分支、版本号并发校验；
          - 逐字保留源状态 fail-closed 展示：源状态未知/不可用不得显示成空或 0；
          - 逐字保留自动排程 source gate 与 degraded 分支；
          - 不改 i18n key 集合（确需新文案才动 apps/web/src/i18n.ts 并同步 5 locale）；
          - 不改任何 .css；不碰 apps/web/src/pages/aps/settings/**；
          - 发现真实缺陷**只记录**到 .pi-batch/aps-refactor/deferred-defects.md，
            不要顺手修——本轮承诺零行为变化；
          - 不引入新依赖；不 git commit。
          收敛目标：api 调用数 <= 5、判断点 <= 30、事件处理函数 <= 8。
          结束时附上 `completion_report` 代码块（字段与缩进逐字照抄）：
          ```yaml
          completion_report:
            summary: 一句话说明本任务做了什么
            changed_files:
              - apps/web/src/pages/aps/ApsPlanPage.data.ts
            commands_executed:
              - command: pnpm --filter @sverp/web test
                result: passed
            not_executed:
              - check: 浏览器人工验收
                reason: 本轮无浏览器环境
            residual_risks:
              - 尚未收敛的指标及其原因
            assumptions:
              - 收敛数字的复核口径（哪条命令、哪个阈值）
          ```
        timeout: 3600
        output: .pi-batch/aps-refactor/refactor-plan-data.md
        thinking: max
        validate: completion

