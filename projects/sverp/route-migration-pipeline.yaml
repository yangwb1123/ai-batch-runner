# sverpweb-stable 路由迁移流水线：按 docs/route-migration.md 把参考项目
# （/home/dwp/workspace/job/sverpweb，ant-design-vue + MSSQL）的路由组
# 迁移到 stable（@iris-ui-kit/vue + Hono BFF + SQLite）。
#
# 运行（在 sverpweb-stable 仓库根目录）：
#   python /home/dwp/ai-batch-runner/pi-batch.py \
#     /home/dwp/ai-batch-runner/projects/sverp/route-migration-pipeline.yaml \
#     -p "<路由组：如 erp/bs/ship — /order-ship-tracing>" \
#     --retries 2 --log-file logs/route-migration.log
#
# 每个路由的完成标准（docs/route-migration.md）：共享类型、SQLite 持久化 +
# 演示数据、BFF 权限边界、Iris UI 页面、测试、Snaplink 权限菜单（seed +
# demo 权限目录）、本机验收（typecheck/test/build）。

git_commit: false
decision_log: docs/auto/DECISIONS.md

stages:
  # ── 1. 计划：读参考实现 + stable 既有模式 → 迁移方案 ──
  - name: plan
    from_prompt: |
      You are the migration planner for sverpweb-stable (Vue 3.5 + TSX +
      @iris-ui-kit/vue + Hono BFF + SQLite). Migrate this route group from
      the reference project: "{prompt}"

      READ the reference implementation (business spec, UI is ant-design-vue
      there — that is the SPEC, not the code to copy):
      - Reference repo root: /home/dwp/workspace/job/sverpweb
      - Reference route table: /home/dwp/workspace/job/sverpweb/apps/web/src/router/routes.ts
      - Reference pages: /home/dwp/workspace/job/sverpweb/apps/web/src/pages/...
      - Reference API: /home/dwp/workspace/job/sverpweb/apps/api/src/modules/...
      - Reference seed: /home/dwp/workspace/job/sverpweb/apps/api/src/seed-routes.ts

      READ the stable migration patterns (imitate these exactly):
      - apps/api/src/quality/{store,sqlite-store}.ts and
        apps/api/src/routes/quality-inspections.ts  (vertical slice)
      - apps/api/src/aps/* and apps/api/src/routes/aps.ts
      - apps/api/src/bs-pricing/* and apps/api/src/routes/bs-standard-pricing.ts
      - packages/types/index.ts (shared contracts live here)
      - apps/web/src/pages/QualityInspectionPage.tsx (Iris UI page pattern)
      - apps/api/src/app.ts (router registration + DI),
        apps/api/src/auth/demo.ts (menu + permission catalog),
        apps/api/src/system-routes/built-in-definitions.ts (menu seed),
        apps/web/src/router/routes.ts (APP_ROUTES + RUNTIME_ROUTE_TEMPLATES),
        apps/web/src/router/navigation.ts (menu → route mapping)

      Produce a migration plan covering EVERY route in the group:
      - route key / path / title / icon / permission (permission codes follow
        the existing catalog style, e.g. erp:bs:ship:read)
      - shared types to add to packages/types/index.ts
      - API endpoints with zod schemas + store interface + SQLite schema +
        demo data (follow the SQLite + demo data pattern of quality/aps/
        bs-pricing; the reference MSSQL access is NOT portable — replicate
        business logic with SQLite persistence and demo data)
      - Iris UI page structure (which @iris-ui-kit/vue components)
      - test plan (api store tests + route tests, web tests)
      - registration changes: app.ts, routes.ts, built-in-definitions.ts,
        auth/demo.ts, navigation.ts, docs/route-migration.md status
      List the exact files to create/modify. Do NOT write code yet.
    output: .pi-batch/sverp/route-plan.md

  # ── 2. 实现：全栈垂直切片 + 门禁 ──
  - name: implement
    from_outputs: plan
    validate: |
      bash /home/dwp/ai-batch-runner/scripts/sverp/check-no-dist-edit.sh {cwd},
      bash /home/dwp/ai-batch-runner/scripts/sverp/check-sverpweb.sh {cwd}
    tasks:
      - prompt: |
          You are the code implementer for sverpweb-stable. Read
          {input_content} (the migration plan) and docs/route-migration.md.
          Implement the ENTIRE route group end-to-end:
          1. packages/types/index.ts — shared contracts
          2. apps/api/src/<domain>/{store,sqlite-store}.ts — store interface
             + SQLite implementation with demo data seeding (imitate
             apps/api/src/quality/* and apps/api/src/bs-pricing/*)
          3. apps/api/src/routes/<domain>.ts — Hono router with zod
             validation, requireSession/requirePermission/requireCSRF
             middleware, audit events (imitate routes/quality-inspections.ts)
          4. apps/api/src/app.ts — register the router in DI + route()
          5. apps/web/src/pages/<...> — Iris UI pages (TSX, Vue defineComponent
             + @iris-ui-kit/vue components ONLY, no ant-design-vue; follow
             apps/web/src/pages/QualityInspectionPage.tsx patterns: http.ts
             client, stores, tokens)
          6. apps/web/src/router/routes.ts — APP_ROUTES entries +
             RUNTIME_ROUTE_TEMPLATES lazy imports
          7. apps/api/src/system-routes/built-in-definitions.ts — menu seed
             entries; apps/api/src/auth/demo.ts — menu + permission catalog
             entries
          8. Tests: apps/api store tests + router tests (bun test), web
             tests where meaningful (vitest)
          9. Update docs/route-migration.md: mark migrated routes [x] or [~]
             with the same evidence style as existing entries.
          Reference pages (ant-design-vue) are the business spec — port
          behavior/columns/interactions to Iris UI equivalents. Data must be
          SQLite + demo data, NOT MSSQL.
          Then run until green:
            pnpm --filter @sverp/api typecheck && pnpm --filter @sverp/api test
            pnpm --filter @sverp/web typecheck && pnpm --filter @sverp/web test
            pnpm --filter @sverp/web build
          Do NOT commit. Return a change report: per-route files/symbols,
          tests, command results, deviations with reasons, and the updated
          route-migration.md statuses.
        timeout: 2400
        output: .pi-batch/sverp/route-impl.md

  # ── 3. 对抗审查 ──
  - name: review
    from_outputs: implement
    meta: true
    meta_timeout: 2400  # 复杂页面审查（多页签/大组件）1500s 不够（G2 教训）
    role_dir: prompts
    role_keywords: pbatch/role_keywords.yaml
    output_dir: .pi-batch/sverp/reviews
    max_iterations: 2
    max_roles_per_iteration: 3
    relevance_enabled: true
    relevance_min_score: 2
    mode: serial

  # ── 4. 裁决门 ──
  - name: gate
    from_outputs:
      - plan
      - implement
      - review
    aggregate: true
    gate: true
    mode: serial
    tasks:
      - prompt: |
          You are the migration gatekeeper. Read {input_content} (plan,
          implementation report, reviews) and docs/route-migration.md.
          Verify for EVERY route in the group: shared types exist, API +
          SQLite store + demo data exist, Iris UI page exists and uses only
          @iris-ui-kit/vue, permissions + menu seed registered, tests added,
          route-migration.md updated, all gates passed (api typecheck/test,
          web typecheck/test/build). Cross-check review findings are
          resolved. Output on the last line:
          VERDICT: PASS - <why the migration is complete>
          or VERDICT: FAIL - <blocking issues>.
        output: .pi-batch/sverp/route-gate.md
