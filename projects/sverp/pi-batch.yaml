# sverp 的门禁声明
#
# source of truth 是目标仓自己的 AGENTS.md / README / package.json。这里只**调用**
# 目标仓的门禁，绝不在运行器里复制一份。validator 在目标仓的 cwd 下执行。
#
# campaign / pipeline 的 implement 阶段只允许引用 repo-gate：checks/project_gates.py
# 会断言这一点。
#
# 依据：README.md §验证：pnpm check（另 build / typecheck / test / check:committed）
# 备注：本仓无 AGENTS.md，权威是 README 与 apps/web/package.json 的 scripts。
# 仓库性质：sverp 的流水线是 UI 专项（uicheck/uigeometry/uieng），那些是**产物**检查，不是“是否接受这次改动”的门禁；因此
#       保留在项目注册表里由项目声明，而不是借用运行器注册表。
project:
  target_repo: "~/workspace/job/sverpweb-stable"

agent:
  bin: pi
  default_timeout: 1800
  default_workers: 1

validators:
  repo-gate:
    cmd: "pnpm check"
  # 诚实完成报告（工具提供的脚本）：APS 重构轮每个任务都要求产物带完成报告，
  # 由本项目声明引用（不是运行器的全局条目）
  completion: "python {tool_root}/scripts/check-completion-report.py {output}"
  # UI 产物检查：工具提供的脚本，由本项目声明引用（不是运行器的全局条目）
  uicheck: "python {tool_root}/scripts/check-ui-spec.py --dir {cwd}/src --all --json"
  uigeometry: "python {tool_root}/scripts/check-ui-geometry.py --dir {cwd}/src --all --json"
  # APS 页面范围的几何检查：与 uigeometry 同一条规则，只扫本轮允许改动的目录，
  # 所以范围写进声明而不是写进流水线的内联命令（pipeline 的 validate 字段
  # 只接受项目已声明的校验器名）
  apsgeometry: "python {tool_root}/scripts/check-ui-geometry.py --dir {cwd}/apps/web/src/pages/aps --all --json"
  uieng: "python {tool_root}/scripts/check-frontend-quality.py --dir {cwd}/src --strict --json"
