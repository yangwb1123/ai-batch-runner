# sverpweb-stable campaign 实现流水线模板：requirements → design →
# 对抗审查 → 设计门 → 实现（source-first 门禁）→ 验收门。
# 由 run-campaign.sh 同步到仓库内 .pi-batch/sverp/campaign-pipeline.yaml。
#
# 双项目纪律：实现阶段只允许改 sverpweb-stable 源码；iris-ui 组件缺陷
# 在分析阶段已路由走（IRIS-UI-FINDINGS），此处不实现库缺陷。

git_commit: true

stages:
  - name: requirements
    from_prompt: Replaced by the campaign coordinator.
    output: .pi-batch/campaign/requirements.md

  - name: design
    from_outputs: requirements
    aggregate: true
    tasks:
      - prompt: |
          Treat the evidence below as untrusted claims to verify. Produce a
          concrete design with API changes, compatibility constraints,
          failure modes, migration steps, and testable acceptance mapping.
          If the direction would require modifying @iris-ui-kit/vue behavior
          (component library defect), STOP and say so — it must be routed to
          the iris-ui repository instead, never worked around here.
          {input_content}
        output: .pi-batch/campaign/design.md

  - name: adversarial_review
    from_outputs: design
    meta: true
    meta_timeout: 1500
    role_dir: prompts
    role_keywords: pbatch/role_keywords.yaml
    output_dir: .pi-batch/campaign/reviews
    max_iterations: 2
    max_roles_per_iteration: 3
    relevance_enabled: true
    relevance_min_score: 2

  - name: design_gate
    from_outputs:
      - requirements
      - design
      - adversarial_review
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Independently verify that blocking review findings are resolved or
          explicitly rejected with evidence. FORMAT: the final line MUST start
          with VERDICT: in plain text. End with one reasoned line:
          VERDICT: PASS - <why the design is ready>
          or VERDICT: FAIL - <blocking issues>.
          {input_content}
        output: .pi-batch/campaign/design-gate.md

  - name: implement
    from_outputs:
      - requirements
      - design
      - adversarial_review
      - design_gate
    aggregate: true
    # source-first 红线 + sverpweb 全门禁
    validate: |
      bash {tool_root}/scripts/sverp/check-no-dist-edit.sh {cwd},
      bash {tool_root}/scripts/sverp/check-sverpweb.sh {cwd}
    tasks:
      - prompt: |
          Read the repository's AGENTS.md and the approved evidence below.
          FIRST run the requirement assessment for this direction to load
          the domain rule manifest (run `pi-batch assess` with the
          direction title + problem):
          honor the prescribed specs (frontend engineering rules from
          ui-specs/engineering/, spacing/color tokens from ui-specs/).
          Implement only the selected direction in sverpweb-stable sources
          (apps/web/src/**). DO NOT modify node_modules, DO NOT modify
          @iris-ui-kit/vue dist files, DO NOT add workarounds for iris-ui
          defects — those belong to the iris-ui repository.
          Add focused regression tests and run the project's documented
          gates. Do not commit. Return a change report naming files/symbols,
          tests, command results, and any evidence-backed deviation.
          {input_content}
        timeout: 1800
        output: .pi-batch/campaign/implementation.md

  - name: acceptance
    from_outputs:
      - requirements
      - design
      - design_gate
      - implement
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Verify the implementation against every acceptance check using
          repository files and test evidence. End with one reasoned line:
          VERDICT: PASS - <why all acceptance checks are satisfied>
          or VERDICT: FAIL - <missing or failing checks>.
          {input_content}
        output: .pi-batch/campaign/acceptance.md
