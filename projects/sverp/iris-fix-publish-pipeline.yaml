# 单问题修复流水线：sverpweb-stable 使用中发现的 iris-ui 组件缺陷
# → 在 iris-ui 源码修复 → 门禁 → 对抗审查 → 裁决门。
#
# 运行（在 iris-ui 仓库根目录）：
#   python /home/dwp/ai-batch-runner/pi-batch.py projects/sverp/iris-fix-publish-pipeline.yaml \
#     -p "<问题描述：组件/页面/复现路径/期望行为>" --retries 3 \
#     --log-file logs/iris-fix.log
#
# 流水线只做：定位 → 源码修复 → 验证（不含发布）。发布与 sverpweb-stable
# 依赖升级由 scripts/sverp/iris-publish.sh 在 gate PASS 后执行。
#
# 若问题实际属于 sverpweb-stable 业务代码（非 iris-ui 组件缺陷），
# 修复阶段必须明确输出 "ROUTED-TO-SVERPWEB" 并停止。

git_commit: false
decision_log: docs/auto/DECISIONS.md

stages:
  # ── 1. 诊断：定位问题归属与根因（只读，不改代码）──
  - name: diagnose
    from_prompt: |
      You are investigating a defect report in sverpweb-stable that is
      suspected to be an iris-ui component library issue:
      "{prompt}"
      Determine ownership FIRST:
      - If the defect is in @iris-ui-kit/vue component behavior/visual/
        interaction (NavMenu, Table, Modal, Form, layout, tokens...),
        locate the root cause in packages/vue/src/** source files.
        Produce: root cause (file:line), affected components, reproduction
        path in sverpweb-stable usage, expected vs actual behavior.
      - If the defect is actually sverpweb-stable business logic (store/
        router/page assembly/API layer), output a single line
        "ROUTED-TO-SVERPWEB: <reason>" and stop — do not modify iris-ui.
      - If the root cause is unclear, propose the minimal reproduction
        case to build.
      Output a diagnosis report. Do NOT modify any files yet.
    output: .pi-batch/sverp/diagnose.md

  # ── 2. 修复：只改 packages/vue/src/** 源码 ──
  - name: fix
    from_outputs: diagnose
    validate: |
      bash {tool_root}/scripts/sverp/check-no-dist-edit.sh {cwd},
      bash {tool_root}/scripts/sverp/check-iris-vue.sh {cwd}
    tasks:
      - prompt: |
          Read {input_content} (the diagnosis). If it says ROUTED-TO-SVERPWEB,
          stop and repeat that line with the reason. Otherwise implement the
          fix in iris-ui packages/vue/src/** source files ONLY.
          HARD RULES (source-first discipline):
          - Never modify dist/, *.tgz, node_modules — build artifacts are
            generated and never committed.
          - Never touch sverpweb-stable; do not edit its lockfile or
            node_modules to test — rely on the vue package gates below.
          - Preserve the published API (additive changes preferred).
          - Add a regression test in packages/vue/src covering the defect.
          Run: pnpm --filter @iris-ui-kit/vue typecheck && test && build.
          The gates re-verify (build+test) and check no dist artifacts
          appeared. Return a change report with files/symbols, the
          regression test, and command results. Do not commit.
        timeout: 1800
        output: .pi-batch/sverp/fix.md

  # ── 3. 对抗审查（meta 韧性：角色失败自动重试 1 次；允许 1 个角色失败）──
  - name: review
    from_outputs: fix
    meta: true
    meta_timeout: 2400
    meta_role_retries: 1
    meta_max_failed_roles: 1
    role_dir: prompts
    role_keywords: pbatch/role_keywords.yaml
    output_dir: .pi-batch/sverp/reviews
    max_iterations: 2
    max_roles_per_iteration: 3
    relevance_enabled: true
    relevance_min_score: 2
    mode: serial

  # ── 4. 裁决门：PASS 后才允许走发布循环（FAIL 自动修复，最多 2 轮）──
  - name: gate
    from_outputs:
      - diagnose
      - fix
      - review
    aggregate: true
    gate: true
    gate_fix_rounds: 2
    gate_fix_validate: |
      bash {tool_root}/scripts/sverp/check-no-dist-edit.sh {cwd},
      bash {tool_root}/scripts/sverp/check-iris-vue.sh {cwd}
    mode: serial
    tasks:
      - prompt: |
          You are the gatekeeper for an iris-ui library fix. Verify:
          - ownership was correctly determined (library defect, not routed)
          - fix is in packages/vue/src/** only, no dist/tgz artifacts
          - published API preserved (additive), breaking changes flagged
          - regression test added and passing
          - gates passed (typecheck + test + build)
          Output on the last line:
          VERDICT: PASS - <why the fix is ready to release>
          or VERDICT: FAIL - <blocking issues>.
          On FAIL, append a structured findings block:
          ```json
          [{"severity": "high", "file": "<path>", "line": <n>,
            "problem": "...", "fix_hint": "..."}]
          ```
          {input_content}
        output: .pi-batch/sverp/gate.md
