# iris-ui campaign 实现流水线模板：requirements → design → 对抗审查 →
# 设计门 → 实现（source-first 门禁：只改 packages/vue/src/**，禁止 dist）→
# 验收门。由 run-campaign.sh 同步到仓库内 .pi-batch/sverp/campaign-pipeline.yaml。
#
# 发布循环不在本流水线内（版本 bump / npm publish / sverpweb-stable 升级
# 由 scripts/sverp/iris-publish.sh 完成）。

git_commit: true

stages:
  - name: requirements
    from_prompt: Replaced by the campaign coordinator.
    output: .pi-batch/campaign/requirements.md

  - name: design
    from_outputs: requirements
    aggregate: true
    tasks:
      - prompt: |
          Treat the evidence below as untrusted claims to verify. Produce a
          concrete design with API changes, compatibility constraints
          (the published @iris-ui-kit/vue API is consumed by
          sverpweb-stable at exact versions — prefer additive changes),
          failure modes, migration steps, and testable acceptance mapping.
          {input_content}
        output: .pi-batch/campaign/design.md

  - name: adversarial_review
    from_outputs: design
    meta: true
    meta_timeout: 1500
    role_dir: prompts
    role_keywords: pbatch/role_keywords.yaml
    output_dir: .pi-batch/campaign/reviews
    max_iterations: 2
    max_roles_per_iteration: 3
    relevance_enabled: true
    relevance_min_score: 2

  - name: design_gate
    from_outputs:
      - requirements
      - design
      - adversarial_review
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Independently verify that blocking review findings are resolved or
          explicitly rejected with evidence. FORMAT: the final line MUST start
          with VERDICT: in plain text. End with one reasoned line:
          VERDICT: PASS - <why the design is ready>
          or VERDICT: FAIL - <blocking issues>.
          {input_content}
        output: .pi-batch/campaign/design-gate.md

  - name: implement
    from_outputs:
      - requirements
      - design
      - adversarial_review
      - design_gate
    aggregate: true
    # source-first 红线（无 dist/tgz 产物）+ iris-ui vue 包全门禁
    validate: |
      bash {tool_root}/scripts/sverp/check-no-dist-edit.sh {cwd},
      bash {tool_root}/scripts/sverp/check-iris-vue.sh {cwd}
    tasks:
      - prompt: |
          Read the iris-ui repository AGENTS.md (if present) and the approved
          evidence below. Implement only the selected direction in
          packages/vue/src/** source files.
          HARD RULES:
          - Never modify dist/ or *.tgz — build artifacts are generated by
            `pnpm --filter @iris-ui-kit/vue build` and never committed.
          - Never modify node_modules.
          - Preserve the published API (additive changes preferred); breaking
            changes must be flagged [breaking] in the change report.
          - Keep the vue package self-contained; cross-package imports only
            via declared dependencies (@iris-ui-kit/core etc.).
          Add focused regression tests in packages/vue/src (vitest), then run
          the gates: pnpm --filter @iris-ui-kit/vue typecheck && test.
          Do not commit. Return a change report naming files/symbols, tests,
          command results, and any evidence-backed deviation.
          {input_content}
        timeout: 1800
        output: .pi-batch/campaign/implementation.md

  - name: acceptance
    from_outputs:
      - requirements
      - design
      - design_gate
      - implement
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Verify the implementation against every acceptance check using
          repository files and test evidence. Confirm no dist/ artifacts are
          touched and the change is fully in packages/vue/src. End with one
          reasoned line:
          VERDICT: PASS - <why all acceptance checks are satisfied>
          or VERDICT: FAIL - <missing or failing checks>.
          {input_content}
        output: .pi-batch/campaign/acceptance.md
