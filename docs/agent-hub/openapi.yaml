          description: Current durable turn state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/gateway/commands:
    get:
      tags: [Gateway API]
      operationId: pollGatewayCommands
      summary: Poll pending prompt and cancellation commands
      description: >-
        Returns pending commands for the gateway principal's one bound
        instance and current generation. Repeated polls return the same command
        ids until the Gateway reports progress or completion. Prompt commands
        include the prompt; cancel commands set cancel_requested to true and
        have an empty prompt.
      x-principal-kind: gateway
      x-required-scope: agent.gateway:connect
      parameters:
        - $ref: '#/components/parameters/InstanceIdQuery'
        - $ref: '#/components/parameters/GenerationQuery'
      responses:
        '200':
          description: Pending commands for the bound instance generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandListEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/gateway/session-requests:
    get:
      tags: [Gateway API]
      operationId: pollGatewaySessionRequests
      summary: Poll pending session creation commands
      description: >-
        Requires the exact bound instance and its current live generation.
        Returns at most eight pending commands in creation order. Each durable
        local_session_id is allocated by the Hub and survives poll replay and
        Hub restart. No body or additional query parameters are accepted.
      x-principal-kind: gateway
      x-required-scope: agent.gateway:connect
      parameters:
        - $ref: '#/components/parameters/InstanceIdQuery'
        - $ref: '#/components/parameters/GenerationQuery'
      responses:
        '200':
          description: Ordered pending creation commands for this generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRequestCommandEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Gateway API]
      operationId: reportGatewaySessionRequest
      summary: Complete a session creation request
      description: >-
        Requires the exact bound instance and its current live generation.
        A created report atomically registers the expected Hub session using the
        allocated local identity and makes it controllable. No identity or local
        configuration overrides are accepted. Repeating the same terminal report
        is idempotent; conflicting outcomes and replaced generations fail.
        A failed report releases its reservation. Already created sessions keep
        their slots until a separate close request succeeds, or generation takeover. No query parameters are accepted.
      x-principal-kind: gateway
      x-required-scope: agent.gateway:connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSessionRequest'
      responses:
        '200':
          description: Durable terminal result, including an identical report replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRequestEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/gateway/session-close-requests:
    get:
      tags: [Gateway API]
      operationId: pollGatewaySessionCloseRequests
      summary: Poll pending idle close commands
      description: >-
        Requires the exact bound instance and its current live generation.
        Returns up to eight pending commands in creation order with their immutable
        target identities. No body or additional query is accepted. A separate
        bounded worker should close the runtime without blocking heartbeat or work
        on other sessions. Durable local receipts prevent repeated runtime close
        when a report acknowledgment is lost.
      x-principal-kind: gateway
      x-required-scope: agent.gateway:connect
      parameters:
        - $ref: '#/components/parameters/InstanceIdQuery'
        - $ref: '#/components/parameters/GenerationQuery'
      responses:
        '200':
          description: Ordered pending close commands for this generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCloseCommandEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Gateway API]
      operationId: reportGatewaySessionCloseRequest
      summary: Report the actual runtime close outcome
      description: >-
        Requires the exact bound instance and its current live generation. Only
        closed with empty error_code or failed with session_close_failed or
        session_unavailable is accepted. A closed report atomically releases the
        registered session's capacity and sets status closed. Failure sets
        close_failed, keeps its slot and freezes the session until Gateway restart.
        Repeating an identical final report is idempotent; a different outcome
        conflicts with session_request_terminal. Reports for replaced generations
        fail even when their requested result matches a prior result. No identity
        overrides or query parameters are accepted. Existing history is retained.
      x-principal-kind: gateway
      x-required-scope: agent.gateway:connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSessionCloseRequest'
      responses:
        '200':
          description: Durable final result, including an identical report replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCloseRequestEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: This route accepts GET or POST only.
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/gateway/register:
    post:
      tags: [Gateway API]
      operationId: registerGatewayInstance
      summary: Register or resume a gateway process
      description: >-
        The instance_id must match the instance bound to the gateway token.
        Re-registering the same boot_id preserves generation. A different boot
        is rejected while the previous registration is online; after expiry it
        takes over with a greater generation and prior unfinished turns and
        queued creation and close requests become lost. No generation is supplied in this
        request. Omitted or zero session_capacity means unsupported. A Gateway
        can register with zero while publishing initial sessions, then advertise
        its capacity by registering the same boot again. A positive capacity
        cannot be lower than existing registered sessions plus queued requests
        for that generation; zero still disables new creation without deleting
        existing sessions or reservations. Successfully closed sessions no longer occupy
        capacity. session_close_supported defaults to false independently of capacity;
        advertise true only after initial sessions have been adopted.
      x-principal-kind: gateway
      x-required-scope: agent.gateway:connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInstanceRequest'
      responses:
        '200':
          description: Instance record including the current generation and heartbeat timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/gateway/heartbeat:
    post:
      tags: [Gateway API]
      operationId: heartbeatGateway
      summary: Refresh the current generation's online lease
      description: The generation is fenced; an old generation cannot refresh a newer instance registration.
      x-principal-kind: gateway
      x-required-scope: agent.gateway:connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayGenerationRequest'
      responses:
        '200':
          description: Updated instance state and last_seen epoch timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/gateway/sessions:
    post:
      tags: [Gateway API]
      operationId: publishGatewaySession
      summary: Publish or refresh session metadata owned by this gateway
      description: >-
        The gateway may publish only sessions for its authorized instance and
        generation. Old-generation sessions remain read-only after takeover.
        Sessions frozen by a close request also reject ordinary metadata refresh;
        this cannot reopen a session or forge a capacity-releasing close result.
      x-principal-kind: gateway
      x-required-scope: agent.gateway:connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertSessionRequest'
      responses:
        '200':
          description: Current session record with computed online and controllable flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/gateway/events:
    post:
      tags: [Gateway API]
      operationId: publishGatewayEvent
      summary: Append one idempotent session event
      description: >-
        event_id is scoped to the tenant. Reusing it with identical content
        returns the original cursor; changing its content conflicts. Event
        content (session_id, turn_id, kind and payload serialized together)
        is limited to 32 KiB. The bundled Gateway client applies the same
        byte limit to the entire event POST body. Nested sensitive keys such as
        token, password, credential, and private_key are rejected; event text
        is redacted before it is stored. A turn state event must name turn_id.
        On a current-generation session frozen by close, an already stored
        identical event still returns its duplicate acknowledgment. A new event
        fails with session_read_only without changing history or fencing other
        sessions. Wrong owners and old generations still fail with stale_generation.
      x-principal-kind: gateway
      x-required-scope: agent.gateway:connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendEventRequest'
      responses:
        '200':
          description: Stored event, including its persistent cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/devices:
    get:
      tags:
      - Compute API
      operationId: listComputeDevices
      summary: listComputeDevices
      description: >-
        Queries authorized project bindings in bounded Fabric batches. The
        returned rows have a 6 MiB JSON budget; a shorter page can be continued
        using its next cursor. Missing unregistered devices are skipped.
      x-required-scope: agent.devices:read
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
      - name: after
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeDeviceListEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/agent/tasks:
    get:
      tags:
      - Compute API
      operationId: listComputeTasks
      summary: listComputeTasks
      x-required-scope: agent.tasks:read
      parameters:
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
      - name: after
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeTaskListEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/agent/tasks/{task_id}:
    get:
      tags:
      - Compute API
      operationId: getComputeTask
      summary: getComputeTask
      x-required-scope: agent.tasks:read
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeTaskEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/agent/tasks/{task_id}/placement:
    get:
      tags: [Compute API]
      operationId: getComputePlacement
      summary: Inspect current Hub placement filters for a queued task
      description: >-
        Read-only live observation; never reserves resources or retries a task.
        Requires both tasks read on the source instance and devices read. Device
        IDs are filtered before querying Fabric by the original task target set,
        current compute grants and current project bindings. No hidden counts are
        returned. A matching row passes Hub filters only; Fabric performs final
        admission. Non-queued tasks return no devices or cursor without reading
        Fabric. A task state change during inventory discards the observations.
        GET bodies and transfer encoding are rejected. Each page is at most 64 KiB.
      x-principal-kind: user
      x-required-scopes: [agent.tasks:read, agent.devices:read]
      parameters:
      - name: task_id
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 256}
      - name: after
        in: query
        description: Exclusive device ID from next_cursor; empty starts the first page.
        schema: {type: string, maxLength: 256, default: ''}
      - name: limit
        in: query
        description: ASCII decimal integer; no signs, whitespace or duplicate parameters.
        schema: {type: integer, minimum: 1, maximum: 20, default: 20}
      responses:
        '200':
          description: Authorized live placement page, without command or workspace paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputePlacementEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/agent/sessions/{session_id}/tasks:
    post:
      tags:
      - Compute API
      operationId: submitComputeTask
      summary: submitComputeTask
      x-required-scope: agent.tasks:write
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 256
      responses:
        '202':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeTaskEnvelope'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitComputeRequest'
  /api/v1/agent/tasks/{task_id}/cancel:
    post:
      tags:
      - Compute API
      operationId: cancelComputeTask
      summary: cancelComputeTask
      x-required-scope: agent.tasks:cancel
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
      responses:
        '202':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeTaskEnvelope'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
  /api/v1/agent/tasks/{task_id}/reschedule:
    post:
      tags:
      - Compute API
      operationId: rescheduleComputeTask
      summary: Retarget a queued compute task
      description: >-
        Changes only the target selector of a task that is still queued. The
        task actor must retain tasks write access to the source instance. The
        target must belong to the task's original target set, the caller's
        current compute grant and the task project binding. An empty target
        restores automatic placement. This operation is idempotent by desired
        target and never migrates a dispatched or running task.
      x-principal-kind: user
      x-required-scope: agent.tasks:write
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '202':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeTaskEnvelope'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleComputeRequest'
  /api/v1/agent/tasks/{task_id}/retry:
    post:
      tags:
      - Compute API
      operationId: retryLostComputeTask
      summary: Explicitly retry a lost compute task
      description: >-
        Re-admits only a terminal lost task after the caller confirms that the
        remote command may already have run and could be duplicated. The task
        actor must retain tasks write access to the source instance. A target
        is checked against the task's original target set, current compute
        grant and project binding; omitting it preserves an original explicit
        target. Tasks with evidence archiving enabled are rejected to avoid a
        race with immutable archive records. The old Fabric handle is cleared
        and a new request identifier is used. This operation is never automatic.
      x-principal-kind: user
      x-required-scope: agent.tasks:write
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '202':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeTaskEnvelope'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryLostComputeRequest'
  /api/v1/agent/gateway/compute:
    post:
      tags:
      - Compute API
      operationId: delegateComputeTool
      summary: Use an active running turn compute capability
      description: Requires gateway connect plus the requested compute scope. The
        Gateway grant is intersected with the initiating user authority frozen at
        prompt admission. For operation devices, payload accepts only an optional
        after device ID. Device pages contain at most four rows and 60 KiB of JSON,
        with project_ids restricted to the active session project. Continue after
        the last device ID until an empty page to inspect all authorized devices.
        Operation placement requires tasks read and devices read, plus an active
        turn owning the task. Its exact payload is task_id, optional after device
        ID and optional integer limit (1..20); key must be empty. It returns a
        ComputePlacement object using the same filtering as the user endpoint.
        Operation reschedule requires an active turn that owns the queued task,
        accepts task_id and target_device_id, and also requires an empty key; it
        applies the same original-target and current-grant checks as the user endpoint.
        Operation retry requires an active turn that owns a lost task, accepts
        task_id, optional target_device_id and confirm_duplicate=true, and also
        requires an empty key; it applies the same target and archive checks as
        the user endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeDelegationRequest'
      responses:
        '200':
          description: Device array or task object in data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    oneOf:
                    - $ref: '#/components/schemas/ComputeTask'
                    - $ref: '#/components/schemas/ComputePlacement'
                    - $ref: '#/components/schemas/WorkspaceSnapshot'
                    - $ref: '#/components/schemas/WorkspaceOutput'
                    - type: array
                      maxItems: 10
                      items:
                        $ref: '#/components/schemas/WorkspaceSnapshot'
                    - type: array
                      maxItems: 4
                      items:
                        $ref: '#/components/schemas/ComputeDevice'
                required:
                - data
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/integrations/deliveries:
    get:
      tags:
      - Integration API
      operationId: listDeliveries
      summary: List authorized lifecycle delivery receipts
      description: Filtered by tenant and instance grants before monotonic sequence pagination. Failed records
        remain visible without consuming active queue capacity.
      x-principal-kind: user
      x-required-scope: agent.integrations:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: state
        in: query
        schema:
          type: string
          enum:
          - pending
          - sending
          - retrying
          - failed
          - delivered
      responses:
        '200':
          description: Delivery metadata; no prepared request, identity mapping or credential is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationDeliveryListEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/agent/integrations/deliveries/{delivery_id}/retry:
    parameters:
    - name: delivery_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Integration API
      operationId: retryDelivery
      summary: Retry a failed or waiting delivery with its original destination and key
      description: Grants a new bounded attempt budget. Notification retries are refused six days after
        their first attempt. A retry-only caller receives no receipt or event details.
      x-principal-kind: user
      x-required-scope: agent.integrations:retry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: Queued for retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationRetryEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/sessions/{session_id}/snapshots:
    get:
      tags:
      - Compute API
      operationId: listWorkspaceSnapshots
      summary: List ready snapshots of this session
      x-required-scope: agent.tasks:read
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
      - name: after
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSnapshotListEnvelope'
      description: Scoped to the source instance and session.
    post:
      tags:
      - Compute API
      operationId: uploadWorkspaceSnapshot
      summary: Upload a pinned workspace snapshot
      x-required-scope: agent.tasks:write
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 256
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSnapshotEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadWorkspaceRequest'
      description: Maximum HTTP body 576 KiB. Same actor/key/content resumes a pending
        upload. Vault version readback must verify before publication.
  /api/v1/agent/tasks/{task_id}/workspace:
    get:
      tags:
      - Compute API
      operationId: downloadWorkspaceOutput
      summary: Read verified fixed-version task output
      x-required-scope: agent.tasks:read
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: Authorized compute response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceOutputEnvelope'
        default:
          $ref: '#/components/responses/Error'
      description: Only ready archived output is returned. Pending/unavailable output
        returns 409. Does not expose a Vault credential or download URL.

components:
  securitySchemes:
    HubBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque development token
      description: >-
        Production callers obtain a Snaplink access token for the Agent Hub
        resource audience. The Hub verifies the pinned issuer and signing keys,
        expiration, issuer, audience, subject, tenant_id, client_id, and token
        scope, then intersects token scopes with the Hub operator's exact
        tenant/subject/client_id grant and instance allowlist. Production
        remote listeners require TLS. Development credentials are opaque random
        tokens created by fleet init, stored as hashes by the Hub, and accepted
        only when bound to a literal loopback IP address. Credentials in token
        or access_token query parameters are rejected; use Authorization only.
        Tokens carrying unsupported cnf proof or act delegation claims are
        rejected.
  parameters:
    InstanceId:
      name: instance_id
      in: path
      required: true
      description: Explicit target instance covered by the caller's resource grant.
      schema: {type: string, minLength: 1, maxLength: 256}
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, bounded to 200 records.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    SessionId:
      name: session_id
      in: path
      required: true
      description: Opaque Hub session identifier; globally bound to tenant, instance, and local session identity.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    TurnId:
      name: turn_id
      in: path
      required: true
      description: Opaque Hub turn identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    InstanceIdQuery:
      name: instance_id
      in: query
      required: true
      description: Must equal the one instance bound to this gateway token.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    GenerationQuery:
      name: generation
      in: query
      required: true
      description: Current positive fencing generation returned by register.
      schema:
        type: integer
        minimum: 1
        maximum: 9999999999
  responses:
    InvalidRequest:
      description: Malformed input, unknown request fields, or invalid cursor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Missing, invalid, expired, or unverifiable bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: 'Bearer realm="agent-hub"'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Caller lacks the required scope, principal kind, or instance grant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The requested resource is not found in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: >-
        Idempotency conflict, unavailable session, unsupported session creation,
        full capacity, conflicting terminal report, active prior boot, or stale generation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: Request body, prompt, metadata, or event content exceeds its size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: Request body must use application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error:
      description: Other request or service error; error envelope format is stable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SourceSessionReference:
      type: object
      additionalProperties: false
      description: >-
        Only explicit three-scope metadata observations carry this reference.
        Exact recorded instance/session/generation identity match, not a verified
        execution parent, goal binding, semantic equivalence or local mapping.
        Unresolved has null target; matching has an independently namespaced
        native pointer, not proof it will appear in another native task window.
        Python checks full identity/digests and all false authority flags.
      required: [schema_version, reference_id, basis, state, target, liveness,
        parent_execution_verified, goal_binding_verified, deduplication_authority,
        billing_addition_authority, grants_execution]
      properties:
        schema_version: {type: integer, enum: [1]}
        reference_id: {type: string, pattern: '^hr-[a-f0-9]{32}$'}
        basis:
          type: string
          enum: [recorded_instance_session_generation_match_only_not_execution_parent_or_equivalence]
        state: {type: string, enum: [observed_recorded_reference, unresolved_in_authorized_window]}
        target:
          type: object
          nullable: true
          additionalProperties: false
          required: [namespace, source_id, task_id, tenant_id, instance_id, session_id, reported_generation, last_recorded_at]
          properties:
            namespace: {type: string, enum: [hub-native-task-facts-v1]}
            source_id: {type: string, pattern: '^src-[a-f0-9]{24}$'}
            task_id: {type: string, pattern: '^tc-[a-f0-9]{32}$'}
            tenant_id: {type: string, minLength: 1, maxLength: 256}
            instance_id: {type: string, minLength: 1, maxLength: 256}
            session_id: {type: string, minLength: 1, maxLength: 256}
            reported_generation: {type: integer, minimum: 1}
            last_recorded_at: {type: number, minimum: 0}
        liveness: {type: string, enum: [not_verified]}
        parent_execution_verified: {type: boolean, enum: [false]}
        goal_binding_verified: {type: boolean, enum: [false]}
        deduplication_authority: {type: boolean, enum: [false]}
        billing_addition_authority: {type: boolean, enum: [false]}
        grants_execution: {type: boolean, enum: [false]}
    TaskCenterEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TaskCenterSnapshot'
    TaskCenterSnapshot:
      type: object
      additionalProperties: false
      description: >-
        Independent hub-native-task-facts-v1, hub-compute-task-facts-v1 or explicitly selected
        hub-compute-source-session-references-v1 shared public projection. Detailed task/source
        field consistency and closed nested authority are checked by the Python
        consumer. See TASK_CENTER.md for identity, coverage and privacy semantics.
        Empty metadata display groups mean untracked_not_imported, never absent
        histories/resources or complete discovery. Counts describe metadata
        records, not accepted output or distinct failures. The viewer never
        downloads or independently verifies payloads.
      required: [schema_version, generated_at, window_only, sources, tasks, goals, intents,
        repairs, resources, feedback, diagnostics, observed_task_count, omitted_tasks,
        status_counts, activity, scope, attention]
      properties:
        schema_version: {type: integer, enum: [1]}
        generated_at: {type: string, nullable: true, description: No new clock is read; currently null.}
        window_only: {type: boolean, enum: [true]}
        sources:
          type: array
          maxItems: 64
          items: {type: object}
        tasks:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              source_session_reference:
                $ref: '#/components/schemas/SourceSessionReference'
        goals: {type: array, maxItems: 0, items: {type: object}}
        intents: {type: array, maxItems: 0, items: {type: object}}
        repairs: {type: array, maxItems: 0, items: {type: object}}
        resources: {type: array, maxItems: 0, items: {type: object}}
        feedback: {type: array, maxItems: 0, items: {type: object}}
        diagnostics: {type: array, items: {type: string}}
        observed_task_count: {type: integer, minimum: 0, maximum: 1024}
        omitted_tasks: {type: integer, minimum: 0, maximum: 1024}
        status_counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
        activity: {type: object, description: Remote process/lease liveness is untracked.}
        scope:
          type: object
          description: Per-request user resource grant; partial windows have unknown omitted DB totals.
          properties:
            method: {type: string, enum: [hub-native-task-facts-v1, hub-compute-task-facts-v1, hub-compute-source-session-references-v1]}
            grants_execution: {type: boolean, enum: [false]}
            complete_inventory: {type: boolean, enum: [false]}
        attention:
          type: object
          description: Same bounded attention method as local tasks; not causes, priorities or intervention grants.
          properties:
            method: {type: string, enum: [bounded-attention-facts-v1]}
            grants_execution: {type: boolean, enum: [false]}
            zero_items_proves_safety_or_no_missing_work: {type: boolean, enum: [false]}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              example: forbidden
            message:
              type: string
              example: permission denied
    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
    Instance:
      type: object
      required: [tenant, instance_id, boot_id, generation, last_seen, online, session_capacity, session_close_supported]
      properties:
        tenant:
          type: string
        instance_id:
          type: string
          description: Operator-assigned instance identity.
        boot_id:
          type: string
          description: Identity of the current gateway process boot.
        generation:
          type: integer
          minimum: 1
          description: Monotonically increased on an offline process takeover; used to fence old gateways.
        last_seen:
          type: number
          format: double
          description: Heartbeat time as Unix epoch seconds.
        online:
          type: boolean
          description: Computed from the current time and the configured heartbeat expiry window.
        session_capacity:
          type: integer
          minimum: 0
          maximum: 8
          default: 0
          description: Maximum unclosed sessions plus queued creations for this generation; zero disables creation.
        session_close_supported:
          type: boolean
          default: false
          description: Whether this Gateway can explicitly close idle sessions; independent of creation capacity.
        name:
          type: string
        project_id:
          type: string
      additionalProperties: false
    Session:
      type: object
      additionalProperties: false
      required:
        - session_id
        - tenant
        - instance_id
        - local_session_id
        - generation
        - name
        - project_id
        - status
        - active_turn_id
        - online
        - controllable
        - frozen
        - updated_at
      properties:
        session_id:
          type: string
          description: Stable Hub id derived from tenant, instance_id, and local_session_id.
        tenant:
          type: string
        instance_id:
          type: string
        local_session_id:
          type: string
        generation:
          type: integer
          minimum: 1
        name:
          type: string
        project_id:
          type: string
        status:
          type: string
          description: >-
            Active turn state when a turn exists; otherwise Gateway metadata or
            the Hub-owned closing, closed, close_failed or close_lost lifecycle.
            Arbitrary Gateway status text never releases capacity.
        active_turn_id:
          type: string
          description: Current nonterminal turn id, or the empty string if no turn is active.
        online:
          type: boolean
          description: True only while this session generation matches a live instance generation.
        controllable:
          type: boolean
          description: True only if the session was marked controllable, is not frozen, and its instance is online.
        frozen:
          type: boolean
          description: >-
            Sessions become frozen and read-only on close acceptance or generation
            takeover. Close failure never thaws a session; Gateway restart is required.
        updated_at:
          type: number
          format: double
          description: Last session metadata update as Unix epoch seconds.
    TurnState:
      type: string
      enum: [queued, running, cancel_requested, completed, failed, interrupted, cancelled, lost]
    Turn:
      type: object
      additionalProperties: false
      required:
        - turn_id
        - tenant
        - session_id
        - instance_id
        - generation
        - actor
        - state
        - status
        - idempotency_key
        - created_at
        - updated_at
      properties:
        turn_id:
          type: string
        tenant:
          type: string
        session_id:
          type: string
        instance_id:
          type: string
        generation:
          type: integer
          minimum: 1
        actor:
          type: string
        state:
          $ref: '#/components/schemas/TurnState'
        status:
          $ref: '#/components/schemas/TurnState'
          description: Compatibility alias; always equal to state.
        idempotency_key:
          type: string
          maxLength: 256
        created_at:
          type: number
          format: double
          description: Creation time as Unix epoch seconds.
        updated_at:
          type: number
          format: double
          description: Last state change as Unix epoch seconds.
    SessionEvent:
      type: object
      additionalProperties: false
      required: [cursor, event_id, session_id, turn_id, instance_id, generation, kind, payload, created_at, duplicate]
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 1
          description: Persistent monotonically increasing cursor within the tenant.
        event_id:
          type: string
          maxLength: 256
        session_id:
          type: string
        turn_id:
          type: string
          description: Empty when the event is not associated with a turn.
        instance_id:
          type: string
        generation:
          type: integer
          minimum: 1
        kind:
          type: string
          maxLength: 128
        payload:
          type: object
          description: >-
            Redacted JSON object; sensitive keys are rejected at ingress.
            Bundled Gateway message events contain text, chunk_index (zero-based),
            chunk_count and truncated. Text chunks contain at most 4 KiB UTF-8;
            each source runtime event is capped at 256 KiB before redaction.
            Process by cursor and deduplicate by event_id. For message.completed,
            chunk zero replaces accumulated delta text; later chunks append.
            A true truncated flag requires a visible truncation indication.
          additionalProperties: true
        turn_state:
          type: string
          enum: ['', queued, running, cancel_requested, completed, failed, interrupted, cancelled, lost]
          description: >-
            Present on Gateway append acknowledgements only. The current turn
            state, including on duplicate event replay; empty without a turn.
        created_at:
          type: number
          format: double
          description: Event time as Unix epoch seconds.
        duplicate:
          type: boolean
          description: True when an identical previously stored event_id was replayed.
    GatewayCommand:
      type: object
      additionalProperties: false
      required: [command_id, kind, turn_id, session_id, local_session_id, prompt, state, cancel_requested]
      properties:
        command_id:
          type: string
        kind:
          type: string
          enum: [prompt, cancel]
        turn_id:
          type: string
        session_id:
          type: string
        local_session_id:
          type: string
        prompt:
          type: string
          description: Original prompt for prompt commands; empty for cancel commands.
        state:
          $ref: '#/components/schemas/TurnState'
        cancel_requested:
          type: boolean
          description: True for a cancel command.
    InstanceEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Instance'
    SessionEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Session'
    TurnEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Turn'
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/SessionEvent'
            - type: object
              required: [turn_state]
    InstanceListEnvelope:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        next_cursor:
          type: string
          description: Last instance_id returned, or an empty string when the page is empty.
    SessionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          description: Last session_id returned, or an empty string when the page is empty.
    EventListEnvelope:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionEvent'
        next_cursor:
          type: integer
          format: int64
          minimum: 0
          description: Last cursor returned, or the requested after cursor when the page is empty.
    CommandListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/GatewayCommand'
    SubmitTurnRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          description: Nonblank prompt with UTF-8 encoding no larger than 16 KiB.
    RegisterInstanceRequest:
      type: object
      additionalProperties: false
      required: [instance_id, boot_id]
      properties:
        instance_id:
          type: string
          minLength: 1
          maxLength: 256
        boot_id:
          type: string
          minLength: 1
          maxLength: 256
        name:
          type: string
          maxLength: 256
        project_id:
          type: string
          maxLength: 256
        session_capacity:
          type: integer
          minimum: 0
          maximum: 8
          default: 0
          description: Optional remote session capacity; includes unclosed initial sessions and queued creations.
        session_close_supported:
          type: boolean
          default: false
          description: Optional idle-close capability; may be true even when creation capacity is zero.
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            Control-free text, trimmed before storage and idempotency comparison.
            The trimmed UTF-8 encoding must be nonempty and at most 256 bytes.
    SessionRequest:
      type: object
      additionalProperties: false
      required: [request_id, instance_id, name, status, session_id, error_code, created_at, updated_at]
      properties:
        request_id: {type: string}
        instance_id: {type: string}
        name: {type: string}
        status:
          type: string
          enum: [queued, created, failed, lost]
        session_id:
          type: string
          description: Hub session identity when created; otherwise an empty string.
        error_code:
          type: string
          enum: ['', session_creation_failed, session_capacity, owner_replaced]
          description: Empty for queued or created; owner_replaced denotes generation takeover.
        created_at: {type: number, format: double}
        updated_at: {type: number, format: double}
    SessionOperationListEnvelope:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SessionOperation'
        next_cursor:
          type: string
          maxLength: 2048
          pattern: '^[A-Za-z0-9_-]*$'
          description: Empty for an exhausted or empty page; otherwise the last returned row.
    SessionOperation:
      type: object
      additionalProperties: false
      required: [operation, request_id, instance_id, name, status, session_id, error_code, created_at, updated_at]
      description: >-
        Public projection only. Identity is (operation, request_id), since the
        two original ledgers have independent request identifiers. Identifiers
        have at most 256 Unicode characters and exclude C0/DEL; C1 is permitted.
        Time fields must be finite nonnegative JSON numbers. No actor, client,
        key, local identity, generation, path or credential is exposed.
      properties:
        operation: {type: string, enum: [create, close]}
        request_id: {type: string, minLength: 1, maxLength: 256}
        instance_id: {type: string, minLength: 1, maxLength: 256}
        name: {type: string, maxLength: 256}
        status: {type: string}
        session_id: {type: string, maxLength: 256}
        error_code: {type: string}
        created_at: {type: number, format: double, minimum: 0}
        updated_at: {type: number, format: double, minimum: 0}
      oneOf:
        - properties:
            operation: {enum: [create]}
            name:
              minLength: 1
              description: Nonempty creation name, at most 256 UTF-8 bytes, without Unicode Cc/Cf.
          oneOf:
            - properties:
                status: {enum: [queued]}
                session_id: {enum: ['']}
                error_code: {enum: ['']}
            - properties:
                status: {enum: [created]}
                session_id: {minLength: 1}
                error_code: {enum: ['']}
            - properties:
                status: {enum: [failed]}
                session_id: {enum: ['']}
                error_code: {enum: [session_creation_failed, session_capacity]}
            - properties:
                status: {enum: [lost]}
                session_id: {enum: ['']}
                error_code: {enum: [owner_replaced]}
        - properties:
            operation: {enum: [close]}
            name: {enum: ['']}
            session_id: {minLength: 1}
          oneOf:
            - properties:
                status: {enum: [queued, closed]}
                error_code: {enum: ['']}
            - properties:
                status: {enum: [failed]}
                error_code: {enum: [session_close_failed, session_unavailable]}
            - properties:
                status: {enum: [lost]}
                error_code: {enum: [owner_replaced]}
    SessionRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionRequest'
    SessionRequestCommand:
      type: object
      additionalProperties: false
      required: [request_id, instance_id, generation, name, project_id, local_session_id]
      properties:
        request_id: {type: string}
        instance_id: {type: string}
        generation: {type: integer, minimum: 1}
        name: {type: string}
        project_id:
          type: string
          description: Operator-fixed project captured at admission; never a client-supplied path.
        local_session_id:
          type: string
          description: Durable Hub-allocated local identity to pass to AgentSessionOptions.session_id.
    SessionRequestCommandEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SessionRequestCommand'
    ReportSessionRequest:
      type: object
      additionalProperties: false
      required: [instance_id, generation, request_id, status]
      properties:
        instance_id: {type: string, minLength: 1, maxLength: 256}
        generation: {type: integer, minimum: 1, maximum: 9999999999}
        request_id: {type: string, minLength: 1, maxLength: 256}
        status: {type: string, enum: [created, failed]}
        error_code:
          type: string
          enum: ['', session_creation_failed, session_capacity]
          default: ''
          description: Must be empty for created; failed requires one of the two fixed failure codes.
    SessionCloseRequest:
      type: object
      additionalProperties: false
      required: [request_id, instance_id, session_id, status, error_code, created_at, updated_at]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 256}
        instance_id: {type: string, minLength: 1, maxLength: 256}
        session_id: {type: string, minLength: 1, maxLength: 256}
        status:
          type: string
          enum: [queued, closed, failed, lost]
        error_code:
          type: string
          enum: ['', session_close_failed, session_unavailable, owner_replaced]
          description: Empty for queued/closed; failed has a fixed close error; lost has owner_replaced.
        created_at: {type: number, format: double, minimum: 0}
        updated_at: {type: number, format: double, minimum: 0}
    SessionCloseRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionCloseRequest'
    SessionCloseCommand:
      type: object
      additionalProperties: false
      required: [request_id, instance_id, generation, session_id, local_session_id]
      properties:
        request_id: {type: string, minLength: 1, maxLength: 256}
        instance_id: {type: string, minLength: 1, maxLength: 256}
        generation: {type: integer, minimum: 1}
        session_id: {type: string, minLength: 1, maxLength: 256}
        local_session_id: {type: string, minLength: 1, maxLength: 256}
    SessionCloseCommandEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SessionCloseCommand'
    ReportSessionCloseRequest:
      type: object
      additionalProperties: false
      required: [instance_id, generation, request_id, status]
      properties:
        instance_id: {type: string, minLength: 1, maxLength: 256}
        generation: {type: integer, minimum: 1, maximum: 9999999999}
        request_id: {type: string, minLength: 1, maxLength: 256}
        status: {type: string, enum: [closed, failed]}
        error_code:
          type: string
          enum: ['', session_close_failed, session_unavailable]
          default: ''
          description: Closed requires empty; failed requires one of the two fixed codes.
    GatewayGenerationRequest:
      type: object
      additionalProperties: false
      required: [instance_id, generation]
      properties:
        instance_id:
          type: string
          minLength: 1
          maxLength: 256
        generation:
          type: integer
          minimum: 1
          maximum: 9999999999
    UpsertSessionRequest:
      type: object
      additionalProperties: false
      required: [instance_id, generation, local_session_id]
      properties:
        instance_id:
          type: string
          minLength: 1
          maxLength: 256
        generation:
          type: integer
          minimum: 1
          maximum: 9999999999
        local_session_id:
          type: string
          minLength: 1
          maxLength: 256
        name:
          type: string
          maxLength: 256
          default: ''
        project_id:
          type: string
          maxLength: 256
          default: ''
        controllable:
          type: boolean
          default: false
        status:
          type: string
          maxLength: 32
          default: active
    AppendEventRequest:
      type: object
      additionalProperties: false
      required: [instance_id, generation, event_id, session_id, kind]
      properties:
        instance_id:
          type: string
          minLength: 1
          maxLength: 256
        generation:
          type: integer
          minimum: 1
          maximum: 9999999999
        event_id:
          type: string
          minLength: 1
          maxLength: 256
        session_id:
          type: string
          minLength: 1
          maxLength: 256
        turn_id:
          type: string
          maxLength: 256
          default: ''
        kind:
          type: string
          enum: [turn.running, turn.completed, turn.failed, turn.interrupted, message.delta, message.completed]
          description: >-
            queued, cancel_requested, cancelled and lost events are generated
            by the Hub and cannot be submitted by a Gateway.
        payload:
          type: object
          additionalProperties: true
          default: {}
          description: >-
            Redacted JSON object. UTF-8 serialized event content is limited to
            32 KiB; nested sensitive keys are rejected. Ordinary text values
            are not rejected merely because they contain words such as token.

    ComputeResources:
      type: object
      additionalProperties: false
      description: >-
        GPU memory is a per-card admission minimum, not an operating-system
        limit. GPU fields are omitted from canonical CPU-only requests.
      properties:
        cpu_cores:
          type: integer
          minimum: 1
          maximum: 256
        memory_bytes:
          type: integer
          minimum: 0
          maximum: 17592186044416
        gpu_count:
          type: integer
          minimum: 0
          maximum: 16
          default: 0
        gpu_memory_bytes:
          type: integer
          minimum: 0
          maximum: 1099511627776
          default: 0
      anyOf:
        - required: [gpu_count]
          properties:
            gpu_count:
              minimum: 1
        - properties:
            gpu_memory_bytes:
              maximum: 0
    ComputeRequirements:
      type: object
      additionalProperties: false
      properties:
        os:
          type: string
        architecture:
          type: string
        runtimes:
          type: array
          maxItems: 32
          items:
            type: string
    RescheduleComputeRequest:
      type: object
      additionalProperties: false
      properties:
        target_device_id:
          type: string
          maxLength: 256
          default: ''
          description: Empty selects automatic placement.
      required: [target_device_id]
    RetryLostComputeRequest:
      type: object
      additionalProperties: false
      properties:
        target_device_id:
          type: string
          maxLength: 256
          default: ''
          description: Empty preserves an original explicit target or selects automatic placement.
        confirm_duplicate:
          type: boolean
          enum: [true]
          description: Required acknowledgement that the lost task may have already run.
      required: [confirm_duplicate]
    SubmitComputeRequest:
      type: object
      additionalProperties: false
      properties:
        workspace:
          $ref: '#/components/schemas/ComputeWorkspace'
        argv:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: string
        workdir:
          type: string
          default: .
        timeout:
          type: integer
          minimum: 1
          maximum: 3600
          default: 60
        resources:
          $ref: '#/components/schemas/ComputeResources'
        requirements:
          $ref: '#/components/schemas/ComputeRequirements'
        target_device_id:
          type: string
        turn_id:
          type: string
      required:
      - argv
    ComputeGPU:
      type: object
      additionalProperties: false
      description: >-
        One NVIDIA physical card; available memory cannot exceed total memory.
        Duplicate UUIDs are rejected case-insensitively. Stale measurements
        and device-level unavailability prevent GPU placement.
      properties:
        uuid:
          type: string
          pattern: '^GPU-[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'
        name:
          type: string
          minLength: 1
          maxLength: 128
        vendor:
          type: string
          enum: [nvidia]
        total_memory_bytes:
          type: integer
          minimum: 1
          maximum: 1099511627776
        available_memory_bytes:
          type: integer
          minimum: 0
          maximum: 1099511627776
        schedulable:
          type: boolean
        reserved:
          type: boolean
        observed_at:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000000000000
      required: [uuid, name, vendor, total_memory_bytes, available_memory_bytes, schedulable, reserved, observed_at]
    ComputeGPUAssignment:
      type: object
      additionalProperties: false
      description: >-
        Immutable Fabric-selected physical GPU allocation. UUID count and
        per-card memory must match task resources. Assigned time cannot
        precede observed time. Duplicate UUIDs are rejected case-insensitively.
        GPU tasks expose this after confirmed admission.
      properties:
        vendor:
          type: string
          enum: [nvidia]
        mode:
          type: string
          enum: [physical]
        uuids:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^GPU-[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'
        gpu_memory_bytes:
          type: integer
          minimum: 0
          maximum: 1099511627776
        assigned_at:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000000000000
        observed_at:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000000000000
      required: [vendor, mode, uuids, gpu_memory_bytes, assigned_at, observed_at]
    ComputeDevice:
      type: object
      additionalProperties: false
      properties:
        workspace_supported:
          type: boolean
          description: Both Fabric and target Runner support bounded workspace tasks.
        device_id:
          type: string
        instance_id:
          type: string
        name:
          type: string
        lifecycle_state:
          type: string
        os:
          type: string
        architecture:
          type: string
        online:
          type: boolean
        schedulable:
          type: boolean
        cpu_cores:
          type: number
          minimum: 0
        total_memory_bytes:
          type: number
          minimum: 0
        available_memory_bytes:
          type: number
          minimum: 0
        reserved_cpu_cores:
          type: number
          minimum: 0
        reserved_memory_bytes:
          type: number
          minimum: 0
        running_tasks:
          type: number
          minimum: 0
        last_seen:
          type: number
          minimum: 0
        runtimes:
          type: array
          items:
            type: string
        project_ids:
          type: array
          items:
            type: string
        gpu_status:
          type: string
          enum: [unsupported, unavailable, stale, available, busy]
          description: Missing on older Hubs; clients must treat absence as unsupported.
        gpus:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ComputeGPU'
      required:
      - device_id
      - instance_id
      - name
      - lifecycle_state
      - os
      - architecture
      - online
      - schedulable
      - cpu_cores
      - total_memory_bytes
      - available_memory_bytes
      - reserved_cpu_cores
      - reserved_memory_bytes
      - running_tasks
      - last_seen
      - runtimes
      - project_ids
    ComputeTask:
      type: object
      additionalProperties: false
      properties:
        workspace:
          $ref: '#/components/schemas/ComputeWorkspace'
        workspace_result:
          $ref: '#/components/schemas/WorkspaceResult'
        task_id:
          type: string
        session_id:
          type: string
        instance_id:
          type: string
        turn_id:
          type: string
        actor:
          type: string
        project_id:
          type: string
        device_id:
          type: string
        device_instance_id:
          type: string
        workdir:
          type: string
        error:
          type: string
        state:
          type: string
          enum:
          - queued
          - dispatching
          - running
          - cancel_requested
          - completed
          - failed
          - cancelled
          - lost
        argv:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: string
        timeout:
          type: integer
          minimum: 1
          maximum: 3600
          default: 60
        resources:
          $ref: '#/components/schemas/ComputeResources'
        requirements:
          $ref: '#/components/schemas/ComputeRequirements'
        created_at:
          type: number
          minimum: 0
        updated_at:
          type: number
          minimum: 0
        result:
          $ref: '#/components/schemas/ComputeResult'
        archive_state:
          type: string
          enum:
          - disabled
          - pending
          - archived
          - failed
        artifact_ref:
          $ref: '#/components/schemas/ComputeArtifact'
        target_device_id:
          type: string
        gpu_assignment:
          $ref: '#/components/schemas/ComputeGPUAssignment'
      required:
      - task_id
      - session_id
      - instance_id
      - turn_id
      - actor
      - project_id
      - device_id
      - device_instance_id
      - workdir
      - error
      - state
      - argv
      - timeout
      - resources
      - requirements
      - created_at
      - updated_at
      - result
      - archive_state
      - artifact_ref
      - target_device_id
    ComputeResult:
      type: object
      additionalProperties: false
      properties:
        exit_code:
          type: integer
          nullable: true
        timed_out:
          type: boolean
        cancelled:
          type: boolean
        stdout:
          type: string
        stderr:
          type: string
        output_truncated:
          type: boolean
        elapsed:
          type: number
          minimum: 0
        evidence_digest:
          type: string
    ComputeArtifact:
      type: object
      additionalProperties: false
      properties:
        backend:
          type: string
          enum:
          - aero-vault
        key:
          type: string
        version_id:
          type: string
        etag:
          type: string
        sha256:
          type: string
        size:
          type: integer
          minimum: 0
        bucket:
          type: string
    ComputeTaskEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ComputeTask'
      required:
      - data
    ComputeTaskListEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ComputeTask'
        next_cursor:
          type: string
      required:
      - data
      - next_cursor
    ComputeDeviceListEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ComputeDevice'
        next_cursor:
          type: string
      required:
      - data
      - next_cursor
    ComputePlacementEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ComputePlacement'
      required: [data]
    ComputePlacement:
      type: object
      additionalProperties: false
      properties:
        task_id:
          type: string
          minLength: 1
          maxLength: 256
        state:
          type: string
          enum: [queued, dispatching, running, cancel_requested, completed, failed, cancelled, lost]
        evaluated_at:
          type: number
          minimum: 0
          description: Finite Hub observation timestamp, not an atomic cross-device snapshot.
        devices:
          type: array
          maxItems: 20
          description: Ascending distinct device IDs. Empty when state is not queued.
          items:
            $ref: '#/components/schemas/ComputePlacementDevice'
        next_cursor:
          type: string
          maxLength: 256
          description: Last returned device ID only if more visible bindings exist; otherwise empty.
      required: [task_id, state, evaluated_at, devices, next_cursor]
    ComputePlacementDevice:
      type: object
      additionalProperties: false
      properties:
        device_id: {type: string, minLength: 1, maxLength: 256}
        instance_id: {type: string, minLength: 1, maxLength: 256}
        eligible:
          type: boolean
          description: True exactly when reasons is empty; no admission guarantee.
        reasons:
          type: array
          uniqueItems: true
          maxItems: 16
          items:
            type: string
            enum:
            - device_offline
            - device_not_ready
            - device_busy
            - device_unavailable
            - project_unavailable
            - target_not_authorized
            - target_mismatch
            - workspace_unsupported
            - cpu_insufficient
            - memory_insufficient
            - os_mismatch
            - architecture_mismatch
            - runtime_missing
            - gpu_unavailable
            - gpu_insufficient
            - inventory_missing
      required: [device_id, instance_id, eligible, reasons]
    ComputeDelegationRequest:
      type: object
      additionalProperties: false
      properties:
        instance_id:
          type: string
        generation:
          type: integer
          minimum: 1
        session_id:
          type: string
        turn_id:
          type: string
        operation:
          type: string
          enum:
          - devices
          - submit
          - status
          - placement
          - cancel
          - reschedule
          - retry
          - snapshots
          - snapshot-upload
          - workspace-output
        payload:
          type: object
        key:
          type: string
      required:
      - instance_id
      - generation
      - session_id
      - turn_id
      - operation
    IntegrationDelivery:
      type: object
      additionalProperties: false
      properties:
        delivery_id:
          type: string
        sink_name:
          type: string
        event_id:
          type: string
        instance_id:
          type: string
        kind:
          type: string
        error_code:
          type: string
        sequence:
          type: integer
          minimum: 0
        cursor:
          type: integer
          minimum: 0
        attempts:
          type: integer
          minimum: 0
        error_status:
          type: integer
          minimum: 0
        retry_at:
          type: number
          minimum: 0
        created_at:
          type: number
          minimum: 0
        updated_at:
          type: number
          minimum: 0
        first_attempt_at:
          type: number
          nullable: true
        sink_kind:
          type: string
          enum:
          - audit
          - im
        state:
          type: string
          enum:
          - pending
          - sending
          - retrying
          - failed
          - delivered
        configured:
          type: boolean
        receipt:
          type: object
          description: Verified safe receipt metadata; empty until delivered.
      required:
      - delivery_id
      - sink_name
      - event_id
      - instance_id
      - kind
      - error_code
      - sequence
      - cursor
      - attempts
      - error_status
      - retry_at
      - created_at
      - updated_at
      - first_attempt_at
      - sink_kind
      - state
      - configured
      - receipt
    IntegrationDeliveryListEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/IntegrationDelivery'
        next_cursor:
          type: integer
          minimum: 0
    IntegrationRetryEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - delivery_id
          - state
          - attempts
          properties:
            delivery_id:
              type: string
            state:
              type: string
              enum:
              - pending
              - sending
              - retrying
              - failed
              - delivered
            attempts:
              type: integer
              minimum: 0

    WorkspaceBundle:
      type: object
      additionalProperties: false
      properties:
        schema:
          type: string
          enum:
          - pbatch.workspace.v1
        files:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 512
              content_b64:
                type: string
                maxLength: 87384
            required:
            - path
            - content_b64
      required:
      - schema
      - files
      description: 'Canonical UTF-8 JSON with sorted keys and path-sorted files. At most
        512 KiB JSON, 128 files, 64 KiB decoded per file, 256 KiB decoded total. Exact
        relative portable paths only; no links, traversal, glob expansion, duplicate/casefold
        collisions or file-parent conflicts. NFC Unicode paths: at most 512 UTF-8 bytes,
        255 bytes per segment.'
    ComputeWorkspace:
      type: object
      additionalProperties: false
      properties:
        snapshot_id:
          type: string
          minLength: 1
          maxLength: 128
        outputs:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
      required:
      - snapshot_id
      - outputs
    WorkspaceSnapshot:
      type: object
      additionalProperties: false
      properties:
        snapshot_id: &id001
          type: string
        session_id: *id001
        instance_id: *id001
        project_id: *id001
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        size:
          type: integer
          minimum: 0
          maximum: 524288
        file_count:
          type: integer
          minimum: 0
          maximum: 128
        created_at:
          type: number
        artifact_ref:
          $ref: '#/components/schemas/ComputeArtifact'
      required:
      - snapshot_id
      - session_id
      - instance_id
      - project_id
      - sha256
      - size
      - file_count
      - created_at
      - artifact_ref
    WorkspaceResult:
      type: object
      additionalProperties: false
      properties:
        input_sha256: *id001
        output_sha256: *id001
        state:
          type: string
          enum:
          - pending
          - ready
          - failed
          - unavailable
        artifact_ref:
          $ref: '#/components/schemas/ComputeArtifact'
      required:
      - input_sha256
      - output_sha256
      - state
      - artifact_ref
    WorkspaceOutput:
      type: object
      additionalProperties: false
      properties:
        input_sha256: *id001
        output_sha256: *id001
        bundle:
          $ref: '#/components/schemas/WorkspaceBundle'
      required:
      - input_sha256
      - output_sha256
      - bundle
    UploadWorkspaceRequest:
      type: object
      additionalProperties: false
      properties:
        bundle:
          $ref: '#/components/schemas/WorkspaceBundle'
      required:
      - bundle
    WorkspaceSnapshotEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceSnapshot'
      required:
      - data
    WorkspaceOutputEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceOutput'
      required:
      - data
    WorkspaceSnapshotListEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/WorkspaceSnapshot'
        next_cursor: *id001
      required:
      - data
      - next_cursor
