    WorkspaceBundle:
      type: object
      additionalProperties: false
      properties:
        schema:
          type: string
          enum:
          - pbatch.workspace.v1
        files:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 512
              content_b64:
                type: string
                maxLength: 87384
            required:
            - path
            - content_b64
      required:
      - schema
      - files
      description: 'Canonical UTF-8 JSON with sorted keys and path-sorted files. At most
        512 KiB JSON, 128 files, 64 KiB decoded per file, 256 KiB decoded total. Exact
        relative portable paths only; no links, traversal, glob expansion, duplicate/casefold
        collisions or file-parent conflicts. NFC Unicode paths: at most 512 UTF-8 bytes,
        255 bytes per segment.'
    ComputeWorkspace:
      type: object
      additionalProperties: false
      properties:
        snapshot_id:
          type: string
          minLength: 1
          maxLength: 128
        outputs:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
      required:
      - snapshot_id
      - outputs
    WorkspaceSnapshot:
      type: object
      additionalProperties: false
      properties:
        snapshot_id: &id001
          type: string
        session_id: *id001
        instance_id: *id001
        project_id: *id001
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        size:
          type: integer
          minimum: 0
          maximum: 524288
        file_count:
          type: integer
          minimum: 0
          maximum: 128
        created_at:
          type: number
        artifact_ref:
          $ref: '#/components/schemas/ComputeArtifact'
      required:
      - snapshot_id
      - session_id
      - instance_id
      - project_id
      - sha256
      - size
      - file_count
      - created_at
      - artifact_ref
    WorkspaceResult:
      type: object
      additionalProperties: false
      properties:
        input_sha256: *id001
        output_sha256: *id001
        state:
          type: string
          enum:
          - pending
          - ready
          - failed
          - unavailable
        artifact_ref:
          $ref: '#/components/schemas/ComputeArtifact'
      required:
      - input_sha256
      - output_sha256
      - state
      - artifact_ref
    WorkspaceOutput:
      type: object
      additionalProperties: false
      properties:
        input_sha256: *id001
        output_sha256: *id001
        bundle:
          $ref: '#/components/schemas/WorkspaceBundle'
      required:
      - input_sha256
      - output_sha256
      - bundle
    UploadWorkspaceRequest:
      type: object
      additionalProperties: false
      properties:
        bundle:
          $ref: '#/components/schemas/WorkspaceBundle'
      required:
      - bundle
    WorkspaceSnapshotEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceSnapshot'
      required:
      - data
    WorkspaceOutputEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceOutput'
      required:
      - data
    WorkspaceSnapshotListEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/WorkspaceSnapshot'
        next_cursor: *id001
      required:
      - data
      - next_cursor
