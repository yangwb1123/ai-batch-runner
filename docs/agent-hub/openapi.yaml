            $ref: '#/components/schemas/IntegrationDelivery'
        next_cursor:
          type: integer
          minimum: 0
    IntegrationRetryEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - delivery_id
          - state
          - attempts
          properties:
            delivery_id:
              type: string
