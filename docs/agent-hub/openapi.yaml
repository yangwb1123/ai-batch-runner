openapi: 3.0.3
info:
  title: Snaplink Agent Hub API
  version: 1.13.0
  description: >-
    Tenant-scoped directory and command API for sessions owned by distinct
    Agent Hub instances. This API lists instances and sessions, submits a
    prompt to one existing session, creates a session on a capable instance,
    closes idle sessions while retaining history, relays events, and requests cancellation.
    Ordinary JSON requests are limited to 64 KiB. Snapshot uploads and their
    active-turn gateway envelope allow 576 KiB. Optional tenant-bound Device
    Fabric connections expose resource discovery and durable computation tasks,
    including retargeting of queued work and explicitly confirmed retries of
    lost tasks within the original device authority.
servers:
  - url: https://hub.example.test
    description: Production Hub; remote listeners require TLS.
  - url: http://127.0.0.1:8788
    description: Loopback development listener only.
security:
  - HubBearer: []
tags:
  - name: Integration API
    description: Explicitly authorized lifecycle delivery diagnostics and retries.
  - name: Compute API
    description: Authorized project devices, durable tasks, and active-turn delegation.
  - name: Health
  - name: User API
    description: User principals read authorized instances and sessions and send or cancel turns.
  - name: Gateway API
    description: A gateway principal is bound to exactly one instance.
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: health
      summary: Check whether the Hub HTTP service is responsive
      security: []
      responses:
        '200':
          description: Service is responsive; this does not verify a Gateway or its sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/task-center/view:
    get:
      tags: [User API]
      operationId: taskCenterShell
      summary: Credential-free static read-only viewer shell, containing no tenant data
      description: >-
        No query parameters, body or mutation headers are accepted. This shell
        does not read a store or grant access. Its transient in-memory bearer
        is sent only to the same-origin authenticated task-center GET, never
        persisted or added to a URL. Hash CSP, no-store and no-referrer apply.
        This Web entry is not deployed Flutter or independent device acceptance.
      security: []
      responses:
        '200':
          description: Literal static HTML; no user facts or credentials embedded.
          content:
            text/html:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/task-center:
    get:
      tags: [User API]
      operationId: readTaskCenter
      summary: Read authorized Hub-native session and turn facts, never execute tasks
      description: >-
        Both instance and session read scopes are required. Tenant/instance
        filtering precedes LIMIT. One query-only metadata transaction selects
        at most 64 instances and 512 rows per session/turn group, with a bounded
        SQLite VM-work allowance. No prompts, events, commands, actor, local
        runtimes or private histories are selected. This is not compute access,
        a machine inventory, live preflight or a lease. Source selection only
        resolves in the admitted source window; unavailable and unauthorized
        sources supply no records. Task display trimming does not change the
        attention candidate counts. Local and Hub identities are not merged.
        Unknown usage, currency, execution duration, goal acceptance and ETA
        remain unknown. Mutation methods return 405; body, mutation headers,
        duplicate/unknown query parameters and URL credentials are refused.
      x-principal-kind: user
      x-required-scopes: [agent.instances:read, agent.sessions:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: source
          in: query
          required: false
          description: Full opaque source ID in the authorized 64-source window, not a path/name/URL/grant.
          schema:
            type: string
            pattern: '^$|^src-[a-f0-9]{24}$'
            default: ''
      responses:
        '200':
          description: Shared schema1 metadata window; no execution or upload authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCenterEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/compute-task-center/view:
    get:
      tags: [User API]
      operationId: computeTaskCenterShell
      summary: Public static compute observer shell with no tenant data or credentials
      description: >-
        Selects only the same-origin authenticated compute metadata endpoint.
        No URL credentials, queries, body, storage, task control or data upload.
        Hash CSP, no-store and no-referrer apply. Not deployed Flutter acceptance.
      security: []
      responses:
        '200':
          description: Literal static HTML; facts require their own authenticated GET.
          content:
            text/html:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/compute-task-center:
    get:
      tags: [User API]
      operationId: readComputeTaskCenter
      summary: Independent metadata-only compute task observation, never dispatch
      description: >-
        Both instance and task read grants are required. Source-instance tenant
        predicates precede LIMIT; destination compute permissions do not grant
        source reads. One query-only transaction selects at most 64 instances
        and 512 tasks, plus one row for truncation, under a SQLite VM-work cap.
        Only full task/source/session identity, generation, state and recorded
        timestamps are selected. No data_json, request_json, argv, result,
        device, actor, session label, event body, private history or live clock.
        No schema creation, broker start, Fabric probe, cancellation or retry.
        Registration is not execution duration; costs, liveness, goal acceptance
        and ETA remain unknown. Its namespace is independent from the native
        task observer; views are not merged or added. Source resolution stays
        inside the authorized source window. Attention precedes task display
        trimming and is not root-cause/incident/acceptance or execution evidence.
        Body, mutation headers, duplicate/unknown queries or URL credentials
        refuse. Methods other than GET return 405. Compute must be configured.
      x-principal-kind: user
      x-required-scopes: [agent.instances:read, agent.tasks:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: source
          in: query
          required: false
          description: Full compute-view source ID in its authorized 64-source window, not a device or native-source grant.
          schema:
            type: string
            pattern: '^$|^src-[a-f0-9]{24}$'
            default: ''
      responses:
        '200':
          description: Shared schema1 metadata window with hub-compute-task-facts-v1 method; no authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCenterEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Compute is not configured or the metadata store is unavailable; no initialization or fallback.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/compute-task-center/source-sessions/view:
    get:
      tags: [User API]
      operationId: computeSourceSessionReferenceShell
      summary: Static credential-free identity-reference shell, not a data grant
      description: >-
        Only its same-origin authenticated reference metadata GET is used.
        No tenant facts, body, URL credential, storage, pointer-follow-up,
        upload or execution control. Hash CSP, no-store, no-referrer apply.
        Not completed Flutter, accessibility, device or deployment acceptance.
      security: []
      responses:
        '200':
          description: Literal HTML shell; reference facts require all three read scopes.
          content:
            text/html:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/compute-task-center/source-sessions:
    get:
      tags: [User API]
      operationId: readComputeSourceSessionReferences
      summary: Explicit recorded source-session identity references, not execution parents or equivalence
      description: >-
        User, membership, tenant and source-instance grants precede LIMIT and
        require instance, task and session read scopes together. No grant
        expansion; destination permission grants no source read. One query-only
        transaction, 64 sources and 512 compute rows plus 512 session metadata
        rows, one extra row each for truncation, and shared SQLite VM-work cap.
        Session selection is limited to instance/session identity, generation
        and recorded update time. No labels, frozen, project, turns, events,
        bodies, command/result JSON, devices, actors, local ledgers or histories.
        A pointer in the separate native namespace is emitted only for an exact
        admitted instance/session/generation match. Unresolved means unavailable
        in this window, not absent, foreign, deleted or an incident. No targeted
        outside-window lookup or pointer-follow-up fetch. Counts precede display
        trim, do not deduplicate incidents or add costs. No verified execution
        parent, goal binding, semantic equivalence, local mapping, liveness,
        billing addition or authority; costs, duration, acceptance and ETA unknown.
        No schema/controller/provider initialization, dispatch, repair, deletion,
        upload, cancellation or clock/budget reset. No profile/history/cache
        fallback. Body, mutation headers, duplicate/unsupported query refuse;
        valid authenticated mutation methods return 405. Compute must be configured.
      x-principal-kind: user
      x-required-scopes: [agent.instances:read, agent.tasks:read, agent.sessions:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: source
          in: query
          required: false
          description: Full compute-source opaque ID in the admitted window, not native ID, instance name, path or URL.
          schema:
            type: string
            pattern: '^$|^src-[a-f0-9]{24}$'
            default: ''
      responses:
        '200':
          description: Shared schema1 hub-compute-source-session-references-v1 projection; false authority flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCenterEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Compute not configured or metadata unavailable; no initialization or fallback.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/instances:
    get:
      tags: [User API]
      operationId: listInstances
      summary: List instances granted to the caller
      description: >-
        Results are filtered by the caller's configured instance allowlist in
        the database query before pagination. The next cursor is the final
        returned instance_id; pass it as after to continue lexicographically.
      x-principal-kind: user
      x-required-scope: agent.instances:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: after
          in: query
          required: false
          description: Return instance_id values lexicographically greater than this cursor.
          schema:
            type: string
            maxLength: 256
            default: ''
      responses:
        '200':
          description: Authorized instance page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceListEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/instances/{instance_id}/sessions:
    post:
      tags: [User API]
      operationId: createAgentSession
      summary: Request a new session on one configured instance
      description: >-
        Requires write access to the target instance. The Gateway uses its fixed
        project, provider, and working directory; callers can only choose a name.
        Admission atomically reserves capacity against registered sessions without a successful close receipt plus
        queued requests in the current live generation. Unsupported, offline,
        and full instances reject new requests. The same tenant, subject,
        client_id and Idempotency-Key with the same instance and normalized name
        returns the original request even after completion or disconnection;
        changed input conflicts. No query parameters are accepted.
      x-principal-kind: user
      x-required-scope: agent.sessions:write
      parameters:
        - $ref: '#/components/parameters/InstanceId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '202':
          description: Durable creation request, including a replayed terminal result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRequestEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/session-operations:
    get:
      tags: [User API]
      operationId: listSessionOperations
      summary: Read durable creation and close requests across authorized instances
      description: >-
        Reads existing request ledgers without replaying work. Requires a user
        session-read grant; filters tenant and current instance grants before
        pagination, regardless of the submitting subject or client. Offline and
        prior-generation records remain readable. No GET body, transfer encoding,
        other query parameters or non-GET application methods are accepted;
        existing OPTIONS transport preflight remains available for CORS.
        Results use descending (created_at, operation, request_id) order. State
        updates do not change position. This is live history, not a frozen snapshot
        or admission sequence: clock rollback places new requests by recorded time;
        refresh the first page to revisit previously traversed intervals.
      x-principal-kind: user
      x-required-scope: agent.sessions:read
      parameters:
        - name: instance_id
          in: query
          required: false
          description: Optional exact instance requiring the caller's existing read grant.
          schema: {type: string, minLength: 1, maxLength: 256}
        - name: before
          in: query
          required: false
          description: >-
            Opaque unpadded base64url of compact UTF-8 JSON
            [1, float.hex(created_at), operation, request_id]. Noncanonical
            encodings and nonfinite or negative times are rejected. An empty
            cursor requests the latest page. A cursor never grants authority.
          schema:
            type: string
            maxLength: 2048
            pattern: '^[A-Za-z0-9_-]*$'
            default: ''
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: >-
            A bounded page from a shared SQLite read transaction. next_cursor is
            empty when no additional older record was observed. Otherwise it
            identifies the last returned row; clients explicitly request each page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOperationListEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: Only GET is supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/session-requests/{request_id}:
    get:
      tags: [User API]
      operationId: getSessionRequest
      summary: Read a durable session creation result
      description: >-
        Requires read access to the request's target instance in the caller's
        tenant. No query parameters or body are accepted. A created result
        includes the Hub session_id for subsequent listing, prompt, and event
        APIs. Pending requests survive Hub restart; Gateway generation takeover
        marks them lost instead of recreating them.
      x-principal-kind: user
      x-required-scope: agent.sessions:read
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Current request result without actor or local configuration details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRequestEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/sessions/{session_id}/close:
    post:
      tags: [User API]
      operationId: closeSession
      summary: Request an idle session close while retaining history
      description: >-
        Requires write access to the session's exact instance and configured
        identity membership. Accepts only an empty JSON object, no query, and a
        required Idempotency-Key. The key domain is tenant, subject and client_id;
        reuse for the same session replays the original request even after
        completion or disconnect, while a different session conflicts.
        Admission requires a live current-generation controllable session and
        session_close_supported=true. Any queued, running or cancel_requested turn
        or nonterminal compute task rejects with session_busy. Admission freezes
        the session immediately and stops new work, but retains its capacity until
        the Gateway explicitly reports closed. Failure retains the frozen session
        and capacity; recovery requires Gateway restart. There is no force, reopen,
        cancellation, deletion or history cleanup. A different key on an existing
        request returns session_close_in_progress, session_closed,
        session_close_failed, or session_unavailable for lost requests.
      x-principal-kind: user
      x-required-scope: agent.sessions:write
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, maxProperties: 0}
      responses:
        '202':
          description: Durable close request, including a replayed terminal result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCloseRequestEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: This route accepts POST only.
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/session-close-requests/{request_id}:
    get:
      tags: [User API]
      operationId: getSessionCloseRequest
      summary: Read a durable close result
      description: >-
        Requires read access to the request's exact instance within the caller's
        tenant. No query or body is accepted. Pending state survives Hub restart;
        Gateway generation takeover marks queued requests lost/owner_replaced and
        their sessions close_lost. This never claims runtime close success.
        Session, turn, event and compute history are retained without automatic cleanup.
      x-principal-kind: user
      x-required-scope: agent.sessions:read
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Current close result without actor, key or local configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCloseRequestEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: This route accepts GET only.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/sessions:
    get:
      tags: [User API]
      operationId: listSessions
      summary: List sessions visible to the caller
      description: >-
        Session pages are filtered by the caller's instance allowlist before
        pagination. If instance_id is supplied it must also be authorized.
        The next cursor is the final returned session_id; pass it as after to
        continue lexicographically.
      x-principal-kind: user
      x-required-scope: agent.sessions:read
      parameters:
        - name: instance_id
          in: query
          required: false
          description: Restrict results to one authorized instance.
          schema:
            type: string
            maxLength: 256
        - $ref: '#/components/parameters/Limit'
        - name: after
          in: query
          required: false
          description: Return session_id values lexicographically greater than this cursor.
          schema:
            type: string
            maxLength: 256
            default: ''
      responses:
        '200':
          description: Authorized session page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [User API]
      operationId: getSession
      summary: Read one authorized session
      x-principal-kind: user
      x-required-scope: agent.sessions:read
      responses:
        '200':
          description: Session metadata; no prompt or event body is included here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/sessions/{session_id}/turns:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [User API]
      operationId: submitTurn
      summary: Submit a prompt to one controllable session
      description: >-
        Reuse the same Idempotency-Key to retry the same prompt. Reusing that
        key with different session or prompt content conflicts. Prompt UTF-8
        content is limited to 16 KiB. The response omits the prompt; it is
        available only to the owning Gateway command poll.
      x-principal-kind: user
      x-required-scope: agent.sessions:write
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable caller-chosen key for this prompt submission; use a new key for a new prompt.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTurnRequest'
      responses:
        '202':
          description: Turn accepted into the durable command ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/sessions/{session_id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [User API]
      operationId: listSessionEvents
      summary: Read a bounded durable event page
      description: >-
        JSON polling and finite Server-Sent Events replay use the same durable
        cursor. after is exclusive. For an SSE request, Last-Event-ID is used
        only when after is absent. An SSE response is one page and then closes;
        reconnect using the last event id. Each SSE record uses event name
        agent.event, id equal to cursor, and JSON event data. The retry hint is
        1000 ms. Serialized event content is limited to 32 KiB; sensitive keys
        are rejected and event text is redacted before persistence. The bundled
        Python client limits each event page to 100; the service allows 200.
      x-principal-kind: user
      x-required-scope: agent.sessions:read
      parameters:
        - name: after
          in: query
          required: false
          description: Nonnegative tenant event cursor; only events with a greater cursor are returned.
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 999999999999999999
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of events in this finite page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: Last-Event-ID
          in: header
          required: false
          description: SSE reconnect cursor, used only if the after query parameter is absent.
          schema:
            type: string
            pattern: '^[0-9]{1,18}$'
        - name: Accept
          in: header
          required: false
          description: Include text/event-stream to receive a finite SSE replay page; otherwise JSON is returned.
          schema:
            type: string
            example: text/event-stream
      responses:
        '200':
          description: A bounded event page, as JSON or a finite SSE replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListEnvelope'
            text/event-stream:
              schema:
                type: string
                description: >-
                  retry: 1000 followed by zero or more event blocks. Each
                  block has id: cursor, event: agent.event, and data containing
                  one serialized SessionEvent object. An empty page has a
                  comment record.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/turns/{turn_id}:
