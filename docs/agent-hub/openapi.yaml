        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/agent/turns/{turn_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/TurnId'
    post:
      tags: [User API]
      operationId: cancelTurn
      summary: Cancel a queued or running turn
      description: >-
        A queued turn becomes cancelled immediately. A running turn becomes
        cancel_requested and remains so until its Gateway reports a terminal
        event. Repeated cancellation of a cancel_requested turn is idempotent.
      x-principal-kind: user
      x-required-scope: agent.turns:cancel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
