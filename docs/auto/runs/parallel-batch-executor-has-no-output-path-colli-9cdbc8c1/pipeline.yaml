    \ two tasks share an output races last-write-wins with no lock or fail-closed\
    \ rejection, silently corrupting a deliverable under 7x24 unattended operation.\
    \ Meanwhile the conflict/dependency machinery built for exactly this (plan_waves/_conflicts/rank_nodes/assign_agents\
    \ in waves.py) has zero production importers — it is exercised only by unit tests\
    \ (test_runtime_governance.py, test_final_formulas.py, test_tools_health.py, test_decision_states.py)\
    \ and fabric_sched.TaskNode is constructed only by device-fabric modules, never\
    \ by the batch runner. Meta role outputs are collision-safe (sanitized names +\
    \ per-plan dedupe), which makes the gap in the plain parallel batch path the notable\
    \ exception.\",\n  \"value\": 8,\n  \"risk_reduction\": 8,\n  \"effort\": 4,\n\
    \  \"confidence\": 9,\n  \"evidence\": [\n    \"pbatch/runner.py:935 (run_parallel:\
    \ ThreadPoolExecutor, no output-path uniqueness check)\",\n    \"pbatch/runner.py:956\
    \ (pool.submit in submission order, no conflict/dependency ordering)\",\n    \"\
    pbatch/runner.py:886 (_run_parallel_one: retry loop but no collision guard)\"\
    ,\n    \"pbatch/cli_batch.py:496 (parallel dispatch passes no conflict validation)\"\
    ,\n    \"pbatch/waves.py:49 (_conflicts write-set conflict logic, zero production\
    \ callers)\",\n    \"pbatch/waves.py:56 (plan_waves, only imported by tests/test_runtime_governance.py:21)\"\
    ,\n    \"pbatch/meta.py:392 (meta roles already dedupe sanitized output names\
    \ — plain batch path does not)\",\n    \"tests/test_pi_batch.py:425 (parallel\
    \ retry tests exist; none covers output collisions)\"\n  ],\n  \"acceptance\"\
    : [\n    \"new test: run_parallel with two tasks sharing one output path fails\
    \ closed at scheduling time (no agent invoked, clear error) or is explicitly serialized\
    \ with a warning\",\n    \"new test: run_parallel accepts an optional wave plan\
    \ and co-schedules only non-conflicting tasks (conflicting tasks never run concurrently)\"\
    ,\n    \"new test in tests/test_runtime_governance.py: plan_waves output, when\
    \ fed to run_parallel, preserves all deliverable contents (no last-write-wins)\"\
    ,\n    \"make ci passes\"\n  ]\n}\n\nSource analysis: /home/u1/ai-batch-runner/docs/auto/analyses/pbatch-ba9cd1a4.json\n\
    Verify every cited file/symbol against the repository. Preserve the supplied acceptance\
    \ checks and make them testable. Do not expand scope beyond this direction."
