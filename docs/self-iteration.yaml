# 自我迭代流水线 — ai-batch-runner 自审查（dogfooding）
#
# 用本工具自身的 meta 编排能力分析本项目：一句话起点（from_prompt）→
# 编排者动态挑选审查角色（prompts/ 模板）→ 角色交付物折回证据 → 再问，
# 直到编排者认为无需更多角色。
#
# 运行（从仓库根）：
#   python3 pi-batch.py docs/self-iteration.yaml --log-file logs/self-iterate.log
#
# 产出：docs/reviews/ 下的 kickoff + 各角色审查交付物；审查结论用于
# 下一轮代码迭代（实施高价值改进后再跑一轮验证收敛）。

git_commit: false

stages:
  # ── 阶段 1：起点输入 ──
  # 一句话描述本项目现状，让编排者有足够的上下文
  - name: kickoff
    from_prompt: |
      Analyze the ai-batch-runner project in this repository (a Python batch/pipeline
      executor for CLI coding agents, kept in sync with snaplink/ai-dev).

      Layout: pbatch/ engine package (config.py, models.py, runner.py, pipeline.py,
      cli.py) behind a thin pi-batch.py shim; 19 role prompt templates in prompts/;
      AI-SDLC review framework in ai/; locally authored engineering-gates harness:
      checks/ (filesize, ast-based complexity, root policy, style), cli.py, Makefile
      (make ci), engineering.yaml, .githooks/, .github/workflows/ci.yml;
      upstream-synced quality.py scanner; tests/ has 91 upstream + 10 local
      regression cases (tests/test_local_fixes.py).

      Self-iteration round 1 already fixed (see git log fa8a14e and README local
      fixes): output_path() honoring task.cwd, git-commit exit-code checks,
      PyYAML-missing fail-loud in load_tasks, atomic save_result, git-auto-commit.sh
      protected-branch + sensitive-file guards, test env hygiene. All verified:
      make ci green, 101 tests green under both clean and PBATCH_SCRIPT_DIR-preset
      env, quality.py --strict pbatch/ OK.

      Remaining known issues: no LICENSE chosen (needs upstream compatibility
      check); no pyproject license field; a few Medium gaps from round 1 review:
      zero tests for run_parallel, stage commands/commands_parallel, --min-interval,
      --log-file, _retry_wait 30s floor, killpg timeout path; ~20 CLI E2E subprocess
      tests invisible to make coverage.

      This is round 2: verify the round-1 fixes are real (with evidence, not just
      reading the commit), find NEW issues the previous review missed, and prioritize
      concrete improvements. Summarize architecture health and the top actionable
      findings.
    output: docs/reviews/kickoff.md
    mode: serial

  # ── 阶段 2：动态角色审查（meta 编排）──
  # 编排者分析 kickoff → 挑角色（prompts/ 模板或 ad-hoc）→ 执行 → 折回 → 再问
  - name: review
    from_outputs: kickoff
    meta: true
    role_dir: prompts
    output_dir: docs/reviews
    max_iterations: 3
    mode: serial
