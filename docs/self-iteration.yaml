# 自我迭代流水线 — ai-batch-runner 自审查（dogfooding）
#
# 用本工具自身的 meta 编排能力分析本项目：一句话起点（from_prompt）→
# 编排者动态挑选审查角色（prompts/ 模板）→ 角色交付物折回证据 → 再问，
# 直到编排者认为无需更多角色。
#
# 运行（从仓库根）：
#   python3 pi-batch.py docs/self-iteration.yaml --log-file logs/self-iterate.log
#
# 产出：docs/reviews/ 下的 kickoff + 各角色审查交付物；审查结论用于
# 下一轮代码迭代（实施高价值改进后再跑一轮验证收敛）。

git_commit: false

stages:
  # ── 阶段 1：起点输入 ──
  # 一句话描述本项目现状，让编排者有足够的上下文
  - name: kickoff
    from_prompt: |
      Analyze the ai-batch-runner project in this repository (a Python batch/pipeline
      executor for CLI coding agents, synced with snaplink/ai-dev plus a local
      governance layer).

      Engine: pbatch/ package (config, models, runner, pipeline, cli, reuse, lock,
      triage, metering, session) behind a thin pi-batch.py shim; 19 role templates
      in prompts/; ai/ SDLC review framework; locally authored gates harness
      (checks/, cli.py, Makefile make ci, engineering.yaml, .githooks, CI);
      upstream quality.py; scripts/ (rolling-analysis, full-flow, full-auto);
      tests/: 98 upstream + 71 local regression cases (tests/test_local_fixes.py).

      Two self-iteration rounds already fixed (git log): round 1 (output_path cwd,
      git exit codes, PyYAML fail-loud, atomic saves, commit guards) and round 2
      (from_dir double-prefix, resolved-path propagation, orphaned process groups,
      shell-quoting, prompt truncation, stdin rounds, verdict anchoring). A
      full-SDLC pipeline run added the 7x24 governance layer T0-T13: validator
      refactor + feedback, reuse freshness + fingerprints, log rotation, instance
      lock, circuit/stall/residue triage, metering events, budget caps, session
      fork rotation, hetero routing, JSON validator protocol, gate reason
      fail-closed, evidence fences, output caps, secretscan, approval stages.

      Current state: make ci green, 169 tests, quality --strict OK.

      This is round 3: verify the governance layer is real (with evidence, not
      just reading), find NEW issues the previous reviews missed, and prioritize
      concrete improvements. Be specific and concise.
    output: docs/reviews/kickoff.md
    mode: serial

  # ── 阶段 2：动态角色审查（meta 编排）──
  # 编排者分析 kickoff → 挑角色（prompts/ 模板或 ad-hoc）→ 执行 → 折回 → 再问
  - name: review
    from_outputs: kickoff
    meta: true
    role_dir: prompts
    output_dir: docs/reviews
    max_iterations: 3
    mode: serial
