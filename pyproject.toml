[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-batch-runner"
version = "0.3.0"
description = "Interactive TUI and governed batch/pipeline runtime for CLI coding agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
keywords = ["ai", "cli", "tui", "coding-agent", "sdlc", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "PyYAML>=6.0",  # required by --pipeline / tasks.yaml modes (also used by checks/)
    "textual>=8.2,<9",  # interactive terminal UI (pi-batch / pi-batch tui)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",      # regression suite in tests/
    "pytest-cov>=5.0",  # make coverage
    "wheel>=0.42",      # packaging regression gate must not silently skip
]

# Install as a first-class CLI like pi/codex: `pip install .` then run
# `pi-batch ...` anywhere; each project keeps its own pi-batch.yaml.
[project.scripts]
pi-batch = "pbatch.cli:main"

[project.urls]
Homepage = "https://github.com/yangwb1123/ai-batch-runner"
Repository = "https://github.com/yangwb1123/ai-batch-runner.git"
Issues = "https://github.com/yangwb1123/ai-batch-runner/issues"
Changelog = "https://github.com/yangwb1123/ai-batch-runner/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pbatch*"]

# Data files loaded at runtime via Path(__file__).with_name(...) by
# pbatch/relevance.py (role_keywords.yaml, meta role registry) and
# pbatch/classifier.py (task_keywords.yaml). Explicit list on purpose:
# a glob would silently ship (or, on a wrong key, silently miss) future
# files; see tests/test_packaging.py (loader-audit invariant). Keyed to the
# import name `pbatch`, not the distribution name.
[tool.setuptools.package-data]
pbatch = ["README.md", "role_keywords.yaml", "task_keywords.yaml"]

# Runtime assets required by an installation outside the source checkout:
# {tool_root} validators, rule registries, default pipelines, role prompts,
# evals and governance specs. Declared as glob patterns mirrored by
# MANIFEST.in so sdist and wheel carry the same surface; a deliberately
# added directory must enter both.
[tool.setuptools.data-files]
"share/ai-batch-runner" = ["pi-batch.py", "pi-batch.yaml", "quality.py"]
"share/ai-batch-runner/scripts" = ["scripts/*.py", "scripts/*.sh"]
"share/ai-batch-runner/evals" = ["evals/*.yaml"]
"share/ai-batch-runner/examples" = ["examples/*.yaml", "examples/*.md"]
"share/ai-batch-runner/examples/sdlc-inputs" = ["examples/sdlc-inputs/*.md"]
"share/ai-batch-runner/examples/schemas" = ["examples/schemas/*.json"]
"share/ai-batch-runner/agent-engineering" = ["agent-engineering/*.yaml"]
"share/ai-batch-runner/pipelines" = ["pipelines/*.yaml"]
"share/ai-batch-runner/prompts" = ["prompts/*.md"]
"share/ai-batch-runner/product-specs" = ["product-specs/*.md", "product-specs/*.yaml"]
"share/ai-batch-runner/ui-specs" = ["ui-specs/*.md", "ui-specs/*.yaml", "ui-specs/*.json"]
"share/ai-batch-runner/ui-specs/business-profiles" = ["ui-specs/business-profiles/*.md"]
"share/ai-batch-runner/ui-specs/engineering" = ["ui-specs/engineering/*.md"]
"share/ai-batch-runner/ui-specs/design-intelligence" = ["ui-specs/design-intelligence/*.md", "ui-specs/design-intelligence/*.yaml"]
"share/ai-batch-runner/backend-specs" = ["backend-specs/*.md", "backend-specs/*.yaml"]
"share/ai-batch-runner/backend-specs/design-intelligence" = ["backend-specs/design-intelligence/*.md"]
"share/ai-batch-runner/evolution-specs" = ["evolution-specs/*.md", "evolution-specs/*.yaml"]
"share/ai-batch-runner/docs" = ["docs/ENGINEERING_PHILOSOPHY.md", "docs/MIGRATION_ENGINE.md", "docs/PROJECT_STUDIO.md", "docs/CAMPAIGN_SELF_REPAIR.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "checks"]
addopts = "-q"
