[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-batch-runner"
version = "0.2.0"
description = "Serial / parallel / pipeline batch executor for any CLI-based coding agent (pi, claude, codex, gemini, opencode, ...)"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",  # required by --pipeline / tasks.yaml modes (also used by checks/)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",      # regression suite in tests/ (222 cases)
    "pytest-cov>=5.0",  # make coverage
    "wheel>=0.42",      # packaging regression gate must not silently skip
]

# Install as a first-class CLI like pi/codex: `pip install .` then run
# `pi-batch ...` anywhere; each project keeps its own pi-batch.yaml.
[project.scripts]
pi-batch = "pbatch.cli:main"

[tool.setuptools.packages.find]
include = ["pbatch*"]

# Data files loaded at runtime via Path(__file__).with_name(...) by
# pbatch/relevance.py (role_keywords.yaml, meta role registry) and
# pbatch/classifier.py (task_keywords.yaml). Explicit list on purpose:
# a glob would silently ship (or, on a wrong key, silently miss) future
# files; see tests/test_packaging.py (loader-audit invariant). Keyed to the
# import name `pbatch`, not the distribution name.
[tool.setuptools.package-data]
pbatch = ["README.md", "role_keywords.yaml", "task_keywords.yaml"]

# Runtime assets required by an installation outside the source checkout.
# Keep this list explicit: a new validator/spec/pipeline must deliberately
# enter the distribution contract and the packaging regression suite.
[tool.setuptools.data-files]
"share/ai-batch-runner" = ["pi-batch.yaml", "quality.py"]
"share/ai-batch-runner/scripts" = [
    "scripts/check-authority.py", "scripts/check-backend-experience.py",
    "scripts/check-backend-quality.py", "scripts/check-baseline.py",
    "scripts/check-changebudget.py", "scripts/check-completion-report.py",
