name: Release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build and test tools
        run: python -m pip install --upgrade build twine ".[dev]"

      - name: Verify tag and release metadata
        run: python tools/check-release.py --tag "${GITHUB_REF_NAME}"

      - name: Verify release commit is on main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "release tag must point to a commit reachable from main" >&2
            exit 1
          }

      - name: Run engineering gates
        run: make ci

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Smoke-test the installed wheel
        run: |
          python -m venv /tmp/pi-batch-release-smoke
          /tmp/pi-batch-release-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pi-batch-release-smoke/bin/pi-batch --version
          /tmp/pi-batch-release-smoke/bin/pi-batch version --json
          /tmp/pi-batch-release-smoke/bin/pi-batch tui --help

      - name: Store verified distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-binaries:
    name: Verify platform binaries
    needs: build-and-verify
    uses: ./.github/workflows/binary-verify.yml

  publish:
    name: Publish verified distribution
    needs: [build-and-verify, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ai-batch-runner
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release-assets:
    name: Publish verified binaries to GitHub Release
    needs: [build-and-verify, build-binaries, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: pi-batch-binary-*
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release without overwriting an existing version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum pi-batch-* > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" pi-batch-* SHA256SUMS \
            --verify-tag --target "${GITHUB_SHA}" --generate-notes
