name: Engineering Gates

# Modeled on snaplink's .github/workflows/engineering.yml, adapted to a
# Python project: zero-dependency gates + harness self-test + regression
# suite + coverage.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  cli-compatibility:
    name: CLI/TUI Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install product and test dependencies
        run: pip install -e ".[dev]"

      - name: CLI and headless TUI compatibility
        run: >-
          python -m pytest
          tests/test_entrypoints.py
          tests/test_tui.py
          tests/test_tui_backend.py
          tests/test_tui_entrypoints.py

  gates:
    name: Engineering Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev extras
        run: pip install -e ".[dev]"

      - name: Gate G1 — filesize
        run: make check-filesize

      - name: Gate G2 — complexity
        run: make check-complexity

      - name: Gate G3 — root policy
        run: make check-root

      - name: Gate G4 — style
        run: make check-style

      - name: Harness self-test (gate integrity)
        run: make self-test

      - name: Regression suite (tests/)
        run: make test

      - name: Rule-system eval suite (evals/)
        run: make eval

      - name: Coverage
        run: make coverage
