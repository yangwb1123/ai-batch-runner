name: Engineering Gates

# Modeled on snaplink's .github/workflows/engineering.yml, adapted to a
# Python project: zero-dependency gates + harness self-test + regression
# suite + organization contracts + coverage.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  gates:
    name: Engineering Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev extras
        run: pip install -e ".[dev]"

      - name: Gate G1 — filesize
        run: make check-filesize

      - name: Gate G2 — complexity
        run: make check-complexity

      - name: Gate G3 — root policy
        run: make check-root

      - name: Gate G4 — style
        run: make check-style

      - name: Harness self-test (gate integrity)
        run: make self-test

      - name: Regression suite (tests/)
        run: make test

      - name: Rule-system eval suite (evals/)
        run: make eval

      - name: Organization quality budget
        run: make quality

      - name: Organization specifications
        run: make org

      - name: Coverage
        run: make coverage
