name: Release Linux binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: release-linux-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Verify release source and engineering gates
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate explicit version tag
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import os, re
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("run the release workflow from main")
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]) is None:
              raise SystemExit("tag must be an explicit vX.Y.Z version")
          PY

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 3
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag and require its commit on main
        id: source
        timeout-minutes: 1
        run: |
          source_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          test "$(git rev-parse HEAD)" = "$source_sha"
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify tagged release metadata and license clearance
        timeout-minutes: 1
        run: python tools/check-release.py --tag "$RELEASE_TAG"

      - name: Install engineering test dependencies
        timeout-minutes: 10
        run: python -m pip install ".[dev]"

      - name: Run engineering gates
        timeout-minutes: 30
        run: make ci

  build-binary:
    name: Verify the Linux release binary
    needs: validate
    uses: ./.github/workflows/binary-verify.yml
    with:
      platform: linux-x86_64
      source_sha: ${{ needs.validate.outputs.source_sha }}

  publish:
    name: Publish verified Linux assets
    needs: [validate, build-binary]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: binary-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 3
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        timeout-minutes: 3
        with:
          python-version: "3.11"

      - name: Download this run's verified Linux binary
        timeout-minutes: 2
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pi-batch-binary-linux-x86_64
          path: dist/

      - name: Verify exact source, binary and license before publication
        timeout-minutes: 2
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python tools/check-release.py --tag "$RELEASE_TAG"
          python tools/binary_manifest.py verify --manifest dist/pi-batch-linux-x86_64.manifest.json --source-root .
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("dist/pi-batch-linux-x86_64.manifest.json").read_text())
          source = manifest["source"]["git"]
          if source["commit"] != os.environ["SOURCE_SHA"] or source["dirty"] is not False:
              raise SystemExit("binary must come from the exact clean release commit")
          PY
          cd dist
          sha256sum pi-batch-linux-x86_64 pi-batch-linux-x86_64.manifest.json pi-batch-linux-x86_64.LICENSE > SHA256SUMS

      - name: Recheck remote tag and create release without overwriting assets
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          gh release create "$RELEASE_TAG" \
            dist/pi-batch-linux-x86_64 \
            dist/pi-batch-linux-x86_64.manifest.json \
            dist/pi-batch-linux-x86_64.LICENSE dist/SHA256SUMS \
            --verify-tag --target "$SOURCE_SHA" \
            --title "pi-batch $RELEASE_TAG (Linux x86_64)" \
            --notes "Linux x86_64 binary built and verified from commit $SOURCE_SHA. Provider CLIs and project build tools remain external dependencies. See the attached manifest, license and SHA256SUMS."
