# Phase 2.5 (T11) — 多 Agent 协作台：异构 agent 注册 + 共享 run 账本 + 互见
# 用户需求：可选不同 agent（codex/claude/gemini/pi…）；不同 agent 能互相看到其余
# agent 的任务和当前会话；多 agent 分任务时结果共享（账本记录产物路径即共享基础）。
tasks:
  - prompt: |
      实现多 Agent 协作底座：① pi-batch.yaml 补全 claude/gemini/opencode 适配段；
      ② 新增共享 run 账本（data_dir 持久化，所有 agent 的 run/会话互相可见）；
      ③ `pi-batch agents` 子命令（list/sessions）；④ TUI `/agents` 只读面板。
      允许修改：pi-batch.yaml、pbatch/cli.py（仅 _SUBCOMMANDS 加 "agents" 一行）、
      pbatch/execution_trace.py（仅加账本钩子，≤10 行）、pbatch/tui.py（仅挂载
      /agents，≤25 行）；新增 pbatch/agent_ledger.py（≤400 行）、pbatch/tui_agents.py
      （≤300 行）、tests/test_agent_ledger.py、tests/test_tui_agents.py。其他文件不动。

      ## 已实测的 CLI 契约（codex-cli 0.149 / claude 2.1.218 / gemini 0.46.0 /
      opencode 0.149.x 环境版本；pi 为默认。代码里以配置为准，不要在任务中真跑
      claude/gemini API——只做配置与账本）
      - claude: prompt 用 -p（print 模式）；model --model；session：-r/--resume
        [value]（value=session id，交互 --resume 不带值时用最近会话；print 模式
        需要显式 id 或配合 --continue）；--fork-session；失败签名：
        context window/rate limit（anthropic.*rate limit 已有默认表）。
      - gemini: prompt -p；model -m；非交互无人值守需要 --approval-mode yolo
        （auto_edit 亦可）；--skip-trust 跳过工作区信任确认；无显式 session id
        参数（每轮新会话）；失败签名：保留默认表。
      - opencode run：prompt 为 run 后的位置参数（argument_flags.prompt 用
        ["run"]，与 codex 的 ["exec"] 同构）；model -m；session -s/--session
        <id>、--fork、--continue；--format json 结构化输出（默认不用，留
        T12 适配器）；失败签名：默认表。
      - 配置段结构参照现有 agents.codex：argument_flags / extra_args /
        session_flags / error_patterns（per-agent 覆盖语义）。

      ## A. pi-batch.yaml（agent.agents 增加三个段）
      claude：argument_flags {prompt: "-p", model: "--model"}；session_flags
      {start: [] , continue: ["--resume", "{session}"], fork: ["--resume",
      "{session}", "--fork-session"]}（说明：{session} 是 pi-batch 会话 id，
      与 claude 原生会话不一致时由用户/接力显式提供——注释写清楚）；extra_args
      []；error_patterns 缺省（不写 = 继承默认表）。
      gemini：argument_flags {prompt: "-p", model: "-m"}；extra_args
      ["--approval-mode", "yolo", "--skip-trust"]（无人值守说明注释）；
      session_flags 不配（每轮新会话，注释说明）。
      opencode：argument_flags {prompt: ["run"], model: "-m"}；session_flags
      {start: [], continue: ["-s", "{session}"], fork: ["-s", "{session}",
      "--fork"]}；extra_args []。
      每个段带一行注释说明适用场景（交互/无人值守）。

      ## B. pbatch/agent_ledger.py（共享 run 账本）
      1. 路径：config.data_dir(cwd)/agents/ledger.jsonl（cwd 由调用方传入；
         默认 os.getcwd()）。
      2. record(data_dir, *, agent, provider="", run_id="", session_id="",
         session_name="", status, task_brief, outputs=(), elapsed_ms=0,
         exit_code=0, ts=None) -> bool：
         - 单行 JSON 追加（O_APPEND 原子写单行；行 ≤4KiB 拒绝并记 warning）；
         - task_brief 截断 120 字符；outputs 每项为产物路径（≤8 个，路径
           resolve 后相对展示或原文，有界）；
         - 总额度 16MiB：超限时在锁内保留最新 1000 行并轮转（临时文件+rename）；
         - 任何写失败只 warning 不抛。
      3. query(data_dir, *, agent="", limit=50, since_ts=None) -> list[dict]：
         文件尾向有界读取（≤16MiB），按 ts 升序返回最近 limit 条；
         agent 过滤精确匹配、since 过滤 ts。
      4. agents_health(data_dir, bin_names) -> list[dict]：
         每个 bin：shutil.which 存在性、config 适配段是否完整（agent_section
         非空）、最近一条账本状态（若有）。

      ## C. runner 钩子（execution_trace.finish_task_result，≤10 行）
      在 finish_task_result 成功与否的公共收尾处调用 ledger.record（延迟 import
      避免循环）：agent=config.AGENT_BIN、status 映射（success→succeeded、
      reason 含 cancelled→cancelled、验证失败→rejected、其余失败→failed）、
      task_brief=task.prompt 截断、outputs=导出产物路径（task.output 或
      result 已保存路径，有界）、run_id/session_id/session_name/elapsed/exit_code。
      写失败只告警。TUI/pipeline/campaign/单批全部天然覆盖。

      ## D. CLI（pbatch/cli.py _SUBCOMMANDS 加 "agents" → "agent_ledger:agents_main"）
      agents_main(argv)：
      - `agents list [--json]`：agents_health 表（名称/可执行/适配/最近状态）；
      - `agents sessions [--agent X] [--limit N] [--json]`：账本查询摘要表
        （时间/agent/状态/session/task 前 40 字符）；
      - 参数错误/未知子命令 → exit 2；无账本时 sessions 输出 "no runs" 且 exit 0。
      双 COMMAND 解析（list|sessions）用 argparse subparsers 或手写分派均可，
      保持与仓库其他子命令风格一致。

      ## E. TUI /agents 面板
      pbatch/tui_agents.py：
      - AgentLedgerView：read(data_dir, limit=30) → entries；render_lines(width)
        -> list[str]（每 agent 最近条目一行：agent/状态/时间/task 摘要；按 agent
        分组，最多 8 个 agent）；纯逻辑零 Textual 依赖；
      - 无文章（空账本）时 render 明确空态一行。
      pbatch/tui.py：
      - /agents slash 命令：把 AgentLedgerView.render_lines 渲染进 conversation
        （复用 _append_entry("system", ...) 即可，不新增布局）；
      - _SLASH_HELP 文案加一行；命令面板 SystemCommand 加一项；
        _dispatch_slash handlers 加 "agents"（≤25 行合计）。

