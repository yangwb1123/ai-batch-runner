# T7.5 — 结构化 backend 模块化与文件预算
tasks:
  - prompt: |
      将 `run_turn_structured` 的结构化执行职责抽取到
      pbatch/tui_backend_structured.py，使通用 backend 与结构化执行各自保持单一职责，
      并同时满足仓库的 500 行文件预算。

      允许修改：pbatch/tui_backend.py、tests/test_tui_backend.py；新增：
      pbatch/tui_backend_structured.py。其他文件不动（包括 tui.py）；通过新模块
      re-export 保持 tui.py 现有 import 符号可用。

      拆分原则：
      1. 新模块职责单一：run_turn_structured 的完整实现（含 _execute_structured、
         事件转发 helper、结构化 cancel/interrupt 协调、结构化结果收官），只依赖
         tui_backend 暴露的公共状态（通过参数/回调传入 TUIBackend 实例），不产生
         循环 import；
      2. TUIBackend 保留：锁/会话/memory/workspace 治理与公共 API 不变；结构化
         入口若留在 TUIBackend 上，则薄委托到新模块（方法体 ≤20 行）；
      3. 行为零变化：tests/test_tui_backend.py 与 tests/test_tui.py 全部保持通过；
      4. 行数目标：pbatch/tui_backend.py ≤500；新模块 ≤500；整体组织符合 quality.py
         --strict。
      门禁：python -m pytest tests/test_tui_backend.py tests/test_tui.py
      tests/test_tui_timeline.py tests/test_tui_adapter_codex.py -q 全绿；
      python quality.py --strict . 全绿；make check-filesize 通过（只允许现有
      豁免清单，不得新增豁免项）。
      最终回复直接给出完整 Markdown 交付报告，由 runner 写入 output；不要自行写
      output 路径。报告固定包含最终模块职责、符号归属、公共 API 兼容性、验证入口和边界。
    output: docs/tui-phase0/t75-backend-split.md
    validate: pyquality
