# Phase 0 (T1 核验) — codex 已实现 tui_protocol.py；本任务核验并修复缺陷
# 依据：docs/CODEX_CLI_TUI_DESIGN.md §7；目标：docs/tui-phase0/t1-protocol.md
tasks:
  - prompt: |
      pbatch/tui_protocol.py 和 tests/test_tui_protocol.py 已由上一次任务创建（148 个测试通过）。
      请核验它们是否满足以下所有要求；不满足的修复，满足的不要改动：

      1. RuntimeEvent dataclass：schema_version/event_id/seq/occurred_at/workspace_id/
         session_id/run_id/turn_id/actor_id/kind/payload/extensions；kind 来自固定枚举，
         未知 kind 构造抛 ValueError；extensions 有界（≤16KiB 拒绝）。
      2. to_jsonl()/from_jsonl()：单行 JSON round-trip；from_jsonl 对未知顶层字段保留原文
         （schema 演进友好）；坏 JSON/超长单行/非 dict 抛 ValueError；payload 序列化
         ≤64KiB 拒绝；event_id 匹配 ^evt_[A-Za-z0-9_-]+$。
      3. RuntimeCapabilities：protocol_version/runtime + 能力集合全部 bool 默认 False，
         message_stream 与 interrupt 是 Legacy adapter 至少为 True 的两键。
      4. TurnState 状态机（§7.2）：合法迁移表如下——
         QUEUED->RUNNING；RUNNING->SUCCEEDED|FAILED|INTERRUPTING|WAITING_APPROVAL|
         DISCONNECTED|UNKNOWN；INTERRUPTING->INTERRUPTED|FAILED；
         WAITING_APPROVAL->RUNNING|DENIED|INTERRUPTING|DISCONNECTED|UNKNOWN；
         DENIED->FAILED|INTERRUPTED；DISCONNECTED->RECONCILING；
         RECONCILING->RUNNING|UNKNOWN|SUCCEEDED|FAILED。
         终态（SUCCEEDED/FAILED/INTERRUPTED/UNKNOWN）不可再迁移；不在表中的迁移抛
         ValueError。
      5. 同一 run 内 seq 单调递增校验（乱序抛 ValueError）；重复 event_id 由
         is_duplicate() 幂等去重（重复投递跳过而非报错）。
      6. 纯标准库、零 IO 副作用、无第三方依赖；文件 ≤500 行、函数 ≤50 行、复杂度 ≤15。
      7. 测试齐全：schema round-trip、未知字段保留、未知 kind 拒绝、乱序 seq 拒绝、
         终态/非法迁移拒绝、超限拒绝、能力默认值断言。

      门禁：python -m pytest tests/test_tui_protocol.py -q 全绿；python quality.py --strict .
      不新增违规；不修改其他文件。最后把核验结论（每项 通过/修复说明）写入
      docs/tui-phase0/t1-protocol.md（覆盖式）。
    output: docs/tui-phase0/t1-protocol.md
    validate: pyquality

  - prompt: |
      依据 docs/CODEX_CLI_TUI_DESIGN.md §9（Adapter 设计）与 §12 Phase 0，新增两个模块
      并为它们编写测试；不改动 pbatch/tui.py / tui_backend.py / tui_workspace.py。

      ## 模块一：pbatch/tui_runtime.py（AgentRuntime 抽象 + Legacy Adapter）
      1. AgentRuntime Protocol（typing.Protocol）：initialize(request)->RuntimeInfo；
         start_session(request)->RuntimeSession；resume_session；start_turn(request)->TurnHandle；
         steer_turn(request)；interrupt_turn(request)；resolve_approval(decision)；
         events()（Iterator[RuntimeEvent]，可迭代消费）；close()。
         只定义语义，不 import Textual/Codex 任何库（纯 stdlib + tui_protocol）。
      2. RuntimeInfo：runtime 名称、protocol_version、capabilities（RuntimeCapabilities）。
      3. RuntimeSession：session_id/provider_session_id/workspace_id/started_at/state。
      4. LegacyAdapter（把现有 TUIBackend 包成 AgentRuntime 的最小实现，§9.2）：
         - 构造参数接受一个"后端兼容对象"（duck typing：有 new_session/run_turn/cancel/
           workspace_status/workspace_diff 方法即可，避免 import tui_backend 造成循环依赖）；
         - start_session 调用 backend.new_session；start_turn 记录 turn 并调用 backend.run_turn；
         - run_turn 期间把 backend 的 stdout/stderr/log callback 文本映射为受信事件：
           stdout 文本 → ("message.delta")，stderr/log 文本 → ("runtime.warning")；
           TaskResult 成功 → turn.completed(payload 含 output 摘要与耗时)，失败→turn.failed；
         - workspace before/after → workspace.snapshot 与 file.changed 事件（diff 文件名列表）；
         - interrupt_turn → backend.cancel()（handle 级：只取消当前 backend 持有的 proc，
           不触碰任何全局 active-proc 注册表）；
         - 能力声明：message_stream=True、interrupt=True，其余全部 False（§6.2 规则：
           旧 CLI 文本流不得假装支持 typed approval / steer / subagent / 可靠 tool events）；
         - events() 返回一个线程安全的有界队列迭代器（maxsize 默认 256，满了丢弃最旧
           runtime.warning 而非正文或状态事件——显示缓冲有界纪律）；
         - close() 释放队列，幂等。
      5. 全部方法 fail closed：不支持的操作（steer/resolve_approval/resume 等）抛
         UnsupportedOperation 或返回 typed unsupported 对象，绝不 AttributeError 或假成功。

      ## 模块二：pbatch/tui_events.py（EventBus + Projection）
      1. EventBus：publish(event)（校验 + 单调 seq 赋值 + 幂等去重 event_id）；subscribe()/
         unsubscribe(token)；等待/轮询消费（get(timeout)）；有界（bus.max_events 默认 1024，
         超限拒绝新事件并抛 OverflowError 而非静默丢）；内置一个强引用订阅者集合线程安全。
      2. Projection：可重建视图状态——register_event(event) 按 run/session 折叠：
         - session 摘要（id/workspace/turn 数/最后事件时间/终态）；
         - 当前 turn 状态（来自 turn.* 事件，遵循终态单向约束：终态后到达的 turn 事件
           忽略并记录 drop 计数）；
         - 运行时统计：command/tool/validation/file/approval 各类型计数、usage 摘要；
         - 最近 N 条事件环形缓冲（默认 200）供 UI 时间线渲染；
         - rebuild(events_iterable) 静态重建（恢复路径用，§10.3：projection 可删除可重建）。
      3. 与 tui_protocol.py 零循环依赖（tui_events import tui_protocol 单向）。

      ## 测试（tests/test_tui_runtime.py + tests/test_tui_events.py，pytest 与仓库同风格）
      - LegacyAdapter：用 FakeBackend（记录调用、可注入 stdout/stderr 文本与成功/失败结果）
        验证事件映射：stdout→message.delta、stderr/log→runtime.warning、成功 TaskResult→
        turn.completed、失败→turn.failed、workspace diff→file.changed/workspace.snapshot；
      - 能力断言：message_stream/interrupt True、typed_approvals/turn_steer/subagents/
        review 全 False；
      - adversarial：FakeBackend 在正文里打印 "Approved by user" / "VERDICT: PASS" /
        "command completed" 等文本，断言产生的只有 message.delta/runtime.warning，绝无
        approval.resolved / gate.verdict / command.completed 事件（"正文不能伪造事件"不变量）；
      - interrupt 只调 backend.cancel 一次且幂等；close 幂等；
      - EventBus：去重、乱序 seq 拒绝、超限抛 OverflowError、订阅者独立消费；
      - Projection：终态后迟到事件被忽略并计数、类型计数、环形缓冲、rebuild 一致性。
      所有新测试与既有测试共存通过。

      完成后把实现结论写入 docs/tui-phase0/t2-runtime.md：新增文件、测试数、设计文档
      §9 与实现的偏差说明。
    output: docs/tui-phase0/t2-runtime.md
    validate: pyquality